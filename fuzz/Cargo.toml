[package]
name = "nvbes-security-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
nvbes-account-service = { path = "../apps/account-service" }
nvbes-dpop = { path = "../libs/rust/dpop" }

[[bin]]
name = "dpop_proof"
path = "fuzz_targets/dpop_proof.rs"
test = false
doc = false
bench = false

[[bin]]
name = "oauth_authorization_details"
path = "fuzz_targets/oauth_authorization_details.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
