[workspace]
members = [
  "apps/billing-service",
  "apps/email-worker",
  "apps/account-service",
  "apps/identity-service",
  "apps/trust-risk-service",
  "libs/rust/audit",
  "libs/rust/billing",
  "libs/rust/core",
  "libs/rust/dpop",
  "libs/rust/redis",
  "libs/rust/region",
  "libs/rust/email",
  "libs/rust/adapters/analytics-posthog",
  "libs/rust/adapters/email-scaleway",
  "libs/rust/identity-sdk-backend",
  "libs/rust/observability",
  "libs/rust/platform",
  "libs/rust/ports",
  "libs/rust/product-analytics",
  "libs/rust/products/account",
  "libs/rust/products/cloud",
  "libs/rust/products/developer",
  "libs/rust/products/enterprise",
  "libs/rust/products/identity",
  "libs/rust/scan",
  "libs/rust/storage",
  "libs/rust/tenancy",
  "libs/rust/trust-risk",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "AGPL-3.0-only"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0.103"
argon2 = "0.5.3"
aes-gcm = "0.10.3"
async-graphql = "7.0.17"
async-graphql-axum = "7.0.17"
axum = { version = "0.8.9", features = ["multipart"] }
axum-server = { version = "0.8.0", default-features = false, features = ["tls-rustls"] }
base64 = "0.22.1"
chrono = { version = "0.4.44", features = ["serde"] }
chrono-tz = "0.10.4"
csv = "1.3.1"
data-encoding = "2.9.0"
hex = "0.4"
hkdf = "0.12.4"
hmac = "0.12.1"
ipnet = "2.11.0"
password-hash = { version = "0.5.0", features = ["rand_core"] }
proptest = "1.9.0"
prost = "0.13.5"
rand = "0.9.2"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
sentry = { version = "0.48.3", default-features = false, features = ["backtrace", "contexts", "debug-images", "panic", "release-health", "reqwest", "rustls"] }
sha1 = "0.10.6"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
socket2 = "0.6"
roxmltree = "0.20.0"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
tokio = { version = "1.52.3", features = ["full"] }
tokio-rustls = "0.26"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
uuid = { version = "1.23.1", features = ["serde", "v4"] }
urlencoding = "2.1.3"
webauthn-rs = { version = "0.5.0", features = ["conditional-ui", "danger-allow-state-serialisation"] }
thiserror = "2"
metrics = "0.24.6"
lettre = { version = "0.11.19", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
metrics-exporter-prometheus = "0.16"
opentelemetry = "0.31"
opentelemetry_sdk = { version = "0.31", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.31", features = ["grpc-tonic", "trace"] }
pyroscope = { version = "2.0.6", features = ["backend-pprof-rs"] }
tracing-opentelemetry = "0.32"
tonic = "0.14.6"
tonic-health = "0.14.6"
tower-http = { version = "0.6", features = ["cors", "timeout", "compression-full"] }
utoipa = { version = "5", features = ["axum_extras", "uuid", "chrono"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }

[profile.dev]
incremental = true
opt-level = 0
debug = 1

[profile.dev.package."*"]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
