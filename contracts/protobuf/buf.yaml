version: v2
modules:
  - path: .
lint:
  use:
    - STANDARD
  except:
    # Existing V1 RPCs deliberately expose domain response types shared across
    # operator commands. Renaming them would be a breaking contract migration.
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
  disallow_comment_ignores: true
breaking:
  use:
    - FILE
  except:
    - FILE_NO_DELETE
