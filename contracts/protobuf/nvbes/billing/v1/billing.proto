}

message AdminUnpublishedEntitlementChange {
  string id = 1;
  string tenant_id = 2;
  string tenant_name = 3;
  string event_id = 4;
  string created_at = 5;
}

message AdminEntitlementsActionRequest {
  nvbes.platform.v1.RequestContext context = 1;
  string workspace_id = 2;
  AdminEntitlementsActionKind action_kind = 3;
  string reason = 4;
}

enum AdminEntitlementsActionKind {
  ADMIN_ENTITLEMENTS_ACTION_KIND_UNSPECIFIED = 0;
  ADMIN_ENTITLEMENTS_ACTION_KIND_PUBLISH_CHANGES = 1;
}

message AdminEntitlementsActionResult {
  string object_id = 1;
  string action_kind = 2;
  string status = 3;
  string audit_action = 4;
  int64 published_change_count = 5;
  string metadata_json = 6;
}

message AdminOperationsCenterSnapshot {
  int64 provider_event_failure_count = 1;
  int64 provider_event_backlog_count = 2;
  int64 export_pending_count = 3;
  int64 export_failed_count = 4;
  int64 reconciliation_pending_count = 5;
  int64 reconciliation_failed_count = 6;
  int64 unresolved_reconciliation_difference_count = 7;
  repeated RecentProviderFailure recent_provider_failures = 8;
  repeated RecentExportRun recent_export_runs = 9;
  repeated RecentReconciliationDifference recent_reconciliation_differences = 10;
}

message RecentProviderFailure {
  string id = 1;
  string tenant_id = 2;
  string tenant_name = 3;
  string provider = 4;
  string provider_event_id = 5;
  string event_type = 6;
  string status = 7;
  string received_at = 8;
}

message RecentExportRun {
  string id = 1;
  string export_type = 2;
  string status = 3;
  string period_start = 4;
  string period_end = 5;
  string created_at = 6;
  string updated_at = 7;
}

message RecentReconciliationDifference {
  string id = 1;
  string tenant_id = 2;
  string tenant_name = 3;
  string difference_type = 4;
  string severity = 5;
  string created_at = 6;
}

message AdminOperationsActionRequest {
  nvbes.platform.v1.RequestContext context = 1;
  string workspace_id = 2;
  AdminOperationsActionKind action_kind = 3;
  string target_id = 4;
  string reason = 5;
}

enum AdminOperationsActionKind {
  ADMIN_OPERATIONS_ACTION_KIND_UNSPECIFIED = 0;
  ADMIN_OPERATIONS_ACTION_KIND_REPLAY_PROVIDER_EVENT = 1;
  ADMIN_OPERATIONS_ACTION_KIND_REPLAY_EXPORT_RUN = 2;
  ADMIN_OPERATIONS_ACTION_KIND_RESOLVE_RECONCILIATION_DIFFERENCE = 3;
}

message AdminOperationsActionResult {
  string object_id = 1;
  string action_kind = 2;
  string status = 3;
  string audit_action = 4;
  string target_type = 5;
  string previous_state = 6;
}

message AdminBillingPlatformActionRequest {
  nvbes.platform.v1.RequestContext context = 1;
  string workspace_id = 2;
  AdminBillingPlatformActionKind action_kind = 3;
  string target_id = 4;
  string reason = 5;
  CreateBillingRoutingRuleInput routing_rule = 6;
}

enum AdminBillingPlatformActionKind {
  ADMIN_BILLING_PLATFORM_ACTION_KIND_UNSPECIFIED = 0;
  ADMIN_BILLING_PLATFORM_ACTION_KIND_APPROVE_KYC_PROFILE = 1;
  ADMIN_BILLING_PLATFORM_ACTION_KIND_REJECT_KYC_PROFILE = 2;
  ADMIN_BILLING_PLATFORM_ACTION_KIND_ACTIVATE_EINVOICING_PROFILE = 3;
  ADMIN_BILLING_PLATFORM_ACTION_KIND_CREATE_ROUTING_RULE = 4;
  ADMIN_BILLING_PLATFORM_ACTION_KIND_ENABLE_ROUTING_RULE = 5;
  ADMIN_BILLING_PLATFORM_ACTION_KIND_DISABLE_ROUTING_RULE = 6;
  ADMIN_BILLING_PLATFORM_ACTION_KIND_APPROVE_FRAUD_ASSESSMENT = 7;
  ADMIN_BILLING_PLATFORM_ACTION_KIND_REJECT_FRAUD_ASSESSMENT = 8;
  ADMIN_BILLING_PLATFORM_ACTION_KIND_TRUST_FRAUD_ASSESSMENT = 9;
}

message CreateBillingRoutingRuleInput {
  string provider = 1;
  string country = 2;
  string currency = 3;
  string payment_method = 4;
  string customer_type = 5;
  int64 min_amount_minor = 6;
  int64 max_amount_minor = 7;
  bool has_min_amount_minor = 8;
  bool has_max_amount_minor = 9;
  bool fallback_enabled = 10;
  int32 priority = 11;
}

message GetAdminBillingPlatformCenterRequest {
  nvbes.platform.v1.RequestContext context = 1;
}

message AdminBillingPlatformCenterSnapshot {
  int64 active_provider_count = 1;
  int64 active_provider_account_count = 2;
  int64 active_routing_rule_count = 3;
  int64 fallback_routing_rule_count = 4;
  int64 planned_migration_count = 5;
  int64 pending_kyc_profile_count = 6;
  int64 region_policy_count = 7;
  int64 active_einvoicing_profile_count = 8;
  repeated BillingProviderSummary providers = 9;
  repeated BillingProviderRoutingRule routing_rules = 10;
  repeated ProviderMigrationRun provider_migrations = 11;
  repeated KycProfile kyc_profiles = 12;
  repeated RegionPolicy region_policies = 13;
  repeated EinvoicingProfile einvoicing_profiles = 14;
}

message BillingProviderSummary {
  string provider = 1;
  string status = 2;
  int64 account_count = 3;
  string updated_at = 4;
}

message BillingProviderRoutingRule {
  string id = 1;
  int32 priority = 2;
  string provider = 3;
  string country = 4;
  string currency = 5;
  string payment_method = 6;
  string customer_type = 7;
  int64 min_amount_minor = 8;
  int64 max_amount_minor = 9;
  bool has_min_amount_minor = 10;
  bool has_max_amount_minor = 11;
  bool fallback_enabled = 12;
  string status = 13;
  string created_at = 14;
  string updated_at = 15;
}

message ProviderMigrationRun {
  string id = 1;
  string tenant_id = 2;
  string tenant_name = 3;
  string from_provider = 4;
  string to_provider = 5;
  string status = 6;
  string started_at = 7;
  string updated_at = 8;
}

