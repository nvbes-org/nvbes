  ADMIN_REVENUE_ACTION_KIND_UNSPECIFIED = 0;
  ADMIN_REVENUE_ACTION_KIND_CLOSE_DUNNING_CASE = 1;
  ADMIN_REVENUE_ACTION_KIND_REOPEN_DUNNING_CASE = 2;
  ADMIN_REVENUE_ACTION_KIND_HOLD_INVOICE = 3;
