}

message GetAdminUsageCenterRequest {
  nvbes.platform.v1.RequestContext context = 1;
}

message AdminUsageCenterSnapshot {
  int64 active_meter_count = 1;
  int64 usage_event_count_24h = 2;
  int64 usage_quantity_24h = 3;
  int64 correction_count_30d = 4;
  int64 rollup_count_current_period = 5;
  int64 distinct_tenant_count_24h = 6;
  repeated AdminMeterUsage meter_usage_24h = 7;
  repeated AdminTenantUsage tenant_usage_24h = 8;
  repeated AdminUsageRollup recent_rollups = 9;
  repeated AdminUsageCorrection recent_corrections = 10;
}

message AdminMeterUsage {
  string meter_code = 1;
  string unit = 2;
  int64 event_count = 3;
  int64 quantity = 4;
}

message AdminTenantUsage {
  string tenant_id = 1;
  string tenant_name = 2;
  int64 event_count = 3;
  int64 quantity = 4;
}

message AdminUsageRollup {
  string id = 1;
  string tenant_id = 2;
  string tenant_name = 3;
  string workspace_id = 4;
  string workspace_name = 5;
  string meter_code = 6;
  int64 quantity = 7;
  string unit = 8;
  string period_start = 9;
  string period_end = 10;
}

message AdminUsageCorrection {
  string id = 1;
  string tenant_id = 2;
  string tenant_name = 3;
  string meter_code = 4;
  int64 quantity_delta = 5;
  string reason = 6;
  string created_by_principal_id = 7;
  string created_at = 8;
}

message AdminUsageActionRequest {
  nvbes.platform.v1.RequestContext context = 1;
  string workspace_id = 2;
  AdminUsageActionKind action_kind = 3;
  string usage_event_id = 4;
  string meter_code = 5;
  int64 quantity_delta = 6;
  string target_id = 7;
  string reason = 8;
}

enum AdminUsageActionKind {
  ADMIN_USAGE_ACTION_KIND_UNSPECIFIED = 0;
  ADMIN_USAGE_ACTION_KIND_CORRECT_USAGE = 1;
  ADMIN_USAGE_ACTION_KIND_FREEZE_METER = 2;
  ADMIN_USAGE_ACTION_KIND_REPLAY_ROLLUP = 3;
}

message AdminUsageActionResult {
  string object_id = 1;
  string action_kind = 2;
  string status = 3;
  string audit_action = 4;
  string target_type = 5;
  string meter_code = 6;
  int64 quantity_delta = 7;
  string metadata_json = 8;
  string description = 9;
}

message GetAdminEntitlementsCenterRequest {
  nvbes.platform.v1.RequestContext context = 1;
}

