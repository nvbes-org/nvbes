syntax = "proto3";

package nvbes.billing.v1;

import "nvbes/platform/v1/common.proto";

service BillingService {
  rpc GetBillingOverview(GetBillingOverviewRequest) returns (BillingOverview);
  rpc GetBillingPortal(GetBillingPortalRequest) returns (BillingPortal);
  rpc CreateCheckout(CreateCheckoutRequest) returns (CheckoutSession);
  rpc CreatePortal(CreatePortalRequest) returns (PortalSession);
  rpc GetEntitlements(GetEntitlementsRequest) returns (EntitlementSnapshot);
  rpc ListInvoices(ListInvoicesRequest) returns (ListInvoicesResponse);
  rpc GetInvoice(GetInvoiceRequest) returns (BillingInvoice);
  rpc RecordLedgerEntry(RecordLedgerEntryRequest) returns (LedgerEntry);
  rpc ListLedgerEntries(ListLedgerEntriesRequest) returns (ListLedgerEntriesResponse);
  rpc IngestProviderWebhook(IngestProviderWebhookRequest) returns (ProviderWebhookEvent);
  rpc ListProviderWebhookEvents(ListProviderWebhookEventsRequest) returns (ListProviderWebhookEventsResponse);
  rpc ReconcileProviderWebhook(ReconcileProviderWebhookRequest) returns (ProviderWebhookEvent);
  rpc GetAdminCommandCenterBillingMetrics(GetAdminCommandCenterBillingMetricsRequest) returns (AdminCommandCenterBillingMetrics);
  rpc GetAdminOperationsCenter(GetAdminOperationsCenterRequest) returns (AdminOperationsCenterSnapshot);
  rpc GetAdminBillingOverview(GetAdminBillingOverviewRequest) returns (AdminBillingOverview);
  rpc GetAdminTenantBillingSummary(GetAdminTenantBillingSummaryRequest) returns (AdminTenantBillingSummary);
  rpc GetAdminWorkspaceBillingSummary(GetAdminWorkspaceBillingSummaryRequest) returns (AdminWorkspaceBillingSummary);
  rpc ListAdminProviderEventFailures(ListAdminProviderEventFailuresRequest) returns (AdminProviderEventFailures);
  rpc SearchAdminBilling(SearchAdminBillingRequest) returns (AdminBillingSearchResults);
  rpc BuildAdminFinanceExport(BuildAdminFinanceExportRequest) returns (AdminFinanceExport);
  rpc GetAdminUsageCenter(GetAdminUsageCenterRequest) returns (AdminUsageCenterSnapshot);
  rpc RunAdminUsageAction(AdminUsageActionRequest) returns (AdminUsageActionResult);
  rpc GetAdminEntitlementsCenter(GetAdminEntitlementsCenterRequest) returns (AdminEntitlementsCenterSnapshot);
  rpc RunAdminEntitlementsAction(AdminEntitlementsActionRequest) returns (AdminEntitlementsActionResult);
  rpc RunAdminOperationsAction(AdminOperationsActionRequest) returns (AdminOperationsActionResult);
  rpc GetAdminBillingPlatformCenter(GetAdminBillingPlatformCenterRequest) returns (AdminBillingPlatformCenterSnapshot);
  rpc SimulateAdminBillingRouting(SimulateAdminBillingRoutingRequest) returns (AdminBillingRoutingSimulationResult);
  rpc RunAdminBillingPlatformAction(AdminBillingPlatformActionRequest) returns (AdminBillingPlatformActionResult);
  rpc RunAdminBillingAction(AdminBillingActionRequest) returns (AdminBillingActionResult);
  rpc GetAdminRevenueCenter(GetAdminRevenueCenterRequest) returns (AdminRevenueCenterSnapshot);
  rpc RunAdminRevenueAction(AdminRevenueActionRequest) returns (AdminRevenueActionResult);
  rpc GetAdminRiskDecisionCenter(GetAdminRiskDecisionCenterRequest) returns (AdminRiskDecisionCenterSnapshot);
  rpc RunAdminRiskAction(AdminRiskActionRequest) returns (AdminRiskActionResult);
  rpc IngestUsage(UsageEvent) returns (UsageIngestResponse);
  rpc RunReconciliation(RunReconciliationRequest) returns (ReconciliationRun);
}

message GetBillingOverviewRequest {
  nvbes.platform.v1.RequestContext context = 1;
  string workspace_id = 2;
}

message GetBillingPortalRequest {
  nvbes.platform.v1.RequestContext context = 1;
  string workspace_id = 2;
}

message CreateCheckoutRequest {
  nvbes.platform.v1.RequestContext context = 1;
  string workspace_id = 2;
  string plan_code = 3;
  string success_url = 4;
  string cancel_url = 5;
}

message CreatePortalRequest {
  nvbes.platform.v1.RequestContext context = 1;
  string workspace_id = 2;
  string return_url = 3;
}

message GetEntitlementsRequest {
  nvbes.platform.v1.RequestContext context = 1;
  string workspace_id = 2;
}

message ListInvoicesRequest {
  nvbes.platform.v1.RequestContext context = 1;
  string workspace_id = 2;
  nvbes.platform.v1.CursorPageRequest page = 3;
}

message GetInvoiceRequest {
  nvbes.platform.v1.RequestContext context = 1;
  string workspace_id = 2;
  string invoice_id = 3;
}

message RecordLedgerEntryRequest {
  nvbes.platform.v1.RequestContext context = 1;
  string tenant_id = 2;
  string workspace_id = 3;
  string entry_type = 4;
  string source_type = 5;
  string source_id = 6;
  int64 amount_minor = 7;
  string currency = 8;
  string occurred_at = 9;
  string idempotency_key = 10;
}

message ListLedgerEntriesRequest {
  nvbes.platform.v1.RequestContext context = 1;
  string tenant_id = 2;
  string workspace_id = 3;
  nvbes.platform.v1.CursorPageRequest page = 4;
}

message IngestProviderWebhookRequest {
  nvbes.platform.v1.RequestContext context = 1;
  string provider = 2;
  string provider_event_id = 3;
  string event_type = 4;
  string received_at = 5;
  string payload_json = 6;
  string signature = 7;
}

message ListProviderWebhookEventsRequest {
  nvbes.platform.v1.RequestContext context = 1;
  string provider = 2;
  string status = 3;
  nvbes.platform.v1.CursorPageRequest page = 4;
}

message ReconcileProviderWebhookRequest {
  nvbes.platform.v1.RequestContext context = 1;
  string provider_event_id = 2;
  string action = 3;
  string reason = 4;
}

message CheckoutSession {
  string checkout_url = 1;
  string provider = 2;
  string expires_at = 3;
  string checkout_session_id = 4;
}

message PortalSession {
  string portal_url = 1;
  string provider = 2;
}

message GetAdminCommandCenterBillingMetricsRequest {
  nvbes.platform.v1.RequestContext context = 1;
}

message AdminCommandCenterBillingMetrics {
  int64 pending_kyc_approval_count = 1;
  int64 provider_failure_count = 2;
  int64 overdue_invoice_count = 3;
  int64 failed_payment_count = 4;
}

message GetAdminOperationsCenterRequest {
  nvbes.platform.v1.RequestContext context = 1;
}

message GetAdminBillingOverviewRequest {
  nvbes.platform.v1.RequestContext context = 1;
  string workspace_id = 2;
}

message AdminBillingOverview {
