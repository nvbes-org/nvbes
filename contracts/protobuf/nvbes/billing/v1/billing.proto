syntax = "proto3";

package nvbes.billing.v1;

import "nvbes/platform/v1/common.proto";

service BillingService {
  rpc GetBillingOverview(GetBillingOverviewRequest) returns (BillingOverview);
  rpc GetBillingPortal(GetBillingPortalRequest) returns (BillingPortal);
  rpc CreateCheckout(CreateCheckoutRequest) returns (CheckoutSession);
  rpc CreatePortal(CreatePortalRequest) returns (PortalSession);
  rpc GetAdminCommandCenterBillingMetrics(GetAdminCommandCenterBillingMetricsRequest) returns (AdminCommandCenterBillingMetrics);
  rpc GetAdminOperationsCenter(GetAdminOperationsCenterRequest) returns (AdminOperationsCenterSnapshot);
  rpc RunAdminOperationsAction(AdminOperationsActionRequest) returns (AdminOperationsActionResult);
  rpc RunAdminBillingPlatformAction(AdminBillingPlatformActionRequest) returns (AdminBillingPlatformActionResult);
  rpc RunAdminBillingAction(AdminBillingActionRequest) returns (AdminBillingActionResult);
  rpc RunAdminRevenueAction(AdminRevenueActionRequest) returns (AdminRevenueActionResult);
  rpc IngestUsage(UsageEvent) returns (UsageIngestResponse);
  rpc RunReconciliation(RunReconciliationRequest) returns (ReconciliationRun);
}

message GetBillingOverviewRequest {
  nvbes.platform.v1.RequestContext context = 1;
  string workspace_id = 2;
}

message GetBillingPortalRequest {
  nvbes.platform.v1.RequestContext context = 1;
  string workspace_id = 2;
}

message CreateCheckoutRequest {
  nvbes.platform.v1.RequestContext context = 1;
  string workspace_id = 2;
  string plan_code = 3;
  string success_url = 4;
  string cancel_url = 5;
}

message CreatePortalRequest {
  nvbes.platform.v1.RequestContext context = 1;
  string workspace_id = 2;
  string return_url = 3;
}

message CheckoutSession {
  string checkout_url = 1;
  string provider = 2;
  string expires_at = 3;
  string checkout_session_id = 4;
}

message PortalSession {
  string portal_url = 1;
  string provider = 2;
}

message GetAdminCommandCenterBillingMetricsRequest {
  nvbes.platform.v1.RequestContext context = 1;
}

message AdminCommandCenterBillingMetrics {
  int64 pending_kyc_approval_count = 1;
  int64 provider_failure_count = 2;
  int64 overdue_invoice_count = 3;
  int64 failed_payment_count = 4;
}

message GetAdminOperationsCenterRequest {
  nvbes.platform.v1.RequestContext context = 1;
}

message AdminOperationsCenterSnapshot {
  int64 provider_event_failure_count = 1;
  int64 provider_event_backlog_count = 2;
  int64 export_pending_count = 3;
  int64 export_failed_count = 4;
  int64 reconciliation_pending_count = 5;
  int64 reconciliation_failed_count = 6;
  int64 unresolved_reconciliation_difference_count = 7;
  repeated RecentProviderFailure recent_provider_failures = 8;
  repeated RecentExportRun recent_export_runs = 9;
  repeated RecentReconciliationDifference recent_reconciliation_differences = 10;
}

message RecentProviderFailure {
  string id = 1;
  string tenant_id = 2;
  string tenant_name = 3;
  string provider = 4;
  string provider_event_id = 5;
  string event_type = 6;
  string status = 7;
  string received_at = 8;
}

message RecentExportRun {
  string id = 1;
  string export_type = 2;
  string status = 3;
  string period_start = 4;
  string period_end = 5;
  string created_at = 6;
  string updated_at = 7;
}

message RecentReconciliationDifference {
  string id = 1;
  string tenant_id = 2;
  string tenant_name = 3;
  string difference_type = 4;
  string severity = 5;
  string created_at = 6;
}

message AdminOperationsActionRequest {
  nvbes.platform.v1.RequestContext context = 1;
  string workspace_id = 2;
  AdminOperationsActionKind action_kind = 3;
  string target_id = 4;
  string reason = 5;
}

enum AdminOperationsActionKind {
  ADMIN_OPERATIONS_ACTION_KIND_UNSPECIFIED = 0;
  ADMIN_OPERATIONS_ACTION_KIND_REPLAY_PROVIDER_EVENT = 1;
  ADMIN_OPERATIONS_ACTION_KIND_REPLAY_EXPORT_RUN = 2;
  ADMIN_OPERATIONS_ACTION_KIND_RESOLVE_RECONCILIATION_DIFFERENCE = 3;
}

message AdminOperationsActionResult {
  string object_id = 1;
  string action_kind = 2;
  string status = 3;
  string audit_action = 4;
  string target_type = 5;
  string previous_state = 6;
}

message AdminBillingPlatformActionRequest {
  nvbes.platform.v1.RequestContext context = 1;
  string workspace_id = 2;
  AdminBillingPlatformActionKind action_kind = 3;
  string target_id = 4;
  string reason = 5;
  CreateBillingRoutingRuleInput routing_rule = 6;
}

enum AdminBillingPlatformActionKind {
  ADMIN_BILLING_PLATFORM_ACTION_KIND_UNSPECIFIED = 0;
  ADMIN_BILLING_PLATFORM_ACTION_KIND_APPROVE_KYC_PROFILE = 1;
  ADMIN_BILLING_PLATFORM_ACTION_KIND_REJECT_KYC_PROFILE = 2;
  ADMIN_BILLING_PLATFORM_ACTION_KIND_ACTIVATE_EINVOICING_PROFILE = 3;
  ADMIN_BILLING_PLATFORM_ACTION_KIND_CREATE_ROUTING_RULE = 4;
  ADMIN_BILLING_PLATFORM_ACTION_KIND_ENABLE_ROUTING_RULE = 5;
  ADMIN_BILLING_PLATFORM_ACTION_KIND_DISABLE_ROUTING_RULE = 6;
  ADMIN_BILLING_PLATFORM_ACTION_KIND_APPROVE_FRAUD_ASSESSMENT = 7;
  ADMIN_BILLING_PLATFORM_ACTION_KIND_REJECT_FRAUD_ASSESSMENT = 8;
  ADMIN_BILLING_PLATFORM_ACTION_KIND_TRUST_FRAUD_ASSESSMENT = 9;
}

message CreateBillingRoutingRuleInput {
  string provider = 1;
  string country = 2;
  string currency = 3;
  string payment_method = 4;
  string customer_type = 5;
  int64 min_amount_minor = 6;
  int64 max_amount_minor = 7;
  bool has_min_amount_minor = 8;
  bool has_max_amount_minor = 9;
  bool fallback_enabled = 10;
  int32 priority = 11;
}

message AdminBillingPlatformActionResult {
  string object_id = 1;
  string action_kind = 2;
  string status = 3;
  string audit_action = 4;
  string target_type = 5;
  string previous_state = 6;
  string metadata_json = 7;
}

message AdminBillingActionRequest {
  nvbes.platform.v1.RequestContext context = 1;
  string workspace_id = 2;
  AdminBillingActionKind action_kind = 3;
  string invoice_id = 4;
  string payment_id = 5;
  int64 amount_minor = 6;
  string currency = 7;
  string provider = 8;
  string direction = 9;
  string reason = 10;
  string provider_event_id = 11;
  string from_provider = 12;
  string to_provider = 13;
  string subscription_id = 14;
  int64 grace_days = 15;
}

enum AdminBillingActionKind {
  ADMIN_BILLING_ACTION_KIND_UNSPECIFIED = 0;
  ADMIN_BILLING_ACTION_KIND_CREATE_CREDIT_NOTE = 1;
  ADMIN_BILLING_ACTION_KIND_CREATE_WRITE_OFF = 2;
  ADMIN_BILLING_ACTION_KIND_CREATE_REFUND_INTENT = 3;
  ADMIN_BILLING_ACTION_KIND_CREATE_MANUAL_COMPENSATION = 4;
  ADMIN_BILLING_ACTION_KIND_REPLAY_PROVIDER_EVENT = 5;
  ADMIN_BILLING_ACTION_KIND_CREATE_PROVIDER_MIGRATION = 6;
  ADMIN_BILLING_ACTION_KIND_OVERRIDE_GRACE_PERIOD = 7;
}

message AdminBillingActionResult {
  string object_id = 1;
  uint64 ledger_entry_count = 2;
  string audit_action = 3;
  string target_type = 4;
  string provider = 5;
  string provider_event_id = 6;
  string status = 7;
}

message AdminRevenueActionRequest {
  nvbes.platform.v1.RequestContext context = 1;
  string workspace_id = 2;
  AdminRevenueActionKind action_kind = 3;
  string target_id = 4;
  string reason = 5;
}

enum AdminRevenueActionKind {
  ADMIN_REVENUE_ACTION_KIND_UNSPECIFIED = 0;
  ADMIN_REVENUE_ACTION_KIND_CLOSE_DUNNING_CASE = 1;
  ADMIN_REVENUE_ACTION_KIND_REOPEN_DUNNING_CASE = 2;
  ADMIN_REVENUE_ACTION_KIND_HOLD_INVOICE = 3;
  ADMIN_REVENUE_ACTION_KIND_RELEASE_INVOICE = 4;
  ADMIN_REVENUE_ACTION_KIND_REVIEW_DISPUTE = 5;
  ADMIN_REVENUE_ACTION_KIND_RESOLVE_DISPUTE = 6;
}

message AdminRevenueActionResult {
  string object_id = 1;
  string action_kind = 2;
  string status = 3;
  string audit_action = 4;
  string target_type = 5;
  string previous_state = 6;
  string metadata_json = 7;
}

message BillingOverview {
  string workspace_id = 1;
  string plan_code = 2;
  string subscription_status = 3;
  string billing_provider = 4;
  string current_period_start = 5;
  string current_period_end = 6;
  ProductEntitlements entitlements = 7;
}

message BillingPortal {
  string workspace_id = 1;
  repeated BillingInvoice invoices = 2;
  repeated BillingPaymentMethod payment_methods = 3;
  repeated BillingSubscription subscriptions = 4;
}

message BillingInvoice {
  string invoice_id = 1;
  string invoice_number = 2;
  string status = 3;
  int64 total_minor = 4;
  string currency = 5;
  string issued_at = 6;
  repeated BillingProviderReference providers = 7;
}

message BillingPaymentMethod {
  string payment_method_id = 1;
  string brand = 2;
  string last4 = 3;
  int32 exp_month = 4;
  int32 exp_year = 5;
  repeated BillingProviderReference providers = 6;
}

message BillingSubscription {
  string subscription_id = 1;
  string plan_code = 2;
  string status = 3;
  repeated BillingProviderReference providers = 4;
}

message BillingProviderReference {
  string provider = 1;
  string status = 2;
  bool primary = 3;
  bool fallback_eligible = 4;
}

message ProductEntitlements {
  int64 included_storage_gb = 1;
  int64 included_users = 2;
  int64 retention_days = 3;
  int64 max_share_links = 4;
  string audit_level = 5;
}

message UsageEvent {
  nvbes.platform.v1.RequestContext context = 1;
  string tenant_id = 2;
  string workspace_id = 3;
  string meter_code = 4;
  int64 quantity = 5;
  string unit = 6;
  string occurred_at = 7;
  string source = 8;
  string idempotency_key = 9;
}

message UsageIngestResponse {
  bool accepted = 1;
}

message RunReconciliationRequest {
  nvbes.platform.v1.RequestContext context = 1;
  string period_end = 2;
}

message ReconciliationRun {
  string run_id = 1;
  string period_start = 2;
  string period_end = 3;
  uint64 differences_created = 4;
}
