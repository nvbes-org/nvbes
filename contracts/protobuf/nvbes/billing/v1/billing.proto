  string workspace_id = 2;
  AdminBillingActionKind action_kind = 3;
  string invoice_id = 4;
  string payment_id = 5;
  int64 amount_minor = 6;
  string currency = 7;
  string provider = 8;
  string direction = 9;
  string reason = 10;
  string provider_event_id = 11;
  string from_provider = 12;
  string to_provider = 13;
  string subscription_id = 14;
  int64 grace_days = 15;
}

enum AdminBillingActionKind {
  ADMIN_BILLING_ACTION_KIND_UNSPECIFIED = 0;
  ADMIN_BILLING_ACTION_KIND_CREATE_CREDIT_NOTE = 1;
  ADMIN_BILLING_ACTION_KIND_CREATE_WRITE_OFF = 2;
  ADMIN_BILLING_ACTION_KIND_CREATE_REFUND_INTENT = 3;
  ADMIN_BILLING_ACTION_KIND_CREATE_MANUAL_COMPENSATION = 4;
  ADMIN_BILLING_ACTION_KIND_REPLAY_PROVIDER_EVENT = 5;
  ADMIN_BILLING_ACTION_KIND_CREATE_PROVIDER_MIGRATION = 6;
  ADMIN_BILLING_ACTION_KIND_OVERRIDE_GRACE_PERIOD = 7;
}

message AdminBillingActionResult {
  string object_id = 1;
  uint64 ledger_entry_count = 2;
  string audit_action = 3;
  string target_type = 4;
  string provider = 5;
  string provider_event_id = 6;
  string status = 7;
}

message GetAdminRevenueCenterRequest {
  nvbes.platform.v1.RequestContext context = 1;
}

message AdminRevenueCenterSnapshot {
