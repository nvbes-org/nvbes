  string workspace_id = 2;
  string country = 3;
  string currency = 4;
  string payment_method = 5;
  string customer_type = 6;
  int64 amount_minor = 7;
}

message AdminBillingRoutingSimulationResult {
  AdminBillingRoutingSimulationInput input = 1;
  AdminBillingRoutingMatchedRule matched_rule = 2;
  string outcome = 3;
}

message AdminBillingRoutingSimulationInput {
  string country = 1;
  string currency = 2;
  string payment_method = 3;
  string customer_type = 4;
  int64 amount_minor = 5;
}

message AdminBillingRoutingMatchedRule {
  string id = 1;
  int32 priority = 2;
  string provider = 3;
  bool fallback_enabled = 4;
}

message AdminBillingPlatformActionResult {
  string object_id = 1;
  string action_kind = 2;
  string status = 3;
