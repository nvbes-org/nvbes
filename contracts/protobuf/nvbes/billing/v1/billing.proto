  repeated AdminMoneyTotal open_invoices = 2;
  repeated AdminMoneyTotal overdue_invoices = 3;
  repeated AdminMoneyTotal refunds_30d = 4;
  repeated AdminMoneyTotal disputes_30d = 5;
