  int64 active_subscription_count = 2;
}

message ListAdminProviderEventFailuresRequest {
  nvbes.platform.v1.RequestContext context = 1;
  string workspace_id = 2;
  int32 limit = 3;
}

message AdminProviderEventFailures {
  repeated AdminProviderEventFailure failures = 1;
}

message AdminProviderEventFailure {
  string id = 1;
  string provider = 2;
  string provider_event_id = 3;
  string event_type = 4;
  string status = 5;
  bool signature_valid = 6;
  string payload_summary_json = 7;
  string received_at = 8;
  string processed_at = 9;
}

message SearchAdminBillingRequest {
  nvbes.platform.v1.RequestContext context = 1;
  string workspace_id = 2;
  string query = 3;
  int32 limit = 4;
}

message AdminBillingSearchResults {
