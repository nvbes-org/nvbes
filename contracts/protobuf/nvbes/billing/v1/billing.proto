  int64 active_entitlement_count = 4;
  int64 over_quota_balance_count = 5;
  int64 unpublished_change_count = 6;
  int64 active_trial_grant_count = 7;
  repeated AdminEntitlementPlan active_plans = 8;
  repeated AdminOverQuotaBalance over_quota_balances = 9;
  repeated AdminExpiringEntitlement expiring_entitlements = 10;
  repeated AdminUnpublishedEntitlementChange unpublished_changes = 11;
}

message AdminEntitlementPlan {
  string plan_id = 1;
  string product_name = 2;
  string plan_code = 3;
  string plan_name = 4;
  int64 active_version_count = 5;
  int64 feature_count = 6;
}

message AdminOverQuotaBalance {
  string id = 1;
  string tenant_id = 2;
  string tenant_name = 3;
  string workspace_id = 4;
  string workspace_name = 5;
  string quota_code = 6;
  int64 included_quantity = 7;
  int64 used_quantity = 8;
  string period_end = 9;
}

message AdminExpiringEntitlement {
  string id = 1;
  string tenant_id = 2;
  string tenant_name = 3;
  string workspace_id = 4;
  string workspace_name = 5;
  string status = 6;
