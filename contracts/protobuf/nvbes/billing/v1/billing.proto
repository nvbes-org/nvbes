  string status = 4;
}

message BuildAdminFinanceExportRequest {
  nvbes.platform.v1.RequestContext context = 1;
  string workspace_id = 2;
  string export_type = 3;
}

message AdminFinanceExport {
  string export_run_id = 1;
  string filename = 2;
  string content_type = 3;
  bytes body = 4;
