message GetAdminRiskDecisionCenterRequest {
  nvbes.platform.v1.RequestContext context = 1;
}

message AdminRiskDecisionCenterSnapshot {
  int64 billing_risk_signal_count_24h = 1;
  int64 high_billing_risk_score_count = 2;
  int64 active_access_policy_count = 3;
  int64 access_policy_count_24h = 4;
