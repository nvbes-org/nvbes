  string id = 1;
  string tenant_id = 2;
  string tenant_name = 3;
  double score = 4;
  string decision = 5;
  string created_at = 6;
}

message AdminBillingRiskSignal {
  string id = 1;
  string tenant_id = 2;
  string tenant_name = 3;
