syntax = "proto3";

package nvbes.account.v1;

import "nvbes/platform/v1/common.proto";

service AccountService {
  rpc GetProfile(GetProfileRequest) returns (ProfileResponse);
  rpc UpdateProfile(UpdateProfileRequest) returns (ProfileResponse);
  rpc GetPreferences(GetPreferencesRequest) returns (PreferencesResponse);
  rpc UpdatePreferences(UpdatePreferencesRequest) returns (PreferencesResponse);
  rpc GetNotifications(GetNotificationsRequest) returns (NotificationsResponse);
  rpc UpdateNotifications(UpdateNotificationsRequest) returns (NotificationsResponse);
  rpc ListTeams(ListTeamsRequest) returns (ListTeamsResponse);
  rpc CreateTeam(CreateTeamRequest) returns (CreatedTeamResponse);
  rpc JoinTeam(JoinTeamRequest) returns (TeamResponse);
  rpc RequestExport(RequestExportRequest) returns (ExportRequestResponse);
  rpc GetLatestExport(GetLatestExportRequest) returns (ExportStatusResponse);
  rpc RequestClosure(RequestClosureRequest) returns (ClosureRequestResponse);
  rpc GetClosure(GetClosureRequest) returns (ClosureStatusResponse);
  rpc CancelClosure(CancelClosureRequest) returns (CancelClosureResponse);
}

message GetProfileRequest {
  nvbes.platform.v1.RequestContext context = 1;
}

message UpdateProfileRequest {
  nvbes.platform.v1.RequestContext context = 1;
  optional string firstname = 2;
  optional string lastname = 3;
  optional string username = 4;
  optional string birthdate = 5;
  optional string region = 6;
}

message ProfileResponse {
  string principal_id = 1;
  string display_name = 2;
  optional string firstname = 3;
  optional string lastname = 4;
  optional string username = 5;
  optional string birthdate = 6;
  optional string region = 7;
  string created_at = 8;
}

message GetPreferencesRequest {
  nvbes.platform.v1.RequestContext context = 1;
}

message UpdatePreferencesRequest {
  nvbes.platform.v1.RequestContext context = 1;
  string theme = 2;
  string language = 3;
}

message PreferencesResponse {
  string theme = 1;
  string language = 2;
}

message GetNotificationsRequest {
  nvbes.platform.v1.RequestContext context = 1;
}

message UpdateNotificationsRequest {
  nvbes.platform.v1.RequestContext context = 1;
  bool email = 2;
  bool push = 3;
  bool in_app = 4;
  bool marketing_email = 5;
}

message NotificationsResponse {
  bool email = 1;
  bool push = 2;
  bool in_app = 3;
  bool marketing_email = 4;
}

message ListTeamsRequest {
  nvbes.platform.v1.RequestContext context = 1;
}

message TeamResponse {
  string id = 1;
  string name = 2;
  string role = 3;
  string created_at = 4;
}

message ListTeamsResponse {
  repeated TeamResponse teams = 1;
}

message CreateTeamRequest {
  nvbes.platform.v1.RequestContext context = 1;
  string name = 2;
}

message CreatedTeamResponse {
  string id = 1;
  string name = 2;
  string role = 3;
  string join_code = 4;
  string created_at = 5;
}

message JoinTeamRequest {
  nvbes.platform.v1.RequestContext context = 1;
  string join_code = 2;
}

message RequestExportRequest {
  nvbes.platform.v1.RequestContext context = 1;
}

message ExportRequestResponse {
  string export_id = 1;
  string status = 2;
  string requested_at = 3;
}

message GetLatestExportRequest {
  nvbes.platform.v1.RequestContext context = 1;
}

message ExportParticipant {
  string participant = 1;
  string status = 2;
  uint32 attempts = 3;
  optional string completed_at = 4;
  optional string last_error = 5;
}

message ExportStatusResponse {
  string export_id = 1;
  string status = 2;
  string requested_at = 3;
  string updated_at = 4;
  optional string completed_at = 5;
  optional string expires_at = 6;
  optional string last_error = 7;
  repeated ExportParticipant participants = 8;
}

message RequestClosureRequest {
  nvbes.platform.v1.RequestContext context = 1;
}

message ClosureRequestResponse {
  string saga_id = 1;
  string status = 2;
  string requested_at = 3;
}

message GetClosureRequest {
  nvbes.platform.v1.RequestContext context = 1;
}

message ClosureParticipant {
  string participant = 1;
  string status = 2;
  uint32 attempts = 3;
  optional string completed_at = 4;
  optional string last_error = 5;
}

message ClosureStatusResponse {
  string saga_id = 1;
  string status = 2;
  string requested_at = 3;
  string updated_at = 4;
  optional string completed_at = 5;
  optional string last_error = 6;
  repeated ClosureParticipant participants = 7;
}

message CancelClosureRequest {
  nvbes.platform.v1.RequestContext context = 1;
}

message CancelClosureResponse {
  bool cancelled = 1;
}
