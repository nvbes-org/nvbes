syntax = "proto3";

package nvbes.account.v1;

import "nvbes/platform/v1/common.proto";

service AccountService {
  rpc RegisterUser(RegisterUserRequest) returns (UserAccount);
  rpc BeginPasswordSignIn(BeginPasswordSignInRequest) returns (AuthChallenge);
  rpc CompletePasswordSignIn(CompletePasswordSignInRequest) returns (SessionTokenPair);
  rpc StartMfaChallenge(StartMfaChallengeRequest) returns (AuthChallenge);
  rpc VerifyMfaChallenge(VerifyMfaChallengeRequest) returns (SessionTokenPair);
  rpc GetCurrentUser(GetCurrentUserRequest) returns (UserAccount);
  rpc UpdateUserProfile(UpdateUserProfileRequest) returns (UserAccount);
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  rpc RevokeSession(RevokeSessionRequest) returns (SessionRevocation);
  rpc ExchangeToken(ExchangeTokenRequest) returns (SessionTokenPair);
  rpc RefreshToken(RefreshTokenRequest) returns (SessionTokenPair);
  rpc RevokeToken(RevokeTokenRequest) returns (TokenRevocation);
  rpc GetAccountBillingOverview(GetAccountBillingOverviewRequest) returns (AccountBillingOverview);
  rpc CreateAccountCheckout(CreateAccountCheckoutRequest) returns (AccountBillingSession);
  rpc CreateAccountBillingPortal(CreateAccountBillingPortalRequest) returns (AccountBillingSession);
  rpc ListAccountInvoices(ListAccountInvoicesRequest) returns (ListAccountInvoicesResponse);
}

message RegisterUserRequest {
  nvbes.platform.v1.RequestContext context = 1;
  string email = 2;
  string display_name = 3;
  string password = 4;
  string locale = 5;
}

message BeginPasswordSignInRequest {
  nvbes.platform.v1.RequestContext context = 1;
  string identifier = 2;
  string device_fingerprint = 3;
}

message CompletePasswordSignInRequest {
  nvbes.platform.v1.RequestContext context = 1;
  string challenge_id = 2;
  string password = 3;
}

message StartMfaChallengeRequest {
  nvbes.platform.v1.RequestContext context = 1;
  string session_id = 2;
  string factor_id = 3;
  string factor_type = 4;
}

message VerifyMfaChallengeRequest {
  nvbes.platform.v1.RequestContext context = 1;
  string challenge_id = 2;
  string verification_code = 3;
  string webauthn_assertion_json = 4;
}

message GetCurrentUserRequest {
  nvbes.platform.v1.RequestContext context = 1;
}

message UpdateUserProfileRequest {
  nvbes.platform.v1.RequestContext context = 1;
  string display_name = 2;
  string locale = 3;
  string timezone = 4;
}

message ListSessionsRequest {
  nvbes.platform.v1.RequestContext context = 1;
  nvbes.platform.v1.CursorPageRequest page = 2;
}

message RevokeSessionRequest {
  nvbes.platform.v1.RequestContext context = 1;
  string session_id = 2;
  string reason = 3;
}

message ExchangeTokenRequest {
  nvbes.platform.v1.RequestContext context = 1;
  string grant_type = 2;
  string code = 3;
  string redirect_uri = 4;
  string code_verifier = 5;
  string client_id = 6;
}

message RefreshTokenRequest {
  nvbes.platform.v1.RequestContext context = 1;
  string refresh_token = 2;
}

message RevokeTokenRequest {
  nvbes.platform.v1.RequestContext context = 1;
  string token_id = 2;
  string reason = 3;
}

message GetAccountBillingOverviewRequest {
  nvbes.platform.v1.RequestContext context = 1;
  string workspace_id = 2;
}

message CreateAccountCheckoutRequest {
  nvbes.platform.v1.RequestContext context = 1;
  string workspace_id = 2;
  string plan_code = 3;
  string success_url = 4;
  string cancel_url = 5;
}

message CreateAccountBillingPortalRequest {
  nvbes.platform.v1.RequestContext context = 1;
  string workspace_id = 2;
  string return_url = 3;
}

message ListAccountInvoicesRequest {
  nvbes.platform.v1.RequestContext context = 1;
  string workspace_id = 2;
  nvbes.platform.v1.CursorPageRequest page = 3;
}

message UserAccount {
  string user_id = 1;
  string primary_email = 2;
  string display_name = 3;
  string locale = 4;
  string timezone = 5;
  bool mfa_required = 6;
  repeated AccountMembership memberships = 7;
}

message AccountMembership {
  string workspace_id = 1;
  string workspace_name = 2;
  string role = 3;
  string status = 4;
}

message AuthChallenge {
  string challenge_id = 1;
  string challenge_type = 2;
  repeated string available_factor_ids = 3;
  string expires_at = 4;
}

message SessionTokenPair {
  string session_id = 1;
  string access_token = 2;
  string refresh_token = 3;
  string expires_at = 4;
  UserAccount user = 5;
}

message ListSessionsResponse {
  repeated AccountSession sessions = 1;
  nvbes.platform.v1.CursorPageResponse page = 2;
}

message AccountSession {
  string session_id = 1;
  string device_label = 2;
  string ip_country = 3;
  string created_at = 4;
  string last_seen_at = 5;
  bool current = 6;
}

message SessionRevocation {
  string session_id = 1;
  bool revoked = 2;
}

message TokenRevocation {
  string token_id = 1;
  bool revoked = 2;
}

message AccountBillingOverview {
  string workspace_id = 1;
  string plan_code = 2;
  string subscription_status = 3;
  string billing_provider = 4;
  repeated AccountBillingEntitlement entitlements = 5;
}

message AccountBillingEntitlement {
  string code = 1;
  string unit = 2;
  int64 quantity = 3;
  string status = 4;
}

message AccountBillingSession {
  string session_url = 1;
  string provider = 2;
  string expires_at = 3;
}

message ListAccountInvoicesResponse {
  repeated AccountInvoice invoices = 1;
  nvbes.platform.v1.CursorPageResponse page = 2;
}

message AccountInvoice {
  string invoice_id = 1;
  string invoice_number = 2;
  string status = 3;
  int64 total_minor = 4;
  string currency = 5;
  string issued_at = 6;
}
