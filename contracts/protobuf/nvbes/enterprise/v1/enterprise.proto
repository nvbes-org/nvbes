syntax = "proto3";

package nvbes.enterprise.v1;

import "nvbes/platform/v1/common.proto";

service EnterpriseService {
  rpc GetPolicySet(GetPolicySetRequest) returns (PolicySet);
  rpc UpdatePolicy(UpdatePolicyRequest) returns (EnterprisePolicy);
  rpc EvaluatePolicy(EvaluatePolicyRequest) returns (PolicyDecision);
  rpc StartAccessReview(StartAccessReviewRequest) returns (AccessReview);
  rpc RecordAccessReviewDecision(RecordAccessReviewDecisionRequest) returns (AccessReviewDecision);
  rpc ActivateBreakGlass(ActivateBreakGlassRequest) returns (BreakGlassGrant);
  rpc RevokeBreakGlass(RevokeBreakGlassRequest) returns (BreakGlassGrant);
  rpc ConfigureFederationProvider(ConfigureFederationProviderRequest) returns (FederationProvider);
  rpc TestFederationProvider(TestFederationProviderRequest) returns (FederationTestResult);
  rpc GetFederationGovernance(GetFederationGovernanceRequest) returns (FederationGovernance);
}

message GetPolicySetRequest {
  nvbes.platform.v1.RequestContext context = 1;
  string tenant_id = 2;
}

message UpdatePolicyRequest {
  nvbes.platform.v1.RequestContext context = 1;
  string tenant_id = 2;
  string policy_id = 3;
  string policy_kind = 4;
  string rules_json = 5;
  string reason = 6;
}

message EvaluatePolicyRequest {
  nvbes.platform.v1.RequestContext context = 1;
  string tenant_id = 2;
  string subject_principal_id = 3;
  string action = 4;
  string resource = 5;
  map<string, string> attributes = 6;
}

message StartAccessReviewRequest {
  nvbes.platform.v1.RequestContext context = 1;
  string tenant_id = 2;
  string scope = 3;
  string due_at = 4;
}

message RecordAccessReviewDecisionRequest {
  nvbes.platform.v1.RequestContext context = 1;
  string tenant_id = 2;
  string review_id = 3;
  string subject_principal_id = 4;
  string decision = 5;
  string reason = 6;
}

message ActivateBreakGlassRequest {
  nvbes.platform.v1.RequestContext context = 1;
  string tenant_id = 2;
  string principal_id = 3;
  string role = 4;
  string reason = 5;
  string expires_at = 6;
}

message RevokeBreakGlassRequest {
  nvbes.platform.v1.RequestContext context = 1;
  string tenant_id = 2;
  string grant_id = 3;
  string reason = 4;
}

message ConfigureFederationProviderRequest {
  nvbes.platform.v1.RequestContext context = 1;
  string tenant_id = 2;
  string provider_id = 3;
  string protocol = 4;
  string issuer = 5;
  string metadata_url = 6;
  string scim_base_url = 7;
  string status = 8;
}

message TestFederationProviderRequest {
  nvbes.platform.v1.RequestContext context = 1;
  string tenant_id = 2;
  string provider_id = 3;
}

message GetFederationGovernanceRequest {
  nvbes.platform.v1.RequestContext context = 1;
  string tenant_id = 2;
}

message PolicySet {
  string tenant_id = 1;
  repeated EnterprisePolicy policies = 2;
}

message EnterprisePolicy {
  string policy_id = 1;
  string policy_kind = 2;
  string rules_json = 3;
  string status = 4;
  string updated_at = 5;
}

message PolicyDecision {
  string decision_id = 1;
  string result = 2;
  repeated string obligations = 3;
}

message AccessReview {
  string review_id = 1;
  string tenant_id = 2;
  string scope = 3;
  string status = 4;
  string due_at = 5;
}

message AccessReviewDecision {
  string review_id = 1;
  string subject_principal_id = 2;
  string decision = 3;
  string decided_at = 4;
}

message BreakGlassGrant {
  string grant_id = 1;
  string tenant_id = 2;
  string principal_id = 3;
  string role = 4;
  string status = 5;
  string expires_at = 6;
}

message FederationProvider {
  string provider_id = 1;
  string tenant_id = 2;
  string protocol = 3;
  string issuer = 4;
  string metadata_url = 5;
  string scim_base_url = 6;
  string status = 7;
}

message FederationTestResult {
  string provider_id = 1;
  string status = 2;
  string checked_at = 3;
  repeated string findings = 4;
}

message FederationGovernance {
  string tenant_id = 1;
  repeated FederationProvider providers = 2;
  repeated string required_claims = 3;
  bool scim_required = 4;
}
