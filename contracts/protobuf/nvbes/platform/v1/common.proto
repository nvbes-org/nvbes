syntax = "proto3";

package nvbes.platform.v1;

message TenantContext {
  string tenant_id = 1;
  string workspace_id = 2;
  string region_id = 3;
  string data_residency = 4;
}

message RequestContext {
  string request_id = 1;
  string correlation_id = 2;
  string actor_principal_id = 3;
  TenantContext tenant = 4;
}

message CursorPageRequest {
  string cursor = 1;
  uint32 limit = 2;
}

message CursorPageResponse {
  string next_cursor = 1;
  bool has_more = 2;
}

message ApiError {
  string code = 1;
  string message = 2;
  string request_id = 3;
  map<string, string> details = 4;
}
