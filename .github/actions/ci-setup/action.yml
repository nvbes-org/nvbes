name: Setup CI lane
description: Install only the runtime and caches required by a lane
inputs:
  node:
    description: Install Node and pnpm dependencies
    default: 'true'
  rust:
    description: Install Rust and sccache
    default: 'false'
  terraform:
    description: Install Terraform
    default: 'false'
  coverage:
    description: Install cargo-llvm-cov for coverage validation
    default: 'false'
  caches:
    description: Space-separated cache kinds
    default: 'pnpm nx'
  cache-key:
    description: Scoped cache access key
    required: false
  cache-secret:
    description: Scoped cache secret key
    required: false
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      if: inputs.node == 'true'
      with:
        node-version: 24
    - name: Enable pnpm
      if: inputs.node == 'true'
      shell: bash --noprofile --norc -euo pipefail {0}
      run: |
        corepack enable
        for attempt in 1 2 3; do
          corepack prepare pnpm@11.18.0 --activate && break || {
            if [[ "$attempt" -eq 3 ]]; then exit 1; fi
            sleep 2
          }
        done
    - name: Restore lane caches
      shell: bash --noprofile --norc -euo pipefail {0}
      env:
        CACHE_KINDS: ${{ inputs.caches }}
        AWS_ACCESS_KEY_ID: ${{ inputs.cache-key }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.cache-secret }}
      run: |
        read -r -a kinds <<< "$CACHE_KINDS"
        node tools/ci/scaleway-cache-manager.mjs restore "${kinds[@]}"
    - name: Install locked dependencies
      if: inputs.node == 'true'
      shell: bash --noprofile --norc -euo pipefail {0}
      run: pnpm install --frozen-lockfile --prefer-offline
    - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
      if: inputs.rust == 'true'
      with:
        toolchain: 1.91.1
        components: rustfmt, clippy, llvm-tools-preview
    - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
      if: inputs.rust == 'true'
      with:
        version: v0.17.0
        disable_annotations: false
    - name: Configure compilation cache
      if: inputs.rust == 'true'
      shell: bash --noprofile --norc -euo pipefail {0}
      env:
        AWS_ACCESS_KEY_ID: ${{ inputs.cache-key }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.cache-secret }}
      run: |
        node tools/ci/configure-sccache.mjs
    - name: Install cargo-llvm-cov
      if: inputs.rust == 'true' && inputs.coverage == 'true'
      shell: bash --noprofile --norc -euo pipefail {0}
      run: cargo install cargo-llvm-cov --locked --version 0.8.7
    - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
      if: inputs.terraform == 'true'
      with:
        terraform_version: 1.15.8
        terraform_wrapper: false
