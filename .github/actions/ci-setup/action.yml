name: Setup CI lane
description: Install only the runtime and caches required by a lane
inputs:
  node:
    description: Install Node and pnpm dependencies
    default: 'true'
  rust:
    description: Install Rust and sccache
    default: 'false'
  terraform:
    description: Install Terraform
    default: 'false'
  coverage:
    description: Install cargo-llvm-cov for coverage validation
    default: 'false'
  caches:
    description: Space-separated cache kinds
    default: 'pnpm nx'
  cache-key:
    description: Scoped cache access key
    required: false
  cache-secret:
    description: Scoped cache secret key
    required: false
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      if: inputs.node == 'true'
      with:
        node-version: 24
    - name: Enable pnpm
      if: inputs.node == 'true'
      shell: bash --noprofile --norc -euo pipefail {0}
      run: |
        corepack enable
        for attempt in 1 2 3; do
          corepack prepare pnpm@11.18.0 --activate && break || {
            if [[ "$attempt" -eq 3 ]]; then exit 1; fi
            sleep 2
          }
        done
    - name: Restore lane caches
      shell: bash --noprofile --norc -euo pipefail {0}
      env:
        CACHE_KINDS: ${{ inputs.caches }}
        AWS_ACCESS_KEY_ID: ${{ inputs.cache-key }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.cache-secret }}
      run: |
        read -r -a kinds <<< "$CACHE_KINDS"
        node tools/ci/scaleway-cache-manager.mjs restore "${kinds[@]}"
    - name: Install locked dependencies
      if: inputs.node == 'true'
      shell: bash --noprofile --norc -euo pipefail {0}
      run: pnpm install --frozen-lockfile --prefer-offline
    - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
      if: inputs.rust == 'true'
      with:
        toolchain: 1.98.1
        components: rustfmt, clippy, llvm-tools-preview
    - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
      if: inputs.rust == 'true'
      with:
        version: v0.17.0
        disable_annotations: false
    - name: Ensure fast linker
      if: inputs.rust == 'true' && runner.os == 'Linux'
      shell: bash --noprofile --norc -euo pipefail {0}
      run: |
        if ! command -v lld >/dev/null 2>&1; then
          sudo apt-get update -qq && sudo apt-get install -qq -y lld
        fi
    - name: Configure compilation cache
      if: inputs.rust == 'true'
      shell: bash --noprofile --norc -euo pipefail {0}
      env:
        AWS_ACCESS_KEY_ID: ${{ inputs.cache-key }}
        AWS_SECRET_ACCESS_KEY: ${{ inputs.cache-secret }}
      run: |
        node tools/ci/configure-sccache.mjs
    - name: Install cargo-nextest
      if: inputs.rust == 'true'
      shell: bash --noprofile --norc -euo pipefail {0}
      run: cargo install cargo-nextest --version 0.9.144 --locked
    - name: Install cargo-llvm-cov
      if: inputs.rust == 'true' && inputs.coverage == 'true'
      shell: bash --noprofile --norc -euo pipefail {0}
      run: |
        if ! command -v cargo-llvm-cov >/dev/null 2>&1; then
          VERSION="0.8.7"
          ARCH="$(uname -m)"
          case "$ARCH" in
            x86_64) ARCH="x86_64" ;;
            aarch64|arm64) ARCH="aarch64" ;;
          esac
          OS="$(uname -s)"
          case "$OS" in
            Linux) OS="unknown-linux-gnu" ;;
            Darwin) OS="apple-darwin" ;;
            *) OS="unknown-linux-gnu" ;;
          esac
          URL="https://github.com/taiki-e/cargo-llvm-cov/releases/download/v${VERSION}/cargo-llvm-cov-${ARCH}-${OS}.tar.gz"
          mkdir -p "$HOME/.cargo/bin"
          curl -fsSL "$URL" | tar -xz -C "$HOME/.cargo/bin"
        fi
        cargo llvm-cov --version
    - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
      if: inputs.terraform == 'true'
      with:
        terraform_version: 1.15.8
        terraform_wrapper: false
