version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Europe/Paris
    open-pull-requests-limit: 3
    rebase-strategy: disabled
    cooldown:
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      rust-security-compatible:
        update-types:
          - patch
          - minor

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: '04:15'
      timezone: Europe/Paris
    open-pull-requests-limit: 3
    rebase-strategy: disabled
    cooldown:
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      javascript-security-compatible:
        update-types:
          - patch
          - minor
    # TypeScript majors require a coordinated Nx compatibility migration.
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: wednesday
      time: '04:30'
      timezone: Europe/Paris
    open-pull-requests-limit: 2
    rebase-strategy: disabled
    cooldown:
      default-days: 7
    groups:
      github-actions-compatible:
        patterns:
          - "*"
  - package-ecosystem: docker
    directory: /apps/email-worker
    schedule:
      interval: weekly
      day: thursday
      time: '04:45'
      timezone: Europe/Paris
    open-pull-requests-limit: 2
    rebase-strategy: disabled
    cooldown:
      default-days: 7
    # Rust builder images are upgraded fleet-wide with the compiler, CI cache,
    # and reproducibility contracts; a per-service bump breaks that lockstep.
    ignore:
      - dependency-name: rust
