version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:00'
      timezone: Europe/Paris
    open-pull-requests-limit: 10
    groups:
      rust-security-compatible:
        update-types:
          - patch
          - minor

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:15'
      timezone: Europe/Paris
    open-pull-requests-limit: 10
    groups:
      javascript-security-compatible:
        update-types:
          - patch
          - minor

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '04:30'
      timezone: Europe/Paris
    open-pull-requests-limit: 10

  - package-ecosystem: docker
    directory: /apps/account-worker
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /apps/billing-worker
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /apps/cloud-worker
    schedule:
      interval: weekly
