name: container release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: container-release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  actions: read
  attestations: write
  contents: read
  id-token: write
  packages: write
  security-events: write

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  build-scan-sign:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: nvbes-identity-service
            dockerfile: apps/identity-service/Dockerfile
            contract: apps/identity-service/tests/container-contract.test.mjs
          - image: nvbes-identity-worker
            dockerfile: apps/identity-worker/Dockerfile
            contract: apps/identity-worker/tests/container-contract.test.mjs
          - image: nvbes-billing-worker
            dockerfile: apps/billing-worker/Dockerfile
            contract: ''
          - image: nvbes-email-worker
            dockerfile: apps/email-worker/Dockerfile
            contract: apps/email-worker/tests/container-contract.test.mjs
          - image: nvbes-cloud-worker
            dockerfile: apps/cloud-worker/Dockerfile
            contract: ''
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: nvbes-org/${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: CI/CD security gate
        run: >-
          node tools/security/check-ci-cd-security.mjs
          --workflow .github/workflows/container-release.yml
      - name: Validate image contract
        if: matrix.contract != ''
        run: node --test "${{ matrix.contract }}"
      - name: Set deterministic build metadata
        run: |
          echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"
          echo "LC_ALL=C" >> "$GITHUB_ENV"
          echo "TZ=UTC" >> "$GITHUB_ENV"
      - name: Authenticate to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build and push immutable image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          build-args: |
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Block vulnerable release images
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          format: table
      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          scanners: vuln
          format: cyclonedx
          output: ${{ matrix.image }}.cdx.json
          exit-code: '0'
      - name: Attest build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Attest SBOM
        uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34 # v3
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: ${{ matrix.image }}.cdx.json
          push-to-registry: true
      - name: Install Cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Keyless-sign image and SBOM attestation
        env:
          IMAGE_DIGEST: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE_DIGEST"
          cosign attest --yes \
            --predicate "${{ matrix.image }}.cdx.json" \
            --type cyclonedx \
            "$IMAGE_DIGEST"
      - name: Verify release identity
        env:
          IMAGE_DIGEST: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          CERTIFICATE_IDENTITY: >-
            https://github.com/${{ github.repository }}/.github/workflows/container-release.yml@${{ github.ref }}
        run: |
          cosign verify "$IMAGE_DIGEST" \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          cosign verify-attestation "$IMAGE_DIGEST" \
            --type cyclonedx \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Upload release SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.image }}-sbom-${{ github.ref_name }}
          path: ${{ matrix.image }}.cdx.json
          retention-days: 90
