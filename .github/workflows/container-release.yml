name: container release

on:
  workflow_dispatch:
    inputs:
      application:
        description: Application image to release
        required: true
        type: choice
        default: email-worker
        options:
          - account-service
          - account-worker
          - backoffice-service
          - billing-service
          - billing-worker
          - cloud-service
          - cloud-worker
          - developer-service
          - email-worker
          - enterprise-service
          - gateway-cloud
          - identity-service
          - identity-worker
      platform:
        description: Target platform architecture
        required: false
        type: choice
        default: linux/amd64
        options:
          - linux/amd64
          - linux/arm64
          - linux/amd64,linux/arm64

permissions:
  actions: read
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  ci-test-gate:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: CI/CD security gate
        run: >-
          node tools/security/check-ci-cd-security.mjs
          --workflow .github/workflows/container-release.yml
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.91.1
          components: rustfmt, clippy
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.18.0 --activate
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Format check
        run: pnpm format:check
      - name: Structure check
        run: pnpm check:structure
      - name: Nx boundaries check
        run: pnpm check:nx-boundaries
      - name: Pre-build: Contracts & Codegen check
        run: pnpm check:contracts && pnpm check:codegen
      - name: Pre-build: Linting
        run: pnpm lint:web
      - name: Pre-build: Unit tests
        run: pnpm test:unit

  detect-affected:
    needs: [ci-test-gate]
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 15
    outputs:
      rust: ${{ steps.affected.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: CI/CD security gate
        run: >-
          node tools/security/check-ci-cd-security.mjs
          --workflow .github/workflows/container-release.yml
      - name: Select one application or detect affected applications
        id: affected
        env:
          APPLICATION: ${{ inputs.application }}
          BASE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            affected="$(node tools/ci/affected-applications.mjs \
              --mode containers \
              --project "$APPLICATION")"
          else
            affected="$(node tools/ci/affected-applications.mjs \
              --mode containers \
              --base "$BASE_SHA" \
              --head "$HEAD_SHA")"
          fi
          echo "rust=$(jq -c '.rust' <<<"$affected")" >> "$GITHUB_OUTPUT"

  build-scan-sign:
    needs: [ci-test-gate, detect-affected]
    if: needs.detect-affected.outputs.rust != '[]'
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 90
    concurrency:
      group: container-release-${{ matrix.image }}-${{ github.run_id }}
      cancel-in-progress: true
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
      packages: write
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect-affected.outputs.rust) }}
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: nvbes-org/${{ matrix.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: CI/CD security gate
        run: >-
          node tools/security/check-ci-cd-security.mjs
          --workflow .github/workflows/container-release.yml
      - name: Validate image contract
        if: matrix.contract != ''
        run: node --test "${{ matrix.contract }}"
      - name: Set deterministic build metadata
        run: |
          echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"
          echo "LC_ALL=C" >> "$GITHUB_ENV"
          echo "TZ=UTC" >> "$GITHUB_ENV"
      - name: Authenticate to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build and push immutable image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ inputs.platform || 'linux/amd64' }}
          push: true
          provenance: false
          sbom: false
          build-args: |
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
            CARGO_PACKAGE=${{ matrix.package }}
            CARGO_BINARY=${{ matrix.binary }}
            APPLICATION_PATH=${{ matrix.appRoot }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
      - name: Block vulnerable release images
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          scanners: vuln
          format: cyclonedx
          output: ${{ matrix.image }}.cdx.json
          exit-code: '0'
      - name: Install Cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Keyless-sign image and SBOM attestation
        env:
          IMAGE_DIGEST: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE_DIGEST"
          cosign attest --yes \
            --predicate "${{ matrix.image }}.cdx.json" \
            --type cyclonedx \
            "$IMAGE_DIGEST"
      - name: Verify release identity
        env:
          IMAGE_DIGEST: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          CERTIFICATE_IDENTITY: >-
            https://github.com/${{ github.repository }}/.github/workflows/container-release.yml@${{ github.ref }}
        run: |
          cosign verify "$IMAGE_DIGEST" \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          cosign verify-attestation "$IMAGE_DIGEST" \
            --type cyclonedx \
            --certificate-identity "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Publish immutable release reference
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE_NAME: ${{ matrix.image }}
        run: |
          echo "### $IMAGE_NAME" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$IMAGE_DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload release SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.image }}-sbom-${{ github.ref_name }}
          path: ${{ matrix.image }}.cdx.json
          retention-days: 90
