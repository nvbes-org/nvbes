name: account acceptance evidence ingest

on:
  workflow_dispatch:

concurrency:
  group: account-acceptance-ingest-${{ github.sha }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  verify-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: account-acceptance
    env:
      ACCOUNT_ACCEPTANCE_TRUSTED_KEY_ID: ${{ vars.ACCOUNT_ACCEPTANCE_TRUSTED_KEY_ID }}
      ACCOUNT_ACCEPTANCE_TRUSTED_PUBLIC_KEY_SHA256: ${{ vars.ACCOUNT_ACCEPTANCE_TRUSTED_PUBLIC_KEY_SHA256 }}
      ACCOUNT_DEPLOYMENT_EXPECTED_COMPONENT_UIDS: ${{ vars.ACCOUNT_DEPLOYMENT_EXPECTED_COMPONENT_UIDS }}
      ACCOUNT_DEPLOYMENT_TRUSTED_KEY_ID: ${{ vars.ACCOUNT_DEPLOYMENT_TRUSTED_KEY_ID }}
      ACCOUNT_DEPLOYMENT_TRUSTED_PUBLIC_KEY_SHA256: ${{ vars.ACCOUNT_DEPLOYMENT_TRUSTED_PUBLIC_KEY_SHA256 }}
      CI: 'true'
      NVBES_RELEASE_REF: ${{ github.ref }}
      NVBES_RELEASE_REF_NAME: ${{ github.ref_name }}
      NVBES_RELEASE_REF_TYPE: ${{ github.ref_type }}
      NVBES_RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.ref }}
      - name: Configure ephemeral acceptance paths
        run: |
          {
            echo "ACCOUNT_ACCEPTANCE_EVIDENCE_FILE=$RUNNER_TEMP/account-acceptance-source/acceptance-evidence.json"
            echo "ACCOUNT_ACCEPTANCE_EVIDENCE_SIGNATURE_FILE=$RUNNER_TEMP/account-acceptance-source/acceptance-evidence.sig"
            echo "ACCOUNT_ACCEPTANCE_TRUSTED_PUBLIC_KEY_FILE=$RUNNER_TEMP/account-acceptance-trust/acceptance-public-key.pem"
            echo "ACCOUNT_DEPLOYMENT_TRUSTED_PUBLIC_KEY_FILE=$RUNNER_TEMP/account-acceptance-trust/deployment-public-key.pem"
            echo "ACCOUNT_INGEST_EVIDENCE_ROOT=$RUNNER_TEMP/account-acceptance-source"
            echo "ACCOUNT_INGEST_PUBLICATION_ROOT=$RUNNER_TEMP/account-acceptance-publication"
            echo "ACCOUNT_INGEST_TRUST_ROOT=$RUNNER_TEMP/account-acceptance-trust"
          } >> "$GITHUB_ENV"
      - name: Validate immutable Account RC tag
        env:
          GH_API_URL: ${{ github.api_url }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: node tools/account-quality/verify-account-release-ref.mjs
      - name: CI/CD security gate
        run: node tools/security/check-ci-cd-security.mjs
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Validate signed-packet source provenance
        env:
          ACCEPTANCE_SOURCE_RUN_ID: ${{ vars.ACCOUNT_ACCEPTANCE_SOURCE_RUN_ID }}
          GH_API_URL: ${{ github.api_url }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          EXPECTED_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$(git rev-parse HEAD)" == "$NVBES_RELEASE_SHA" ]]
          node --input-type=module <<'NODE'
          const {
            ACCEPTANCE_SOURCE_RUN_ID: runId,
            EXPECTED_RELEASE_TAG: expectedTag,
            GH_API_URL: apiUrl,
            GH_REPOSITORY: repository,
            GH_TOKEN: token,
            NVBES_RELEASE_SHA: release,
          } = process.env;
          if (!/^[1-9][0-9]*$/u.test(runId ?? "")) {
            throw new Error("Protected signed-packet source run ID is missing or invalid.");
          }
          const response = await fetch(
            `${apiUrl}/repos/${repository}/actions/runs/${runId}`,
            {
              headers: {
                Accept: "application/vnd.github+json",
                Authorization: `Bearer ${token}`,
                "X-GitHub-Api-Version": "2022-11-28",
              },
              redirect: "error",
            },
          );
          if (!response.ok) {
            throw new Error(`Signed-packet source lookup failed with HTTP ${response.status}.`);
          }
          const run = await response.json();
          if (
            run.repository?.full_name !== repository ||
            run.path !== ".github/workflows/account-acceptance-source.yml" ||
            run.head_branch !== expectedTag ||
            run.head_sha !== release ||
            run.conclusion !== "success" ||
            run.event !== "workflow_dispatch"
          ) {
            throw new Error("Signed-packet source is not the trusted successful run for this SHA.");
          }
          NODE
      - name: Download exact-SHA signed packet
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          name: account-acceptance-source-${{ github.sha }}
          path: ${{ runner.temp }}/account-acceptance-source
          repository: ${{ github.repository }}
          run-id: ${{ vars.ACCOUNT_ACCEPTANCE_SOURCE_RUN_ID }}
      - name: Materialize acceptance trust roots
        env:
          ACCEPTANCE_TRUSTED_PUBLIC_KEY_PEM: ${{ secrets.ACCOUNT_ACCEPTANCE_TRUSTED_PUBLIC_KEY_PEM }}
          DEPLOYMENT_TRUSTED_PUBLIC_KEY_PEM: ${{ secrets.ACCOUNT_DEPLOYMENT_TRUSTED_PUBLIC_KEY_PEM }}
        run: |
          umask 077
          mkdir -p "$ACCOUNT_INGEST_TRUST_ROOT"
          [[ -n "$ACCEPTANCE_TRUSTED_PUBLIC_KEY_PEM" ]]
          [[ -n "$DEPLOYMENT_TRUSTED_PUBLIC_KEY_PEM" ]]
          printf '%s' "$ACCEPTANCE_TRUSTED_PUBLIC_KEY_PEM" > "$ACCOUNT_ACCEPTANCE_TRUSTED_PUBLIC_KEY_FILE"
          printf '%s' "$DEPLOYMENT_TRUSTED_PUBLIC_KEY_PEM" > "$ACCOUNT_DEPLOYMENT_TRUSTED_PUBLIC_KEY_FILE"
          [[ -f "$ACCOUNT_ACCEPTANCE_EVIDENCE_FILE" && ! -L "$ACCOUNT_ACCEPTANCE_EVIDENCE_FILE" ]]
          [[ -f "$ACCOUNT_ACCEPTANCE_EVIDENCE_SIGNATURE_FILE" && ! -L "$ACCOUNT_ACCEPTANCE_EVIDENCE_SIGNATURE_FILE" ]]
      - name: Verify signed Account acceptance packet
        run: node tools/account-quality/verify-acceptance-evidence.mjs
      - name: Build exact verified publication
        run: |
          node tools/account-quality/prepare-account-acceptance-publication.mjs \
            "$ACCOUNT_INGEST_EVIDENCE_ROOT" \
            "$ACCOUNT_INGEST_PUBLICATION_ROOT"
      - name: Scrub ingest source and trust roots
        if: always()
        run: |
          for directory in "$ACCOUNT_INGEST_EVIDENCE_ROOT" "$ACCOUNT_INGEST_TRUST_ROOT"; do
            if [[ -d "$directory" ]]; then
              [[ "$directory" == "$RUNNER_TEMP/account-acceptance-source" || "$directory" == "$RUNNER_TEMP/account-acceptance-trust" ]]
              find "$directory" -depth -mindepth 1 -delete
              rmdir "$directory"
            fi
          done
      - name: Publish immutable exact-SHA acceptance evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          if-no-files-found: error
          name: account-acceptance-${{ github.sha }}
          path: ${{ runner.temp }}/account-acceptance-publication/
          retention-days: 90
