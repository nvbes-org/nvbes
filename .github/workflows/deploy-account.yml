name: deploy account

on:
  workflow_dispatch:

concurrency:
  group: deploy-account-production
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  ci-provenance:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: CI/CD security gate
        run: node tools/security/check-ci-cd-security.mjs --workflow .github/workflows/deploy-account.yml
      - name: Verify exact continuous integration provenance
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/ci/verify-ci-provenance.mjs

  build-scan-sign:
    needs: [ci-provenance]
    runs-on: [self-hosted, macOS, ARM64]
    if: ${{ success() }}
    timeout-minutes: 60
    environment:
      name: production-ci-cache
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: write
      security-events: write
    env:
      CI_CACHE_REGISTRY: ${{ vars.SCW_CI_CACHE_REGISTRY_ENDPOINT }}
      REGISTRY: ghcr.io
      IMAGE_NAME: nvbes-org/nvbes-account-service
      REUSED_SOURCE_IMAGE_DIGEST: ${{ vars.ACCOUNT_REUSE_SOURCE_IMAGE_DIGEST }}
      SOURCE_COMMIT_SHA: ${{ vars.ACCOUNT_REUSE_SOURCE_COMMIT_SHA }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: CI/CD security gate
        run: node tools/security/check-ci-cd-security.mjs --workflow .github/workflows/deploy-account.yml
      - name: Set deterministic build metadata
        if: env.REUSED_SOURCE_IMAGE_DIGEST == ''
        run: |
          echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"
          echo "LC_ALL=C" >> "$GITHUB_ENV"
          echo "TZ=UTC" >> "$GITHUB_ENV"
      - name: Authenticate to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Authenticate to Scaleway CI cache
        if: env.REUSED_SOURCE_IMAGE_DIGEST == ''
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.CI_CACHE_REGISTRY }}
          username: nologin
          password: ${{ secrets.SCW_CI_CACHE_SECRET_KEY }}
      - name: Set up Buildx
        if: env.REUSED_SOURCE_IMAGE_DIGEST == ''
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build and push immutable image
        if: env.REUSED_SOURCE_IMAGE_DIGEST == ''
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/account-service/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          build-args: SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: |
            type=registry,ref=${{ env.CI_CACHE_REGISTRY }}/rust-builder:rust-1.91.1-linux-amd64
            type=registry,ref=${{ env.CI_CACHE_REGISTRY }}/account-service:buildcache
          cache-to: |
            type=registry,ref=${{ env.CI_CACHE_REGISTRY }}/rust-builder:rust-1.91.1-linux-amd64,mode=max,compression=zstd,oci-mediatypes=true,image-manifest=true
            type=registry,ref=${{ env.CI_CACHE_REGISTRY }}/account-service:buildcache,mode=max,compression=zstd,oci-mediatypes=true,image-manifest=true
      - name: Block vulnerable release images
        if: env.REUSED_SOURCE_IMAGE_DIGEST == ''
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Sign container image
        if: env.REUSED_SOURCE_IMAGE_DIGEST == ''
        run: cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${{ steps.build.outputs.digest }}"
      - name: Verify reusable signed image
        if: env.REUSED_SOURCE_IMAGE_DIGEST != ''
        run: |
          [[ "$REUSED_SOURCE_IMAGE_DIGEST" =~ ^ghcr\.io/nvbes-org/nvbes-account-service@sha256:[0-9a-f]{64}$ ]]
          [[ "$SOURCE_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/deploy-account.yml@refs/heads/main"
          cosign verify "$REUSED_SOURCE_IMAGE_DIGEST" \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

  deploy-account:
    needs: [ci-provenance, build-scan-sign]
    if: ${{ success() && github.ref == 'refs/heads/main' }}
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 90
    environment:
      name: production-account
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
    env:
      SCW_DEFAULT_ORGANIZATION_ID: ${{ vars.SCW_ORGANIZATION_ID }}
      SCW_DEFAULT_PROJECT_ID: ${{ vars.SCW_PROJECT_ID }}
      SCW_DEFAULT_REGION: fr-par
      SCW_DEFAULT_ZONE: fr-par-1
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
      TF_VAR_private_network_id: ${{ vars.SCW_PRIVATE_NETWORK_ID }}
      TF_VAR_grafana_otlp_authorization_header: ${{ secrets.GRAFANA_OTLP_AUTHORIZATION_HEADER }}
      TF_VAR_grafana_otlp_endpoint: ${{ vars.GRAFANA_OTLP_ENDPOINT }}
      TF_VAR_scaleway_organization_id: ${{ vars.SCW_ORGANIZATION_ID }}
      TF_VAR_scaleway_project_id: ${{ vars.SCW_PROJECT_ID }}
      TF_VAR_account_metrics_token: ${{ secrets.ACCOUNT_METRICS_TOKEN }}
      TF_VAR_identity_token_key_id: ${{ vars.IDENTITY_TOKEN_KEY_ID }}
      TF_VAR_identity_token_public_key_pem: ${{ secrets.IDENTITY_TOKEN_PUBLIC_KEY_PEM }}
      TF_VAR_account_sentry_dsn: ${{ secrets.ACCOUNT_SENTRY_DSN }}
      TF_VAR_account_sentry_traces_sample_rate: ${{ vars.ACCOUNT_SENTRY_TRACES_SAMPLE_RATE }}
      TERRAFORM_STATE_BUCKET: ${{ vars.TERRAFORM_STATE_BUCKET }}
      ACCOUNT_TERRAFORM_STATE_KEY: production/account/terraform.tfstate
      ACCOUNT_REGISTRY_ENDPOINT: rg.fr-par.scw.cloud/nvbes-prod-account
      STACK_ROOT: infrastructure/environments/account-production
      REUSED_SOURCE_IMAGE_DIGEST: ${{ vars.ACCOUNT_REUSE_SOURCE_IMAGE_DIGEST }}
      SOURCE_COMMIT_SHA: ${{ vars.ACCOUNT_REUSE_SOURCE_COMMIT_SHA }}
      ACCOUNT_DEPLOY_APPROVED_SHA: ${{ vars.ACCOUNT_DEPLOY_APPROVED_SHA }}
      ACCOUNT_DEPLOY_CONFIRMATION: ${{ vars.ACCOUNT_DEPLOY_CONFIRMATION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: CI/CD security gate
        run: node tools/security/check-ci-cd-security.mjs --workflow .github/workflows/deploy-account.yml
      - name: Verify protected production candidate
        if: github.ref == 'refs/heads/main'
        run: |
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$ACCOUNT_DEPLOY_CONFIRMATION" == "deploy-account-production" ]]
          [[ "$ACCOUNT_DEPLOY_APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ACCOUNT_DEPLOY_APPROVED_SHA" == "$GITHUB_SHA" ]]
          [[ -n "$TERRAFORM_STATE_BUCKET" ]]
      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
      - name: Resolve verified deployment digest
        run: |
          if [[ -n "$REUSED_SOURCE_IMAGE_DIGEST" ]]; then
            source_image="$REUSED_SOURCE_IMAGE_DIGEST"
            digest="${source_image##*@}"
          else
            source_image="ghcr.io/nvbes-org/nvbes-account-service:${GITHUB_SHA}"
            digest="$(docker buildx imagetools inspect "$source_image" --format '{{.Manifest.Digest}}')"
            source_image="ghcr.io/nvbes-org/nvbes-account-service@${digest}"
          fi
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "SOURCE_ACCOUNT_IMAGE_DIGEST=${source_image}" >> "$GITHUB_ENV"
          echo "TF_VAR_account_image=${ACCOUNT_REGISTRY_ENDPOINT}/nvbes-account-service@${digest}" >> "$GITHUB_ENV"
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Verify signed release identity
        run: |
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/deploy-account.yml@refs/heads/main"
          cosign verify "$SOURCE_ACCOUNT_IMAGE_DIGEST" \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - name: Initialize isolated Account state
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ACCOUNT_TERRAFORM_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ACCOUNT_TERRAFORM_STATE_SECRET_KEY }}
        run: >-
          terraform -chdir="$STACK_ROOT" init
          -reconfigure
          -backend-config=backend.ci.hcl
          -backend-config="bucket=$TERRAFORM_STATE_BUCKET"
          -backend-config="key=$ACCOUNT_TERRAFORM_STATE_KEY"
      - name: Plan private image registry
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ACCOUNT_TERRAFORM_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ACCOUNT_TERRAFORM_STATE_SECRET_KEY }}
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        run: >-
          terraform -chdir="$STACK_ROOT" plan -lock-timeout=5m
          -target=scaleway_registry_namespace.account
          -out=account-registry.tfplan
      - name: Apply reviewed private registry plan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ACCOUNT_TERRAFORM_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ACCOUNT_TERRAFORM_STATE_SECRET_KEY }}
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        run: terraform -chdir="$STACK_ROOT" apply -lock-timeout=5m account-registry.tfplan
      - name: Mirror verified image into private Scaleway registry
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ACCOUNT_TERRAFORM_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ACCOUNT_TERRAFORM_STATE_SECRET_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        run: |
          endpoint="$(terraform -chdir="$STACK_ROOT" output -raw account_registry_endpoint)"
          [[ "$endpoint" == "$ACCOUNT_REGISTRY_ENDPOINT" ]]
          printf '%s' "$SCW_SECRET_KEY" | docker login "$endpoint" --username nologin --password-stdin
          destination="${endpoint}/nvbes-account-service:${GITHUB_SHA}"
          docker pull --platform linux/amd64 "$SOURCE_ACCOUNT_IMAGE_DIGEST"
          docker tag "$SOURCE_ACCOUNT_IMAGE_DIGEST" "$destination"
          docker push "$destination"
          digest="$(docker buildx imagetools inspect "$destination" --format '{{.Manifest.Digest}}')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "ACCOUNT_IMAGE_DIGEST=${endpoint}/nvbes-account-service@${digest}" >> "$GITHUB_ENV"
          echo "TF_VAR_account_image=${endpoint}/nvbes-account-service@${digest}" >> "$GITHUB_ENV"
      - name: Sign and verify private deployment image
        run: |
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/deploy-account.yml@refs/heads/main"
          cosign sign --yes "$ACCOUNT_IMAGE_DIGEST"
          cosign verify "$ACCOUNT_IMAGE_DIGEST" \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Plan migration foundation
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ACCOUNT_TERRAFORM_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ACCOUNT_TERRAFORM_STATE_SECRET_KEY }}
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        run: >-
          terraform -chdir="$STACK_ROOT" plan -lock-timeout=5m
          -target=scaleway_job_definition.account_database_migration
          -target=scaleway_iam_api_key.account_database_runtime
          -target=scaleway_iam_policy.account_database_runtime
          -out=account-migration.tfplan
      - name: Apply reviewed migration foundation plan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ACCOUNT_TERRAFORM_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ACCOUNT_TERRAFORM_STATE_SECRET_KEY }}
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        run: terraform -chdir="$STACK_ROOT" apply -lock-timeout=5m account-migration.tfplan
      - name: Run database migrations
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ACCOUNT_TERRAFORM_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ACCOUNT_TERRAFORM_STATE_SECRET_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        run: |
          ref="$(terraform -chdir="$STACK_ROOT" output -raw account_database_migration_job_id)"
          job_id="${ref##*/}"
          response="$(curl --fail-with-body --silent --show-error --request POST \
            --header "X-Auth-Token: $SCW_SECRET_KEY" --header 'Content-Type: application/json' \
            --data '{}' "https://api.scaleway.com/serverless-jobs/v1alpha2/regions/fr-par/job-definitions/${job_id}/start")"
          run_id="$(jq -er '.job_runs[0].id' <<<"$response")"
          state=queued
          for _attempt in {1..60}; do
            response="$(curl --fail-with-body --silent --show-error \
              --header "X-Auth-Token: $SCW_SECRET_KEY" \
              "https://api.scaleway.com/serverless-jobs/v1alpha2/regions/fr-par/job-runs/${run_id}")"
            state="$(jq -er '.state' <<<"$response")"
            case "$state" in
              succeeded) break ;;
              failed|canceled|interrupted) exit 1 ;;
            esac
            sleep 10
          done
          [[ "$state" == "succeeded" ]]
      - name: Plan Account runtime
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ACCOUNT_TERRAFORM_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ACCOUNT_TERRAFORM_STATE_SECRET_KEY }}
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        run: terraform -chdir="$STACK_ROOT" plan -lock-timeout=5m -out=account-runtime.tfplan
      - name: Apply reviewed Account runtime plan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ACCOUNT_TERRAFORM_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ACCOUNT_TERRAFORM_STATE_SECRET_KEY }}
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        run: terraform -chdir="$STACK_ROOT" apply -lock-timeout=5m account-runtime.tfplan
      - name: Prove Account public runtime
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ACCOUNT_TERRAFORM_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ACCOUNT_TERRAFORM_STATE_SECRET_KEY }}
          ACCOUNT_METRICS_TOKEN: ${{ secrets.ACCOUNT_METRICS_TOKEN }}
        run: tools/deployment/prove-account-public-runtime.sh
      - name: Prove Account synthetic lifecycle and outbox
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ACCOUNT_TERRAFORM_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ACCOUNT_TERRAFORM_STATE_SECRET_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        run: tools/deployment/prove-account-synthetic.sh
