name: validate platform operations restore

on:
  workflow_dispatch:
    inputs:
      approved_sha:
        description: Exact commit reviewed for Platform Operations recovery validation
        required: true
        type: string
      confirmation:
        description: Enter validate-platform-operations-restore
        required: true
        type: string

concurrency:
  group: validate-platform-operations-restore
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  validate-restore:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.approved_sha }}
          persist-credentials: false
      - name: CI/CD security gate
        run: >-
          node tools/security/check-ci-cd-security.mjs
          --workflow .github/workflows/validate-platform-operations-restore.yml
      - name: Enforce recovery approval contract
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          [[ "$CONFIRMATION" == "validate-platform-operations-restore" ]]
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - name: Validate isolated Platform Operations Terraform stack
        run: |
          terraform -chdir=infrastructure/environments/platform-operations-production init -backend=false -input=false
          terraform -chdir=infrastructure/environments/platform-operations-production validate
      - name: Verify recovery drill policy compliance
        run: |
          # Verify RPO <= 24h and RTO <= 8h constraints
          grep -q "RPO (Recovery Point Objective): at most 24 hours" docs/operations/backup-restore-policy.md
          grep -q "RTO (Recovery Time Objective): at most 8 hours" docs/operations/backup-restore-policy.md
