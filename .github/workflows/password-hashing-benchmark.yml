name: password hashing benchmark

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

concurrency:
  group: password-hashing-benchmark-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  benchmark:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: CI/CD security gate
        run: node tools/security/check-ci-cd-security.mjs
      - name: Select stable Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
      - name: Benchmark Argon2id
        run: >-
          cargo test -p nvbes-core benchmark_argon2id_latency
          --release -- --ignored --nocapture
