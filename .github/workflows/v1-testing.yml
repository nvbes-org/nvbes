name: V1 testing campaign
run-name: ${{ inputs.fallback_of && format('CI local fallback {0}', inputs.fallback_of) || format('V1 {0} {1}', inputs.runner || 'github-hosted', github.run_id) }}
on:
  workflow_dispatch:
    inputs:
      runner:
        description: GitHub-hosted first; local for a confirmed hosted outage
        type: choice
        options: [github-hosted, local]
        default: github-hosted
      expected_sha:
        description: Required exact candidate SHA when using local runners
        type: string
      fallback_of:
        description: Original hosted run ID (automatic fallback deduplication)
        type: string
concurrency:
  group: v1-testing-${{ github.ref }}
  cancel-in-progress: true
permissions:
  actions: read
  contents: read
defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}
env:
  CI: 'true'
  NVBES_ENV: ci
  NX_NO_CLOUD: 'true'
  NX_DAEMON: 'false'
  NX_WORKSPACE_DATA_DIRECTORY: .nx/cache/workspace-data
jobs:
  typescript-measurement:
    if: ${{ (github.event_name != 'workflow_dispatch' || inputs.runner != 'local' || inputs.expected_sha == github.sha) }}
    name: TypeScript measurement (${{ matrix.package }})
    environment:
      name: ci-no-secrets
      deployment: false
    runs-on: ${{ github.event_name == 'workflow_dispatch' && inputs.runner == 'local' && fromJSON('["self-hosted","Linux","ARM64","docker"]') || 'ubuntu-latest' }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - package: http-client
            unit: '@nvbes/http-client'
          - package: billing-client
            unit: '@nvbes/billing-client'
          - package: account-client
            unit: '@nvbes/account-client'
          - package: identity-sdk
            unit: '@nvbes/identity-sdk'
          - package: identity-client
            unit: '@nvbes/identity-client'
          - package: identity-sdk-web
            unit: '@nvbes/identity-sdk-web'
          - package: web-runtime
            unit: '@nvbes/web-runtime'
          - package: web-ui
            unit: '@nvbes/web-ui'
          - package: email-ui
            unit: '@nvbes/email-ui'
    env:
      NVBES_COVERAGE_PACKAGE: ${{ matrix.package }}
      NVBES_MUTATION_PACKAGE: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: CI/CD security gate
        run: >-
          node tools/security/check-ci-cd-security.mjs
          --workflow .github/workflows/v1-testing.yml
      - uses: ./.github/actions/ci-setup
        id: setup
        with:
          node: 'true'
          rust: 'false'
          terraform: 'false'
          caches: pnpm
      - name: Measure TypeScript coverage
        id: coverage
        run: ./node_modules/.bin/nx run test-summary:coverage:typescript
      - name: Measure TypeScript mutations
        id: mutation
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: ./node_modules/.bin/nx run test-summary:mutation:typescript
      - name: Produce TypeScript measurement receipt
        run: >-
          ./node_modules/.bin/nx run test-summary:measurement:typescript
          --unit=${{ matrix.unit }}
          --coverage=.temp/typescript/${{ matrix.package }}/coverage/coverage-summary.json
          --mutation=.temp/typescript/${{ matrix.package }}/mutation.json
      - name: Publish TypeScript measurement
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v1-measurement-typescript-${{ matrix.package }}-${{ github.sha }}
          path: .temp/v1-measurements/typescript-${{ matrix.package }}
          if-no-files-found: error
          retention-days: 7
      - name: Publish TypeScript diagnostics
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v1-diagnostic-typescript-${{ matrix.package }}-${{ github.sha }}
          path: |
            .temp/typescript/${{ matrix.package }}/coverage/coverage-summary.json
            .temp/typescript/${{ matrix.package }}/mutation.json
          if-no-files-found: error
          retention-days: 7

  local-fallback:
    if: ${{ inputs.runner != 'local' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) }}
    runs-on: [self-hosted, Linux, ARM64, docker]
    timeout-minutes: 5
    permissions:
      actions: write
      checks: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: CI/CD security gate
        run: node tools/security/check-ci-cd-security.mjs --workflow .github/workflows/v1-testing.yml
      - name: Retry confirmed hosted startup failure once on local runners
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/ci/runner-fallback.mjs
