name: account-quality

on:
  schedule:
    - cron: '17 1 * * *'
    - cron: '31 1 * * 0'
  workflow_dispatch:
    inputs:
      lane:
        description: Exact Account quality lane
        required: true
        default: nightly
        type: choice
        options:
          - nightly
          - resilience
      profile:
        description: Resilience profile; ignored by the nightly lane
        required: true
        default: stress
        type: choice
        options:
          - volume
          - spike
          - stress
          - soak
      duration:
        description: Exact profile duration; mismatched profile/duration fails
        required: true
        default: profile-default
        type: choice
        options:
          - profile-default
          - 6m
          - 15m
          - 30m
          - 4h
      web_url:
        description: Exact allowlisted staging Account web origin
        required: false
        type: string
      service_url:
        description: Exact allowlisted staging Account service origin
        required: false
        type: string

concurrency:
  group: account-quality-campaign
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

env:
  ACCOUNT_PRODUCTION_DENIED_ORIGINS: ${{ vars.ACCOUNT_PRODUCTION_DENIED_ORIGINS }}
  CI: 'true'

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  quality-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: CI/CD security gate
        run: node tools/security/check-ci-cd-security.mjs
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Validate Account quality contracts
        run: pnpm exec nx run account-quality:test

  campaign-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ACCOUNT_K6_DURATION: ${{ inputs.duration || 'profile-default' }}
      ACCOUNT_LOAD_ALLOWED_ORIGINS: ${{ vars.ACCOUNT_TEST_ALLOWED_SERVICE_ORIGINS }}
      ACCOUNT_SERVICE_BASE_URL: ${{ inputs.service_url || vars.ACCOUNT_TEST_SERVICE_URL }}
      ACCOUNT_TEST_AUTOMATION_ENABLED: ${{ vars.ACCOUNT_TEST_AUTOMATION_ENABLED }}
      ACCOUNT_WEB_ALLOWED_ORIGINS: ${{ vars.ACCOUNT_TEST_ALLOWED_WEB_ORIGINS }}
      EVENT_NAME: ${{ github.event_name }}
      EVENT_SCHEDULE: ${{ github.event.schedule }}
      K6_PROFILE: ${{ inputs.profile || 'volume' }}
      K6_SUITE: account-api
      NVBES_TARGET_ENV: staging
      NVBES_WEB_BASE_URL: ${{ inputs.web_url || vars.ACCOUNT_TEST_WEB_URL }}
      REQUESTED_LANE: ${{ inputs.lane || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Fail closed when a scheduled campaign is disabled
        run: |
          if [[ "$EVENT_NAME" == "schedule" && "$ACCOUNT_TEST_AUTOMATION_ENABLED" != "true" ]]; then
            echo "Scheduled Account quality automation is disabled or unset." >&2
            exit 1
          fi
      - name: Validate lane, exact targets and duration
        run: |
          if [[ "$EVENT_NAME" == "schedule" && "$EVENT_SCHEDULE" == "17 1 * * *" ]]; then
            node tools/account-quality/validate-load-target.mjs web
            node tools/account-quality/validate-load-target.mjs service
          elif [[ "$EVENT_NAME" == "schedule" && "$EVENT_SCHEDULE" == "31 1 * * 0" ]]; then
            node tools/account-quality/validate-load-target.mjs service
            ACCOUNT_K6_DURATION=profile-default node tools/account-quality/validate-resilience-inputs.mjs
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$REQUESTED_LANE" == "nightly" ]]; then
            node tools/account-quality/validate-load-target.mjs web
            node tools/account-quality/validate-load-target.mjs service
          elif [[ "$EVENT_NAME" == "workflow_dispatch" && "$REQUESTED_LANE" == "resilience" ]]; then
            node tools/account-quality/validate-load-target.mjs service
            node tools/account-quality/validate-resilience-inputs.mjs
          else
            echo "Unsupported Account quality trigger or lane." >&2
            exit 1
          fi

  browser-compatibility:
    needs:
      - campaign-gate
      - quality-contract
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '17 1 * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.lane == 'nightly')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NVBES_TARGET_ENV: staging
      NVBES_WEB_BASE_URL: ${{ inputs.web_url || vars.ACCOUNT_TEST_WEB_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: CI/CD security gate
        run: node tools/security/check-ci-cd-security.mjs
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Install browser compatibility matrix
        run: pnpm --dir apps/account-web exec playwright install --with-deps chromium firefox webkit
      - name: Run accessibility, cookie, UI and compatibility tests
        run: pnpm nx run account-web:test:e2e:compatibility
      - name: Upload required browser evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: account-browser-${{ github.run_id }}
          path: |
            apps/account-web/playwright-report/
            apps/account-web/test-results/
          retention-days: 30
          if-no-files-found: error

  nightly-load:
    needs:
      - campaign-gate
      - quality-contract
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '17 1 * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.lane == 'nightly')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ACCOUNT_LOAD_ALLOWED_ORIGINS: ${{ vars.ACCOUNT_TEST_ALLOWED_SERVICE_ORIGINS }}
      ACCOUNT_SERVICE_BASE_URL: ${{ inputs.service_url || vars.ACCOUNT_TEST_SERVICE_URL }}
      K6_PROFILE: load
      K6_SUITE: account-api
      NVBES_RELEASE: ${{ github.sha }}
      NVBES_TARGET_ENV: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: CI/CD security gate
        run: node tools/security/check-ci-cd-security.mjs
      - name: Run Account nominal load profile
        run: bash tools/account-quality/run-account-k6.sh
      - name: Upload required load evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: account-load-${{ github.run_id }}
          path: .temp/account-quality/k6/
          retention-days: 30
          if-no-files-found: error

  weekly-resilience:
    needs:
      - campaign-gate
      - quality-contract
    if: github.event_name == 'schedule' && github.event.schedule == '31 1 * * 0'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        profile:
          - volume
          - spike
          - stress
    env:
      ACCOUNT_K6_DURATION: profile-default
      ACCOUNT_LOAD_ALLOWED_ORIGINS: ${{ vars.ACCOUNT_TEST_ALLOWED_SERVICE_ORIGINS }}
      ACCOUNT_SERVICE_BASE_URL: ${{ vars.ACCOUNT_TEST_SERVICE_URL }}
      K6_PROFILE: ${{ matrix.profile }}
      K6_SUITE: account-api
      NVBES_RELEASE: ${{ github.sha }}
      NVBES_TARGET_ENV: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: CI/CD security gate
        run: node tools/security/check-ci-cd-security.mjs
      - name: Run serialized resilience profile
        run: bash tools/account-quality/run-account-resilience.sh
      - name: Upload required resilience evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: account-${{ matrix.profile }}-${{ github.run_id }}
          path: .temp/account-quality/k6/
          retention-days: 30
          if-no-files-found: error

  manual-resilience:
    needs:
      - campaign-gate
      - quality-contract
    if: github.event_name == 'workflow_dispatch' && inputs.lane == 'resilience'
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      ACCOUNT_K6_DURATION: ${{ inputs.duration }}
      ACCOUNT_LOAD_ALLOWED_ORIGINS: ${{ vars.ACCOUNT_TEST_ALLOWED_SERVICE_ORIGINS }}
      ACCOUNT_SERVICE_BASE_URL: ${{ inputs.service_url || vars.ACCOUNT_TEST_SERVICE_URL }}
      K6_PROFILE: ${{ inputs.profile }}
      K6_SUITE: account-api
      NVBES_RELEASE: ${{ github.sha }}
      NVBES_TARGET_ENV: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: CI/CD security gate
        run: node tools/security/check-ci-cd-security.mjs
      - name: Run exact manual resilience profile
        run: bash tools/account-quality/run-account-resilience.sh
      - name: Upload required manual resilience evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: account-${{ inputs.profile }}-${{ github.run_id }}
          path: .temp/account-quality/k6/
          retention-days: 30
          if-no-files-found: error
