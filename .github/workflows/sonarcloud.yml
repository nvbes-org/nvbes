name: sonarcloud

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sonarcloud-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  pull-requests: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  sonarcloud:
    name: SonarCloud Strict Quality Analysis
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      SQLX_OFFLINE: 'true'
      SCW_CI_CACHE_BUCKET: ${{ vars.SCW_CI_CACHE_BUCKET }}
      SCW_CI_CACHE_S3_ENDPOINT: ${{ vars.SCW_CI_CACHE_S3_ENDPOINT }}
      SCW_CI_CACHE_REGION: ${{ vars.SCW_CI_CACHE_REGION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: CI/CD security gate
        run: node tools/security/check-ci-cd-security.mjs --workflow .github/workflows/sonarcloud.yml
      - uses: ./.github/actions/ci-setup
        with:
          node: 'true'
          rust: 'true'
          coverage: 'true'
          terraform: 'false'
          caches: pnpm cargo
          cache-key: ${{ secrets.SCW_CI_CACHE_ACCESS_KEY }}
          cache-secret: ${{ secrets.SCW_CI_CACHE_SECRET_KEY }}
      - name: Start isolated security PostgreSQL
        run: node tools/ci/test-security-database.mjs
      - name: Prepare SonarCloud analysis reports
        run: bash scripts/prepare-sonar-reports.sh
      - name: Verify SonarCloud credentials
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [[ -z "${SONAR_TOKEN:-}" ]]; then
            echo "::error title=Missing SONAR_TOKEN::The SONAR_TOKEN secret is not configured in GitHub repository secrets. Please create a token on https://sonarcloud.io (My Account > Security) and add it to GitHub Settings > Secrets and variables > Actions > Repository secrets."
            exit 1
          fi
      - name: Execute SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@299e4b793aaa83bf2aba7c9c14bedbb485688ec4 # v7.1.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: Stop security PostgreSQL
        if: always()
        run: node tools/ci/test-security-database.mjs stop
