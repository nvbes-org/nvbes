name: reproducible build

on:
  workflow_dispatch:

concurrency:
  group: reproducible-build-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  verify-container-reproducibility:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: CI/CD security gate
        run: node tools/security/check-ci-cd-security.mjs
      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Derive deterministic timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"
      - name: Build the same worker twice from clean state
        run: |
          docker buildx build \
            --no-cache \
            --provenance=false \
            --sbom=false \
            --build-arg "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" \
            --file apps/billing-worker/Dockerfile \
            --iidfile /tmp/build-1.iid \
            --output type=oci,dest=/tmp/build-1.oci \
            .
          docker buildx build \
            --no-cache \
            --provenance=false \
            --sbom=false \
            --build-arg "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" \
            --file apps/billing-worker/Dockerfile \
            --iidfile /tmp/build-2.iid \
            --output type=oci,dest=/tmp/build-2.oci \
            .
      - name: Require identical image digests
        run: |
          cmp /tmp/build-1.iid /tmp/build-2.iid
          cmp /tmp/build-1.oci /tmp/build-2.oci
      - name: Upload divergent artifacts
        if: failure()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.2
        with:
          name: reproducibility-failure-${{ github.run_id }}
          path: |
            /tmp/build-1.iid
            /tmp/build-2.iid
            /tmp/build-1.oci
            /tmp/build-2.oci
          retention-days: 14
