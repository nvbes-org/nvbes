name: continuous integration

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['main', 'staging', 'dev']
  workflow_dispatch:

concurrency:
  group: continuous-integration-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  email-quality:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 90
    env:
      CI: 'true'
      CARGO_INCREMENTAL: '0'
      RUSTFLAGS: '-C debuginfo=0'
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: 'true'
      NVBES_ENV: ci
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: nvbes_email_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d nvbes_email_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: CI/CD security gate
        run: node tools/security/check-ci-cd-security.mjs --workflow .github/workflows/ci.yml
      - name: Enable pnpm
        run: |-
          corepack enable
          corepack prepare pnpm@11.18.0 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Enforce FinOps contract
        run: pnpm check:finops
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - name: Initialize isolated email Terraform providers
        run: >-
          terraform -chdir=infrastructure/environments/email-production init
          -backend=false
          -input=false
      - name: Validate isolated email Terraform stack
        run: terraform -chdir=infrastructure/environments/email-production validate
      - name: Initialize isolated Identity Terraform providers
        run: >-
          terraform -chdir=infrastructure/environments/identity-production init
          -backend=false
          -input=false
      - name: Validate isolated Identity Terraform stack
        run: terraform -chdir=infrastructure/environments/identity-production validate
      - name: Initialize CI cache bootstrap providers
        run: >-
          terraform -chdir=infrastructure/bootstrap/production/initial init
          -backend=false
          -input=false
      - name: Validate CI cache bootstrap
        run: terraform -chdir=infrastructure/bootstrap/production/initial validate
      - name: Validate CI workflow contract
        run: node --test tools/ci/continuous-integration-contract.test.mjs
      - name: Export email test database URL
        run: |
          database_url="postgres://postgres:postgres@host.docker.internal:${{ job.services.postgres.ports[5432] }}/nvbes_email_test"
          printf '%s\n' "DATABASE_URL=${database_url}" >> "${GITHUB_ENV}"
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.91.1
          components: rustfmt, clippy
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0
      - name: Validate active workspace
        run: |
          pnpm format:check
          pnpm check:structure
          pnpm check:nx-boundaries
          pnpm check:secrets
          pnpm check:web
          pnpm check:api
      - name: Validate email deployment contract
        run: pnpm test:pre-deploy
      - name: Initialize email stack Terraform providers
        run: >-
          terraform -chdir=infrastructure/stacks/email/production init
          -backend=false
          -input=false
      - name: Validate email Terraform stack
        run: terraform -chdir=infrastructure/stacks/email/production validate
      - name: Test email Terraform deployment and rotation
        run: >-
          PATH="$PWD/infrastructure/stacks/email/production/tests/bin:$PATH"
          terraform -chdir=infrastructure/stacks/email/production test
      - name: Test email contract and runtime
        if: github.event_name != 'push'
        run: pnpm test
      - name: Test email database invariants
        run: bash scripts/test-email-worker-database.sh
      - name: Validate email container contract
        run: node --test apps/email-worker/tests/container-contract.test.mjs
      - name: Validate Identity container contract
        run: pnpm nx run identity-service:test:container
      - name: Validate Identity restore contract
        run: node --test tools/ci/identity-restore-contract.test.mjs

  rust-tests-scaleway-cache:
    if: github.event_name == 'push'
    environment:
      name: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/staging' || startsWith(github.ref, 'refs/heads/release/')) && 'production-ci-cache' || 'branch-ci-cache' }}
      deployment: false
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: '0'
      RUSTC_WRAPPER: sccache
      SCCACHE_BUCKET: ${{ vars.SCW_CI_CACHE_BUCKET }}
      SCCACHE_ENDPOINT: ${{ vars.SCW_CI_CACHE_S3_ENDPOINT }}
      SCCACHE_REGION: ${{ vars.SCW_CI_CACHE_REGION }}
      SCCACHE_S3_USE_SSL: 'true'
      SCCACHE_S3_ENABLE_VIRTUAL_HOST_STYLE: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify pushed branch revision
        run: |
          [[ "$GITHUB_EVENT_NAME" == "push" ]]
          [[ "$GITHUB_REF" == refs/heads/* ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.91.1
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0
      - name: Detect Scaleway cache credentials
        id: scaleway-cache
        env:
          SCW_CACHE_ACCESS_KEY: ${{ secrets.SCW_CI_CACHE_ACCESS_KEY }}
          SCW_CACHE_SECRET_KEY: ${{ secrets.SCW_CI_CACHE_SECRET_KEY }}
          SCW_CACHE_BUCKET: ${{ vars.SCW_CI_CACHE_BUCKET }}
        run: |
          if [[ -n "$SCW_CACHE_ACCESS_KEY" && -n "$SCW_CACHE_SECRET_KEY" && -n "$SCW_CACHE_BUCKET" ]]; then
            printf '%s\n' 'available=true' >> "$GITHUB_OUTPUT"
          else
            printf '%s\n' 'available=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Run Rust tests with Scaleway cache
        if: github.event_name == 'push' && steps.scaleway-cache.outputs.available == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SCW_CI_CACHE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SCW_CI_CACHE_SECRET_KEY }}
          SCCACHE_S3_KEY_PREFIX: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/staging' || startsWith(github.ref, 'refs/heads/release/')) && 'trusted' || format('branches/{0}', github.ref_name) }}/rust/${{ runner.os }}-${{ runner.arch }}/rust-1.91.1
        run: |
          sccache --zero-stats
          cargo test --workspace --locked
          sccache --show-stats
      - name: Run Rust tests with bootstrap cache fallback
        if: github.event_name == 'push' && steps.scaleway-cache.outputs.available != 'true'
        env:
          SCCACHE_GHA_ENABLED: 'true'
        run: |
          sccache --zero-stats
          cargo test --workspace --locked
          sccache --show-stats
