name: continuous integration

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['main', 'dev']
  workflow_dispatch:

concurrency:
  group: continuous-integration-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  quality:
    environment:
      name: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/heads/release/')) && 'production-ci-cache' || 'branch-ci-cache' }}
      deployment: false
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 90
    env:
      CI: 'true'
      CARGO_INCREMENTAL: '0'
      RUSTFLAGS: '-C debuginfo=0'
      RUSTC_WRAPPER: sccache
      SCCACHE_BUCKET: ${{ vars.SCW_CI_CACHE_BUCKET }}
      SCCACHE_ENDPOINT: ${{ vars.SCW_CI_CACHE_S3_ENDPOINT }}
      SCCACHE_REGION: ${{ vars.SCW_CI_CACHE_REGION }}
      SCCACHE_S3_USE_SSL: 'true'
      SCCACHE_S3_ENABLE_VIRTUAL_HOST_STYLE: 'true'
      NVBES_ENV: ci
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: nvbes_email_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d nvbes_email_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: CI/CD security gate
        run: node tools/security/check-ci-cd-security.mjs --workflow .github/workflows/ci.yml
      - name: Enable pnpm
        run: |-
          corepack enable
          corepack prepare pnpm@11.18.0 --activate
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Enforce FinOps contract
        run: pnpm check:finops
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - name: Initialize isolated email Terraform providers
        run: >-
          terraform -chdir=infrastructure/environments/email-production init
          -backend=false
          -input=false
      - name: Validate isolated email Terraform stack
        run: terraform -chdir=infrastructure/environments/email-production validate
      - name: Verify pushed branch revision
        if: github.event_name == 'push'
        run: |
          [[ "$GITHUB_EVENT_NAME" == "push" ]]
          [[ "$GITHUB_REF" == refs/heads/* ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
      - name: Configure Nx cache and affected scope
        id: nx-scope
        env:
          NVBES_CI_BASE_CANDIDATE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node tools/ci/nx-cache-manager.mjs
      - name: Initialize isolated Identity Terraform providers
        if: steps.nx-scope.outputs.identity-affected == 'true'
        run: >-
          terraform -chdir=infrastructure/environments/identity-production init
          -backend=false
          -input=false
      - name: Validate isolated Identity Terraform stack
        if: steps.nx-scope.outputs.identity-affected == 'true'
        run: terraform -chdir=infrastructure/environments/identity-production validate
      - name: Initialize Account Terraform providers
        if: steps.nx-scope.outputs.account-affected == 'true'
        run: >-
          terraform -chdir=infrastructure/environments/account-production init
          -backend=false
          -input=false
      - name: Validate isolated Account Terraform stack
        if: steps.nx-scope.outputs.account-affected == 'true'
        run: terraform -chdir=infrastructure/environments/account-production validate
      - name: Initialize Billing Terraform providers
        if: steps.nx-scope.outputs.billing-affected == 'true'
        run: >-
          terraform -chdir=infrastructure/environments/billing-production init
          -backend=false
          -input=false
      - name: Validate isolated Billing Terraform stack
        if: steps.nx-scope.outputs.billing-affected == 'true'
        run: terraform -chdir=infrastructure/environments/billing-production validate
      - name: Initialize Trust/Risk Terraform providers
        if: steps.nx-scope.outputs.trust-risk-affected == 'true'
        run: >-
          terraform -chdir=infrastructure/environments/trust-risk-production init
          -backend=false
          -input=false
      - name: Validate isolated Trust/Risk Terraform stack
        if: steps.nx-scope.outputs.trust-risk-affected == 'true'
        run: terraform -chdir=infrastructure/environments/trust-risk-production validate
      - name: Initialize Platform Operations Terraform providers
        if: steps.nx-scope.outputs.platform-affected == 'true'
        run: >-
          terraform -chdir=infrastructure/environments/platform-operations-production init
          -backend=false
          -input=false
      - name: Validate isolated Platform Operations Terraform stack
        if: steps.nx-scope.outputs.platform-affected == 'true'
        run: terraform -chdir=infrastructure/environments/platform-operations-production validate
      - name: Initialize CI cache bootstrap providers
        run: >-
          terraform -chdir=infrastructure/bootstrap/production/initial init
          -backend=false
          -input=false
      - name: Validate CI cache bootstrap
        run: terraform -chdir=infrastructure/bootstrap/production/initial validate
      - name: Validate CI workflow contract
        run: >-
          node --test
          tools/ci/continuous-integration-contract.test.mjs
          tools/ci/deployment-provenance-contract.test.mjs
          tools/ci/nx-cache-manager.test.mjs
          tools/ci/verify-ci-provenance.test.mjs
      - name: Export email test database URL
        if: steps.nx-scope.outputs.email-affected == 'true'
        run: |
          database_url="postgres://postgres:postgres@host.docker.internal:${{ job.services.postgres.ports['5432'] }}/nvbes_email_test"
          printf '%s\n' "DATABASE_URL=${database_url}" >> "${GITHUB_ENV}"
      - name: Provision isolated Account test database
        if: steps.nx-scope.outputs.account-affected == 'true'
        run: |
          docker exec "${{ job.services.postgres.id }}" createdb --username postgres nvbes_account_test
          account_database_url="postgres://postgres:postgres@host.docker.internal:${{ job.services.postgres.ports['5432'] }}/nvbes_account_test"
          printf '%s\n' "NVBES_ACCOUNT_DATABASE_URL=${account_database_url}" >> "${GITHUB_ENV}"
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.91.1
          components: rustfmt, clippy
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0
      - name: Configure Rust compilation cache
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SCW_CI_CACHE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SCW_CI_CACHE_SECRET_KEY }}
          SCCACHE_S3_KEY_PREFIX: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/heads/release/')) && 'trusted' || format('branches/{0}', github.ref_name) }}/rust/${{ runner.os }}-${{ runner.arch }}/rust-1.91.1
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "push" || -z "$AWS_ACCESS_KEY_ID" || -z "$AWS_SECRET_ACCESS_KEY" || -z "$SCCACHE_BUCKET" ]]; then
            unset AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY
            unset SCCACHE_BUCKET SCCACHE_ENDPOINT SCCACHE_REGION SCCACHE_S3_KEY_PREFIX
            export SCCACHE_GHA_ENABLED=true
          fi
          sccache --start-server
      - name: Test Rust workspace
        if: steps.nx-scope.outputs.rust-affected == 'true'
        run: |
          sccache --zero-stats
          cargo test --workspace --locked
          sccache --show-stats
      - name: Validate global workspace contracts
        run: |
          pnpm exec vp fmt --check package.json pnpm-workspace.yaml vite.config.ts tsconfig.base.json nx.json
          cargo fmt --all --check
          pnpm check:structure
          pnpm check:nx-boundaries
          pnpm check:secrets
          pnpm check:web-runtime-guardrails
          pnpm check:ajax-security
      - name: Validate affected TypeScript projects
        if: steps.nx-scope.outputs.typescript-projects != ''
        run: >-
          pnpm exec nx run-many
          -t format:check,lint,typecheck,check
          --projects="${{ steps.nx-scope.outputs.typescript-projects }}"
      - name: Validate email deployment contract
        if: steps.nx-scope.outputs.email-affected == 'true'
        run: pnpm test:pre-deploy
      - name: Initialize email stack Terraform providers
        if: steps.nx-scope.outputs.email-affected == 'true'
        run: >-
          terraform -chdir=infrastructure/stacks/email/production init
          -backend=false
          -input=false
      - name: Validate email Terraform stack
        if: steps.nx-scope.outputs.email-affected == 'true'
        run: terraform -chdir=infrastructure/stacks/email/production validate
      - name: Test email Terraform deployment and rotation
        if: steps.nx-scope.outputs.email-affected == 'true'
        run: >-
          PATH="$PWD/infrastructure/stacks/email/production/tests/bin:$PATH"
          terraform -chdir=infrastructure/stacks/email/production test
      - name: Test email database invariants
        if: steps.nx-scope.outputs.email-affected == 'true'
        run: bash scripts/test-email-worker-database.sh
      - name: Test Account database invariants
        if: steps.nx-scope.outputs.account-affected == 'true'
        env:
          DATABASE_URL: ${{ env.NVBES_ACCOUNT_DATABASE_URL }}
        run: pnpm nx run account-service:test:database
      - name: Validate email container contract
        if: steps.nx-scope.outputs.email-affected == 'true'
        run: node --test apps/email-worker/tests/container-contract.test.mjs
      - name: Validate Identity container contract
        if: steps.nx-scope.outputs.identity-affected == 'true'
        run: pnpm nx run identity-service:test:container
      - name: Validate Account container contract
        if: steps.nx-scope.outputs.account-affected == 'true'
        run: pnpm nx run account-service:test:container
      - name: Validate Billing container contract
        if: steps.nx-scope.outputs.billing-affected == 'true'
        run: node --test apps/billing-service/tests/container-contract.test.mjs
      - name: Validate Trust/Risk container contract
        if: steps.nx-scope.outputs.trust-risk-affected == 'true'
        run: node --test apps/trust-risk-service/tests/container-contract.test.mjs
      - name: Validate Identity restore contract
        if: steps.nx-scope.outputs.identity-affected == 'true'
        run: node --test tools/ci/identity-restore-contract.test.mjs
      - name: Validate Platform Operations container contract
        if: steps.nx-scope.outputs.platform-affected == 'true'
        run: node apps/platform-operations-service/tests/container-contract.test.mjs
