name: continuous integration
run-name: CI github-hosted ${{ github.run_id }}
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:
    inputs:
      base_sha:
        description: Optional full base SHA (otherwise last successful branch CI)
        type: string
        required: false
      mode:
        description: Rollout mode (affected or shadow)
        type: choice
        options:
          - affected
          - shadow
        default: affected
        required: false
concurrency:
  group: continuous-integration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'merge_group' }}
permissions:
  actions: read
  contents: read
  pull-requests: read
defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}
env:
  CI: 'true'
  NVBES_ENV: ci
  NX_NO_CLOUD: 'true'
  NX_DAEMON: 'false'
  NX_WORKSPACE_DATA_DIRECTORY: .nx/cache/workspace-data
  TF_PLUGIN_CACHE_DIR: /tmp/nvbes-terraform-plugin-cache
jobs:
  authorize-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      trusted: ${{ steps.authorize.outputs.trusted }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted-base
      - name: Authorize internal signed PR cache access
        id: authorize
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            printf '%s\n' 'trusted=false' >> "$GITHUB_OUTPUT"
          elif [[ -f trusted-base/tools/ci/authorize-pr-cache.mjs ]]; then
            node trusted-base/tools/ci/authorize-pr-cache.mjs
          else
            printf '%s\n' 'trusted=false' >> "$GITHUB_OUTPUT"
          fi

  scope:
    needs: authorize-cache
    environment:
      name: ${{ github.event_name == 'push' && ((github.ref == 'refs/heads/main') && 'production-ci-cache' || 'branch-ci-cache') || (needs.authorize-cache.outputs.trusted == 'true' && 'branch-ci-cache' || 'ci-no-secrets') }}
      deployment: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SCW_CI_CACHE_BUCKET: ${{ vars.SCW_CI_CACHE_BUCKET }}
      SCW_CI_CACHE_S3_ENDPOINT: ${{ vars.SCW_CI_CACHE_S3_ENDPOINT }}
      SCW_CI_CACHE_REGION: ${{ vars.SCW_CI_CACHE_REGION }}
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      contracts-required: ${{ steps.plan.outputs.contracts-required }}
      typescript-required: ${{ steps.plan.outputs.typescript-required }}
      rust-required: ${{ steps.plan.outputs.rust-required }}
      database-required: ${{ steps.plan.outputs.database-required }}
      terraform-required: ${{ steps.plan.outputs.terraform-required }}
      containers-required: ${{ steps.plan.outputs.containers-required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: CI/CD security gate
        run: node tools/security/check-ci-cd-security.mjs --workflow .github/workflows/ci.yml
      - name: Verify pushed branch revision
        if: github.event_name == 'push'
        run: |
          [[ "$GITHUB_EVENT_NAME" == "push" ]]
          [[ "$GITHUB_REF" == refs/heads/* ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
      - name: Resolve last successful base and classify diff
        id: preflight
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NVBES_CI_BASE_SHA: ${{ inputs.base_sha }}
        run: node tools/ci/scope-preflight.mjs
      - uses: ./.github/actions/ci-setup
        if: steps.preflight.outputs.graph-required == 'true'
        with:
          caches: pnpm
          cache-key: ${{ secrets.SCW_CI_CACHE_ACCESS_KEY }}
          cache-secret: ${{ secrets.SCW_CI_CACHE_SECRET_KEY }}
      - name: Enforce FinOps contract
        if: steps.preflight.outputs.graph-required == 'true'
        run: pnpm check:finops
      - name: Verify workflows and documentation drift
        if: steps.preflight.outputs.graph-required == 'true'
        run: |
          pnpm check:workflows
          pnpm doc:check-drift
      - name: Configure affected scope
        id: plan
        env:
          NVBES_CI_ROLLOUT_MODE: ${{ inputs.mode || 'affected' }}
        run: node tools/ci/nx-cache-manager.mjs

  contracts:
    needs: [authorize-cache, scope]
    if: ${{ !cancelled() && needs.scope.result == 'success' && needs.authorize-cache.result == 'success' && needs.scope.outputs.contracts-required == 'true' }}
    environment:
      name: ${{ github.event_name == 'push' && ((github.ref == 'refs/heads/main') && 'production-ci-cache' || 'branch-ci-cache') || (needs.authorize-cache.outputs.trusted == 'true' && 'branch-ci-cache' || 'ci-no-secrets') }}
      deployment: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SCW_CI_CACHE_BUCKET: ${{ vars.SCW_CI_CACHE_BUCKET }}
      SCW_CI_CACHE_S3_ENDPOINT: ${{ vars.SCW_CI_CACHE_S3_ENDPOINT }}
      SCW_CI_CACHE_REGION: ${{ vars.SCW_CI_CACHE_REGION }}
      NVBES_CI_PLAN: ${{ needs.scope.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: CI/CD security gate
        run: node tools/security/check-ci-cd-security.mjs --workflow .github/workflows/ci.yml
      - uses: ./.github/actions/ci-setup
        with:
          node: 'true'
          rust: 'false'
          terraform: 'false'
          caches: pnpm nx
          cache-key: ${{ secrets.SCW_CI_CACHE_ACCESS_KEY }}
          cache-secret: ${{ secrets.SCW_CI_CACHE_SECRET_KEY }}
      - name: Validate contracts
        run: node tools/ci/run-lane.mjs contracts
      - name: Publish successful protected lane caches
        if: success() && (github.event_name == 'push' && (github.ref == 'refs/heads/main') || github.event_name == 'pull_request' && needs.authorize-cache.outputs.trusted == 'true')
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SCW_CI_CACHE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SCW_CI_CACHE_SECRET_KEY }}
        run: node tools/ci/scaleway-cache-manager.mjs save pnpm nx

  typescript:
    needs: [authorize-cache, scope]
    if: ${{ !cancelled() && needs.scope.result == 'success' && needs.authorize-cache.result == 'success' && needs.scope.outputs.typescript-required == 'true' }}
    environment:
      name: ${{ github.event_name == 'push' && ((github.ref == 'refs/heads/main') && 'production-ci-cache' || 'branch-ci-cache') || (needs.authorize-cache.outputs.trusted == 'true' && 'branch-ci-cache' || 'ci-no-secrets') }}
      deployment: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SCW_CI_CACHE_BUCKET: ${{ vars.SCW_CI_CACHE_BUCKET }}
      SCW_CI_CACHE_S3_ENDPOINT: ${{ vars.SCW_CI_CACHE_S3_ENDPOINT }}
      SCW_CI_CACHE_REGION: ${{ vars.SCW_CI_CACHE_REGION }}
      NVBES_CI_PLAN: ${{ needs.scope.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: CI/CD security gate
        run: node tools/security/check-ci-cd-security.mjs --workflow .github/workflows/ci.yml
      - uses: ./.github/actions/ci-setup
        with:
          node: 'true'
          rust: 'false'
          terraform: 'false'
          caches: pnpm nx
          cache-key: ${{ secrets.SCW_CI_CACHE_ACCESS_KEY }}
          cache-secret: ${{ secrets.SCW_CI_CACHE_SECRET_KEY }}
      - name: Validate typescript
        run: node tools/ci/run-lane.mjs typescript
      - name: Publish successful protected lane caches
        if: success() && (github.event_name == 'push' && (github.ref == 'refs/heads/main') || github.event_name == 'pull_request' && needs.authorize-cache.outputs.trusted == 'true')
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SCW_CI_CACHE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SCW_CI_CACHE_SECRET_KEY }}
        run: node tools/ci/scaleway-cache-manager.mjs save pnpm nx

  rust:
    needs: [authorize-cache, scope]
    if: ${{ !cancelled() && needs.scope.result == 'success' && needs.authorize-cache.result == 'success' && needs.scope.outputs.rust-required == 'true' }}
    environment:
      name: ${{ github.event_name == 'push' && ((github.ref == 'refs/heads/main') && 'production-ci-cache' || 'branch-ci-cache') || (needs.authorize-cache.outputs.trusted == 'true' && 'branch-ci-cache' || 'ci-no-secrets') }}
      deployment: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NVBES_ENV: test
      SCW_CI_CACHE_BUCKET: ${{ vars.SCW_CI_CACHE_BUCKET }}
      SCW_CI_CACHE_S3_ENDPOINT: ${{ vars.SCW_CI_CACHE_S3_ENDPOINT }}
      SCW_CI_CACHE_REGION: ${{ vars.SCW_CI_CACHE_REGION }}
      NVBES_CI_PLAN: ${{ needs.scope.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: CI/CD security gate
        run: node tools/security/check-ci-cd-security.mjs --workflow .github/workflows/ci.yml
      - uses: ./.github/actions/ci-setup
        with:
          node: 'true'
          rust: 'true'
          coverage: 'true'
          terraform: 'false'
          caches: pnpm cargo
          cache-key: ${{ secrets.SCW_CI_CACHE_ACCESS_KEY }}
          cache-secret: ${{ secrets.SCW_CI_CACHE_SECRET_KEY }}
      - name: Start isolated security PostgreSQL
        run: node tools/ci/test-security-database.mjs
      - name: Validate rust
        run: node tools/ci/run-rust.mjs
      - name: Produce V1 workspace check receipt
        if: github.event_name == 'workflow_dispatch'
        run: node tools/test-summary/v1-suite-receipt.mjs --suite=platform.workspace-check
      - name: Upload V1 workspace check receipt
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24 LTS
        with:
          name: v1-receipt-platform.workspace-check-${{ github.sha }}
          path: .temp/v1-receipts/platform.workspace-check.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Validate rust coverage
        id: rust-coverage
        run: bash scripts/test-workspace-coverage.sh
      - name: Stop security PostgreSQL
        if: always()
        run: node tools/ci/test-security-database.mjs stop
      - name: Upload rust coverage report
        if: ${{ !cancelled() && steps.rust-coverage.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1, Node 24 LTS
        with:
          name: rust-coverage-workspace
          path: .temp/rust/coverage-workspace.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Publish successful protected lane caches
        if: success() && (github.event_name == 'push' && (github.ref == 'refs/heads/main') || github.event_name == 'pull_request' && needs.authorize-cache.outputs.trusted == 'true')
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SCW_CI_CACHE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SCW_CI_CACHE_SECRET_KEY }}
        run: node tools/ci/scaleway-cache-manager.mjs save cargo

  database:
    needs: [authorize-cache, scope]
    if: ${{ !cancelled() && needs.scope.result == 'success' && needs.authorize-cache.result == 'success' && needs.scope.outputs.database-required == 'true' }}
    environment:
      name: ${{ github.event_name == 'push' && ((github.ref == 'refs/heads/main') && 'production-ci-cache' || 'branch-ci-cache') || (needs.authorize-cache.outputs.trusted == 'true' && 'branch-ci-cache' || 'ci-no-secrets') }}
      deployment: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SCW_CI_CACHE_BUCKET: ${{ vars.SCW_CI_CACHE_BUCKET }}
      SCW_CI_CACHE_S3_ENDPOINT: ${{ vars.SCW_CI_CACHE_S3_ENDPOINT }}
      SCW_CI_CACHE_REGION: ${{ vars.SCW_CI_CACHE_REGION }}
      NVBES_CI_PLAN: ${{ needs.scope.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: CI/CD security gate
        run: node tools/security/check-ci-cd-security.mjs --workflow .github/workflows/ci.yml
      - uses: ./.github/actions/ci-setup
        with:
          node: 'true'
          rust: 'true'
          terraform: 'false'
          caches: pnpm cargo
          cache-key: ${{ secrets.SCW_CI_CACHE_ACCESS_KEY }}
          cache-secret: ${{ secrets.SCW_CI_CACHE_SECRET_KEY }}
      - name: Start isolated PostgreSQL databases
        run: node tools/ci/test-databases.mjs
      - name: Validate database
        run: node tools/ci/run-lane.mjs database
      - name: Stop PostgreSQL
        if: always()
        run: node tools/ci/test-databases.mjs stop
      - name: Publish successful protected lane caches
        if: success() && (github.event_name == 'push' && (github.ref == 'refs/heads/main') || github.event_name == 'pull_request' && needs.authorize-cache.outputs.trusted == 'true')
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SCW_CI_CACHE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SCW_CI_CACHE_SECRET_KEY }}
        run: node tools/ci/scaleway-cache-manager.mjs save pnpm cargo

  terraform:
    needs: [authorize-cache, scope]
    if: ${{ !cancelled() && needs.scope.result == 'success' && needs.authorize-cache.result == 'success' && needs.scope.outputs.terraform-required == 'true' }}
    environment:
      name: ${{ github.event_name == 'push' && ((github.ref == 'refs/heads/main') && 'production-ci-cache' || 'branch-ci-cache') || (needs.authorize-cache.outputs.trusted == 'true' && 'branch-ci-cache' || 'ci-no-secrets') }}
      deployment: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SCW_CI_CACHE_BUCKET: ${{ vars.SCW_CI_CACHE_BUCKET }}
      SCW_CI_CACHE_S3_ENDPOINT: ${{ vars.SCW_CI_CACHE_S3_ENDPOINT }}
      SCW_CI_CACHE_REGION: ${{ vars.SCW_CI_CACHE_REGION }}
      NVBES_CI_PLAN: ${{ needs.scope.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: CI/CD security gate
        run: node tools/security/check-ci-cd-security.mjs --workflow .github/workflows/ci.yml
      - uses: ./.github/actions/ci-setup
        with:
          node: 'true'
          rust: 'false'
          terraform: 'true'
          caches: pnpm terraform
          cache-key: ${{ secrets.SCW_CI_CACHE_ACCESS_KEY }}
          cache-secret: ${{ secrets.SCW_CI_CACHE_SECRET_KEY }}
      - name: Validate terraform
        run: node tools/ci/run-lane.mjs terraform
      - name: Publish successful protected lane caches
        if: success() && (github.event_name == 'push' && (github.ref == 'refs/heads/main') || github.event_name == 'pull_request' && needs.authorize-cache.outputs.trusted == 'true')
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SCW_CI_CACHE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SCW_CI_CACHE_SECRET_KEY }}
        run: node tools/ci/scaleway-cache-manager.mjs save pnpm terraform

  containers:
    needs: [authorize-cache, scope]
    if: ${{ !cancelled() && needs.scope.result == 'success' && needs.authorize-cache.result == 'success' && needs.scope.outputs.containers-required == 'true' }}
    environment:
      name: ${{ github.event_name == 'push' && ((github.ref == 'refs/heads/main') && 'production-ci-cache' || 'branch-ci-cache') || (needs.authorize-cache.outputs.trusted == 'true' && 'branch-ci-cache' || 'ci-no-secrets') }}
      deployment: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SCW_CI_CACHE_BUCKET: ${{ vars.SCW_CI_CACHE_BUCKET }}
      SCW_CI_CACHE_S3_ENDPOINT: ${{ vars.SCW_CI_CACHE_S3_ENDPOINT }}
      SCW_CI_CACHE_REGION: ${{ vars.SCW_CI_CACHE_REGION }}
      NVBES_CI_PLAN: ${{ needs.scope.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: CI/CD security gate
        run: node tools/security/check-ci-cd-security.mjs --workflow .github/workflows/ci.yml
      - uses: ./.github/actions/ci-setup
        with:
          node: 'true'
          rust: 'false'
          terraform: 'false'
          caches: pnpm nx
          cache-key: ${{ secrets.SCW_CI_CACHE_ACCESS_KEY }}
          cache-secret: ${{ secrets.SCW_CI_CACHE_SECRET_KEY }}
      - name: Validate containers
        run: node tools/ci/run-lane.mjs containers
      - name: Publish successful protected lane caches
        if: success() && (github.event_name == 'push' && (github.ref == 'refs/heads/main') || github.event_name == 'pull_request' && needs.authorize-cache.outputs.trusted == 'true')
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.SCW_CI_CACHE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SCW_CI_CACHE_SECRET_KEY }}
        run: node tools/ci/scaleway-cache-manager.mjs save pnpm nx

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Enforce Rust advisory, license, ban and source policy
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
          arguments: --all-features
      - name: Scan committed lockfiles with OSV
        uses: google/osv-scanner-action/osv-scanner-action@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
        with:
          scan-args: >-
            --format=sarif
            --output=osv-results.sarif
            --lockfile=./Cargo.lock
            --lockfile=./pnpm-lock.yaml
            --config=./.osv-scanner.toml
      - name: Upload OSV SARIF
        if: always() && hashFiles('osv-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        with:
          sarif_file: osv-results.sarif
      - name: Scan the complete Git history with Gitleaks
        run: |
          docker run --rm \
            --volume "$PWD:/repo" \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect \
            --source=/repo \
            --log-opts=--all \
            --redact
      - name: Scan filesystem, secrets and infrastructure configuration with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          skip-dirs: node_modules,target,.nx,.pnpm-store,.temp,infrastructure/local/observability/app-logs

  ci-gate:
    name: ci-gate
    if: ${{ always() }}
    needs: [authorize-cache, scope, contracts, typescript, rust, database, terraform, containers, security]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require every planned lane to succeed
        env:
          NVBES_CI_NEEDS: ${{ toJSON(needs) }}
        run: node tools/ci/ci-gate.mjs

