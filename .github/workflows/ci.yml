name: ci

on:
  push:
    branches: ['main']
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  bootstrap-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install xmlsec system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxmlsec1-dev libxmlsec1-openssl xmlsec1
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 25
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.1.3 --activate
      - uses: opentofu/setup-opentofu@v1
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm
      - name: Install frontend dependencies
        run: pnpm install
      - name: Set Nx SHAs
        uses: nrwl/nx-set-shas@v4
      - name: Format check
        run: pnpm format:check
      - name: Structure check
        run: pnpm check:structure
      - name: Lint
        run: pnpm exec nx affected -t lint
      - name: Type and compile checks
        run: pnpm exec nx affected -t check
      - name: Unit tests
        run: pnpm exec nx affected -t test
      - name: Integration tests
        run: pnpm test:integration
      - name: Build web release artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: nvbes
          SENTRY_PROJECT_DRIVE_WEB: drive-web
          SENTRY_PROJECT_IDENTITY_WEB: identity-web
          SENTRY_RELEASE: ${{ github.sha }}
          VITE_SENTRY_RELEASE: ${{ github.sha }}
          VITE_SENTRY_ENVIRONMENT: production
        run: pnpm build:web
