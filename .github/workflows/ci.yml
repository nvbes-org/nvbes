name: continuous integration

on:
  push:
    branches: ['main', 'staging', 'dev']
  pull_request:
    branches: ['main', 'staging', 'dev']
  workflow_dispatch:

concurrency:
  group: continuous-integration-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  email-quality:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 90
    env:
      CI: 'true'
      CARGO_INCREMENTAL: '0'
      RUSTFLAGS: '-C debuginfo=0'
      NVBES_ENV: ci
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: nvbes_email_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d nvbes_email_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Export email test database URL
        run: |
          database_url="postgres://postgres:postgres@host.docker.internal:${{ job.services.postgres.ports[5432] }}/nvbes_email_test"
          printf '%s\n' "DATABASE_URL=${database_url}" >> "${GITHUB_ENV}"
      - name: CI/CD security gate
        run: |
          node tools/security/check-ci-cd-security.mjs --workflow .github/workflows/ci.yml
          node --test tools/ci/continuous-integration-contract.test.mjs
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.91.1
          components: rustfmt, clippy
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.18.0 --activate
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Enforce FinOps contract
        run: pnpm check:finops
      - name: Validate active workspace
        run: |
          pnpm format:check
          pnpm check:structure
          pnpm check:nx-boundaries
          pnpm check:secrets
          pnpm check:web
          pnpm check:api
      - name: Validate email deployment contract
        run: pnpm test:pre-deploy
      - name: Initialize isolated email Terraform providers
        run: >-
          terraform -chdir=infrastructure/environments/email-production init
          -backend=false
          -input=false
      - name: Validate isolated email Terraform stack
        run: terraform -chdir=infrastructure/environments/email-production validate
      - name: Initialize email stack Terraform providers
        run: >-
          terraform -chdir=infrastructure/stacks/email/production init
          -backend=false
          -input=false
      - name: Validate email Terraform stack
        run: terraform -chdir=infrastructure/stacks/email/production validate
      - name: Test email Terraform deployment and rotation
        run: >-
          PATH="$PWD/infrastructure/stacks/email/production/tests/bin:$PATH"
          terraform -chdir=infrastructure/stacks/email/production test
      - name: Test email contract and runtime
        run: pnpm test
      - name: Test email database invariants
        run: bash scripts/test-email-worker-database.sh
      - name: Validate email container contract
        run: node --test apps/email-worker/tests/container-contract.test.mjs
