name: ci

on:
  push:
    branches: ['main']
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  bootstrap-check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      NX_DAEMON: false
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install xmlsec system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxmlsec1-dev libxmlsec1-openssl xmlsec1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.1.3 --activate
      - uses: opentofu/setup-opentofu@v1
      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Restore Nx cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('nx.json', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', 'tsconfig.base.json', 'vite.config.ts') }}
          restore-keys: |
            nx-${{ runner.os }}-
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Install Backoffice Playwright browser
        run: pnpm --dir apps/backoffice-web exec playwright install --with-deps chromium
      - name: Set Nx SHAs
        uses: nrwl/nx-set-shas@v4
      - name: Format check
        run: pnpm format:check
      - name: Structure check
        run: pnpm check:structure
      - name: Nx boundaries
        run: pnpm check:nx-boundaries
      - name: Rust workspace check
        run: pnpm exec nx run rust-workspace:check
      - name: Backoffice targeted check
        run: pnpm check:backoffice-service
      - name: Lint
        run: pnpm exec nx affected -t lint
      - name: Typecheck
        run: pnpm exec nx affected -t typecheck
      - name: Unit tests
        run: pnpm exec nx affected -t test
      - name: Integration tests
        run: pnpm test:integration
      - name: Build web release artifacts
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: nvbes
          SENTRY_PROJECT_CLOUD_WEB: cloud-web
          SENTRY_PROJECT_ACCOUNT_WEB: account-web
          SENTRY_RELEASE: ${{ github.sha }}
          VITE_SENTRY_RELEASE: ${{ github.sha }}
          VITE_SENTRY_ENVIRONMENT: production
        run: pnpm build:web
