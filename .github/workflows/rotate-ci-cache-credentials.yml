name: rotate CI cache credentials

on:
  workflow_dispatch:
    inputs:
      runner:
        description: Use GitHub-hosted by default; select local only when it is required as a fallback.
        required: false
        default: github-hosted
        type: choice
        options: [github-hosted, local]
      repair_bucket_policy:
        description: Repair the Terraform refresh permissions before the normal plan
        required: false
        type: boolean
        default: false
      reconcile_state_access:
        description: Reconcile the declared production Terraform state bucket policy
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '17 4 * * 1'

concurrency:
  group: rotate-production-ci-cache-credentials
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  rotate:
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ inputs.runner == 'local' && fromJSON('["self-hosted","macOS","ARM64"]') || 'ubuntu-latest' }}
    timeout-minutes: 20
    environment:
      name: production-bootstrap
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.BOOTSTRAP_TERRAFORM_STATE_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BOOTSTRAP_TERRAFORM_STATE_SECRET_KEY }}
      BOOTSTRAP_TERRAFORM_STATE_KEY: production/bootstrap/terraform.tfstate
      GITHUB_TOKEN: ${{ secrets.CI_CACHE_GITHUB_TOKEN }}
      SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
      SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
      TF_VAR_ci_cache_bucket_name: ${{ vars.SCW_CI_CACHE_BUCKET_NAME }}
      TF_VAR_scaleway_organization_id: ${{ vars.SCW_ORGANIZATION_ID }}
      TF_VAR_scaleway_project_id: ${{ vars.SCW_PROJECT_ID }}
      TF_VAR_terraform_state_bucket: ${{ vars.TERRAFORM_STATE_BUCKET }}
      TERRAFORM_STATE_BUCKET: ${{ vars.TERRAFORM_STATE_BUCKET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: CI/CD security gate
        run: >-
          node tools/security/check-ci-cd-security.mjs
          --workflow .github/workflows/rotate-ci-cache-credentials.yml
      - name: Verify protected rotation context
        run: |
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$BOOTSTRAP_TERRAFORM_STATE_KEY" == "production/bootstrap/terraform.tfstate" ]]
          [[ -n "$TERRAFORM_STATE_BUCKET" ]]
          [[ -n "$TF_VAR_ci_cache_bucket_name" ]]
          [[ -n "$TF_VAR_scaleway_organization_id" ]]
          [[ -n "$TF_VAR_scaleway_project_id" ]]
          [[ -n "$TF_VAR_terraform_state_bucket" ]]
          [[ '${{ inputs.reconcile_state_access }}' != 'true' || '${{ inputs.repair_bucket_policy }}' != 'true' ]]
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - name: Initialize protected bootstrap state
        run: >-
          terraform -chdir=infrastructure/bootstrap/production init
          -reconfigure
          -backend-config=backend.ci.hcl
          -backend-config="bucket=$TERRAFORM_STATE_BUCKET"
          -backend-config="key=$BOOTSTRAP_TERRAFORM_STATE_KEY"
      - name: Plan declared state access
        if: inputs.reconcile_state_access == true
        run: >-
          terraform -chdir=infrastructure/bootstrap/production plan
          -refresh=false
          -lock-timeout=5m
          -target=module.terraform_state.scaleway_object_bucket_policy.terraform_state
          -out=state-access.tfplan
      - name: Apply declared state access
        if: inputs.reconcile_state_access == true
        run: >-
          terraform -chdir=infrastructure/bootstrap/production apply
          -lock-timeout=5m
          state-access.tfplan
      - name: Plan bounded cache bucket policy repair
        if: inputs.repair_bucket_policy == true
        run: >-
          terraform -chdir=infrastructure/bootstrap/production plan
          -refresh=false
          -lock-timeout=5m
          -target=module.ci_cache.scaleway_object_bucket_policy.ci_cache
          -out=ci-cache-policy-repair.tfplan
      - name: Apply bounded cache bucket policy repair
        if: inputs.repair_bucket_policy == true
        run: >-
          terraform -chdir=infrastructure/bootstrap/production apply
          -lock-timeout=5m
          ci-cache-policy-repair.tfplan
      - name: Plan isolated cache provisioning and rotation
        if: inputs.reconcile_state_access != true
        run: >-
          terraform -chdir=infrastructure/bootstrap/production plan
          -lock-timeout=5m
          -target=module.ci_cache
          -out=ci-cache-rotation.tfplan
      - name: Apply reviewed cache rotation plan
        if: inputs.reconcile_state_access != true
        run: >-
          terraform -chdir=infrastructure/bootstrap/production apply
          -lock-timeout=5m
          ci-cache-rotation.tfplan
