          build-args: SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: |
            type=registry,ref=${{ env.CI_CACHE_REGISTRY }}/rust-builder:rust-1.91.1-linux-amd64
            type=registry,ref=${{ env.CI_CACHE_REGISTRY }}/trust-risk-service:buildcache
          cache-to: |
            type=registry,ref=${{ env.CI_CACHE_REGISTRY }}/rust-builder:rust-1.91.1-linux-amd64,mode=max,compression=zstd,oci-mediatypes=true,image-manifest=true
            type=registry,ref=${{ env.CI_CACHE_REGISTRY }}/trust-risk-service:buildcache,mode=max,compression=zstd,oci-mediatypes=true,image-manifest=true
      - name: Block vulnerable release images
        if: env.REUSED_SOURCE_IMAGE_DIGEST == ''
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Sign container image
        if: env.REUSED_SOURCE_IMAGE_DIGEST == ''
        run: cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${{ steps.build.outputs.digest }}"
      - name: Verify reusable signed image
        if: env.REUSED_SOURCE_IMAGE_DIGEST != ''
        run: |
          [[ "$REUSED_SOURCE_IMAGE_DIGEST" =~ ^ghcr\.io/nvbes-org/nvbes-trust-risk-service@sha256:[0-9a-f]{64}$ ]]
          [[ "$SOURCE_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/deploy.yml@refs/heads/main"
          cosign verify "$REUSED_SOURCE_IMAGE_DIGEST" \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

  deploy-trust-risk:
    needs: [ci-provenance, build-scan-sign-trust-risk]
    if: ${{ success() && github.ref == 'refs/heads/main' && (inputs.service == 'all' || inputs.service == 'trust-risk' || !inputs.service) }}
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 90
    environment:
      name: production-trust-risk
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
    env:
      SCW_DEFAULT_ORGANIZATION_ID: ${{ vars.SCW_ORGANIZATION_ID }}
      SCW_DEFAULT_PROJECT_ID: ${{ vars.SCW_PROJECT_ID }}
      SCW_DEFAULT_REGION: fr-par
      SCW_DEFAULT_ZONE: fr-par-1
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
      TF_VAR_private_network_id: ${{ vars.SCW_PRIVATE_NETWORK_ID }}
      TF_VAR_grafana_otlp_authorization_header: ${{ secrets.GRAFANA_OTLP_AUTHORIZATION_HEADER }}
      TF_VAR_grafana_otlp_endpoint: ${{ vars.GRAFANA_OTLP_ENDPOINT }}
      TF_VAR_grafana_prometheus_datasource_uid: ${{ vars.GRAFANA_PROMETHEUS_DATASOURCE_UID }}
      TF_VAR_grafana_service_account_token: ${{ secrets.GRAFANA_SERVICE_ACCOUNT_TOKEN }}
      TF_VAR_grafana_tempo_datasource_uid: ${{ vars.GRAFANA_TEMPO_DATASOURCE_UID }}
      TF_VAR_grafana_trust_risk_contact_point: ${{ vars.GRAFANA_TRUST_RISK_CONTACT_POINT }}
      TF_VAR_grafana_url: ${{ vars.GRAFANA_URL }}
      TF_VAR_scaleway_organization_id: ${{ vars.SCW_ORGANIZATION_ID }}
      TF_VAR_scaleway_project_id: ${{ vars.SCW_PROJECT_ID }}
      TF_VAR_trust_risk_metrics_token: ${{ secrets.TRUST_RISK_METRICS_TOKEN }}
      TF_VAR_trust_risk_operator_tokens: ${{ secrets.TRUST_RISK_OPERATOR_TOKENS }}
      TF_VAR_trust_risk_producer_policies: ${{ secrets.TRUST_RISK_PRODUCER_POLICIES }}
      TF_VAR_trust_risk_sentry_dsn: ${{ secrets.TRUST_RISK_SENTRY_DSN }}
      TERRAFORM_STATE_BUCKET: ${{ vars.TERRAFORM_STATE_BUCKET }}
      TRUST_RISK_TERRAFORM_STATE_KEY: production/trust-risk/terraform.tfstate
      TRUST_RISK_REGISTRY_ENDPOINT: rg.fr-par.scw.cloud/nvbes-prod-trust-risk
      STACK_ROOT: infrastructure/environments/trust-risk-production
      REUSED_SOURCE_IMAGE_DIGEST: ${{ vars.TRUST_RISK_REUSE_SOURCE_IMAGE_DIGEST }}
      SOURCE_COMMIT_SHA: ${{ vars.TRUST_RISK_REUSE_SOURCE_COMMIT_SHA }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: CI/CD security gate
        run: >-
          node tools/security/check-ci-cd-security.mjs
          --workflow .github/workflows/deploy.yml
      - name: Verify protected production candidate
        if: github.ref == 'refs/heads/main'
        run: |
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$SCW_DEFAULT_ORGANIZATION_ID" == "0b726673-849d-4d03-b014-fd39c41942b9" ]]
          [[ "$SCW_DEFAULT_PROJECT_ID" == "e5e54340-62c8-4bd5-af4d-d3d5ea2c8706" ]]
          [[ -n "$TERRAFORM_STATE_BUCKET" ]]
          if [[ -n "$REUSED_SOURCE_IMAGE_DIGEST" || -n "$SOURCE_COMMIT_SHA" ]]; then
            [[ "$REUSED_SOURCE_IMAGE_DIGEST" =~ ^ghcr\.io/nvbes-org/nvbes-trust-risk-service@sha256:[0-9a-f]{64}$ ]]
            [[ "$SOURCE_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
            git cat-file -e "${SOURCE_COMMIT_SHA}^{commit}"
            git diff --quiet "$SOURCE_COMMIT_SHA" "$GITHUB_SHA" -- \
              Cargo.toml Cargo.lock \
              apps/trust-risk-service/Cargo.toml \
              apps/trust-risk-service/Dockerfile \
              apps/trust-risk-service/migrations \
              apps/trust-risk-service/src \
              contracts/protobuf/nvbes/trust_risk \
              libs/rust
          fi
      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: >-
          printf '%s' "$GHCR_TOKEN" |
          docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Resolve immutable Trust/Risk image
        env:
          IMAGE_TAG: ghcr.io/nvbes-org/nvbes-trust-risk-service:${{ github.sha }}
        run: |
          if [[ -n "$REUSED_SOURCE_IMAGE_DIGEST" ]]; then
            source_image="$REUSED_SOURCE_IMAGE_DIGEST"
            digest="${source_image##*@}"
          else
            digest="$(docker buildx imagetools inspect "$IMAGE_TAG" --format '{{.Manifest.Digest}}')"
            source_image="ghcr.io/nvbes-org/nvbes-trust-risk-service@${digest}"
          fi
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "SOURCE_TRUST_RISK_IMAGE_DIGEST=${source_image}" >> "$GITHUB_ENV"
          echo "TF_VAR_trust_risk_image=${TRUST_RISK_REGISTRY_ENDPOINT}/nvbes-trust-risk-service@${digest}" >> "$GITHUB_ENV"
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Verify signed release identity
        run: |
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/deploy.yml@refs/heads/main"
          cosign verify "$SOURCE_TRUST_RISK_IMAGE_DIGEST" \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - name: Initialize isolated Trust/Risk state
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TRUST_RISK_TERRAFORM_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TRUST_RISK_TERRAFORM_STATE_SECRET_KEY }}
        run: >-
          terraform -chdir="$STACK_ROOT" init
          -reconfigure
          -backend-config=backend.ci.hcl
          -backend-config="bucket=$TERRAFORM_STATE_BUCKET"
          -backend-config="key=$TRUST_RISK_TERRAFORM_STATE_KEY"
      - name: Plan private image registry
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TRUST_RISK_TERRAFORM_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TRUST_RISK_TERRAFORM_STATE_SECRET_KEY }}
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        run: >-
          terraform -chdir="$STACK_ROOT" plan -lock-timeout=5m
          -target=scaleway_registry_namespace.trust_risk
          -out=trust-risk-registry.tfplan
      - name: Apply reviewed private registry plan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TRUST_RISK_TERRAFORM_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TRUST_RISK_TERRAFORM_STATE_SECRET_KEY }}
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        run: terraform -chdir="$STACK_ROOT" apply -lock-timeout=5m trust-risk-registry.tfplan
      - name: Mirror verified image into private Scaleway registry
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TRUST_RISK_TERRAFORM_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TRUST_RISK_TERRAFORM_STATE_SECRET_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        run: |
          endpoint="$(terraform -chdir="$STACK_ROOT" output -raw trust_risk_registry_endpoint)"
          [[ "$endpoint" == "$TRUST_RISK_REGISTRY_ENDPOINT" ]]
          printf '%s' "$SCW_SECRET_KEY" | docker login "$endpoint" --username nologin --password-stdin
          destination="${endpoint}/nvbes-trust-risk-service:${GITHUB_SHA}"
          docker pull --platform linux/amd64 "$SOURCE_TRUST_RISK_IMAGE_DIGEST"
          docker tag "$SOURCE_TRUST_RISK_IMAGE_DIGEST" "$destination"
          docker push "$destination"
          digest="$(docker buildx imagetools inspect "$destination" --format '{{.Manifest.Digest}}')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "TRUST_RISK_IMAGE_DIGEST=${endpoint}/nvbes-trust-risk-service@${digest}" >> "$GITHUB_ENV"
          echo "TF_VAR_trust_risk_image=${endpoint}/nvbes-trust-risk-service@${digest}" >> "$GITHUB_ENV"
      - name: Sign and verify private deployment image
        run: |
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/deploy.yml@refs/heads/main"
          cosign sign --yes "$TRUST_RISK_IMAGE_DIGEST"
          cosign verify "$TRUST_RISK_IMAGE_DIGEST" \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Plan migration foundation
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TRUST_RISK_TERRAFORM_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TRUST_RISK_TERRAFORM_STATE_SECRET_KEY }}
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        run: >-
          terraform -chdir="$STACK_ROOT" plan -lock-timeout=5m
          -target=scaleway_job_definition.trust_risk_database_migration
          -target=scaleway_iam_api_key.trust_risk_database_runtime
          -target=scaleway_iam_policy.trust_risk_database_runtime
          -out=trust-risk-migration.tfplan
      - name: Apply reviewed migration foundation plan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TRUST_RISK_TERRAFORM_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TRUST_RISK_TERRAFORM_STATE_SECRET_KEY }}
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        run: terraform -chdir="$STACK_ROOT" apply -lock-timeout=5m trust-risk-migration.tfplan
      - name: Run database migrations
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TRUST_RISK_TERRAFORM_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TRUST_RISK_TERRAFORM_STATE_SECRET_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        run: |
          ref="$(terraform -chdir="$STACK_ROOT" output -raw trust_risk_database_migration_job_id)"
          job_id="${ref##*/}"
          response="$(curl --fail-with-body --silent --show-error --request POST \
            --header "X-Auth-Token: $SCW_SECRET_KEY" --header 'Content-Type: application/json' \
            --data '{}' "https://api.scaleway.com/serverless-jobs/v1alpha2/regions/fr-par/job-definitions/${job_id}/start")"
          run_id="$(jq -er '.job_runs[0].id' <<<"$response")"
          state=queued
          for _attempt in {1..60}; do
            response="$(curl --fail-with-body --silent --show-error \
              --header "X-Auth-Token: $SCW_SECRET_KEY" \
              "https://api.scaleway.com/serverless-jobs/v1alpha2/regions/fr-par/job-runs/${run_id}")"
            state="$(jq -er '.state' <<<"$response")"
            case "$state" in
              succeeded) break ;;
              failed|canceled|interrupted) exit 1 ;;
            esac
            sleep 10
          done
          [[ "$state" == "succeeded" ]]
      - name: Plan Trust/Risk runtime
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TRUST_RISK_TERRAFORM_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TRUST_RISK_TERRAFORM_STATE_SECRET_KEY }}
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        run: terraform -chdir="$STACK_ROOT" plan -lock-timeout=5m -out=trust-risk-runtime.tfplan
      - name: Validate production runtime configuration
        env:
          NVBES_OTLP_AUTHORIZATION_HEADER: ${{ secrets.GRAFANA_OTLP_AUTHORIZATION_HEADER }}
          NVBES_OTLP_ENDPOINT: ${{ vars.GRAFANA_OTLP_ENDPOINT }}
          NVBES_TRUST_RISK_METRICS_TOKEN: ${{ secrets.TRUST_RISK_METRICS_TOKEN }}
          NVBES_TRUST_RISK_OPERATOR_TOKENS: ${{ secrets.TRUST_RISK_OPERATOR_TOKENS }}
          NVBES_TRUST_RISK_PRODUCER_POLICIES: ${{ secrets.TRUST_RISK_PRODUCER_POLICIES }}
          SENTRY_DSN: ${{ secrets.TRUST_RISK_SENTRY_DSN }}
          SENTRY_RELEASE: ${{ github.sha }}
          SENTRY_TRACES_SAMPLE_RATE: "0.1"
        run: |
          export NVBES_TRUST_RISK_DATABASE_URL
          NVBES_TRUST_RISK_DATABASE_URL="$(terraform -chdir="$STACK_ROOT" show -json trust-risk-runtime.tfplan | jq -er '.planned_values.outputs.trust_risk_database_runtime_url.value')"
          docker run --rm --platform linux/amd64 \
            --env NVBES_TRUST_RISK_DATABASE_URL \
            --env NVBES_TRUST_RISK_METRICS_TOKEN \
            --env NVBES_TRUST_RISK_OPERATOR_TOKENS \
            --env NVBES_TRUST_RISK_PRODUCER_POLICIES \
            --env NVBES_ENVIRONMENT=production \
            --env NVBES_TRUST_RISK_BIND_ADDR=0.0.0.0:8080 \
            --env NVBES_TRUST_RISK_SIGNALS_RETENTION_DAYS=30 \
            --env NVBES_TRUST_RISK_EVALUATIONS_RETENTION_DAYS=400 \
            --env NVBES_TRUST_RISK_LABELS_RETENTION_DAYS=400 \
            --env NVBES_TRUST_RISK_REVIEWS_RETENTION_DAYS=400 \
            --env NVBES_TRUST_RISK_AUDIT_RETENTION_DAYS=730 \
            --env NVBES_OTLP_AUTHORIZATION_HEADER \
            --env NVBES_OTLP_ENDPOINT \
            --env SENTRY_DSN \
            --env SENTRY_RELEASE \
            --env SENTRY_TRACES_SAMPLE_RATE \
            "$SOURCE_TRUST_RISK_IMAGE_DIGEST" validate-runtime
          docker run --rm --platform linux/amd64 \
            --env NVBES_TRUST_RISK_DATABASE_URL \
            --env NVBES_TRUST_RISK_METRICS_TOKEN \
            --env NVBES_TRUST_RISK_OPERATOR_TOKENS \
            --env NVBES_TRUST_RISK_PRODUCER_POLICIES \
            --env NVBES_ENVIRONMENT=production \
            --env NVBES_TRUST_RISK_BIND_ADDR=0.0.0.0:8080 \
            --env NVBES_TRUST_RISK_SIGNALS_RETENTION_DAYS=30 \
            --env NVBES_TRUST_RISK_EVALUATIONS_RETENTION_DAYS=400 \
            --env NVBES_TRUST_RISK_LABELS_RETENTION_DAYS=400 \
            --env NVBES_TRUST_RISK_REVIEWS_RETENTION_DAYS=400 \
            --env NVBES_TRUST_RISK_AUDIT_RETENTION_DAYS=730 \
            --env NVBES_OTLP_AUTHORIZATION_HEADER \
            --env NVBES_OTLP_ENDPOINT \
            --env SENTRY_DSN \
            --env SENTRY_RELEASE \
            --env SENTRY_TRACES_SAMPLE_RATE \
            "$SOURCE_TRUST_RISK_IMAGE_DIGEST" error-reporting-smoke | jq -e '.configured == true'
      - name: Apply reviewed Trust/Risk runtime plan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TRUST_RISK_TERRAFORM_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TRUST_RISK_TERRAFORM_STATE_SECRET_KEY }}
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        run: terraform -chdir="$STACK_ROOT" apply -lock-timeout=5m trust-risk-runtime.tfplan
      - name: Verify public Trust/Risk health and readiness
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TRUST_RISK_TERRAFORM_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TRUST_RISK_TERRAFORM_STATE_SECRET_KEY }}
        run: |
          endpoint="$(terraform -chdir="$STACK_ROOT" output -raw trust_risk_endpoint)"
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 "${endpoint}/health/live"
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 "${endpoint}/health/ready"
