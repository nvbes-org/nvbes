name: deploy

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Service to deploy"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - api
          - worker
      runner:
        description: "GitHub-hosted by default; optional local self-hosted runner"
        required: false
        default: github-hosted
        type: choice
        options:
          - github-hosted
          - local

concurrency:
  group: deploy-production-${{ inputs.service || 'all' }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  ci-provenance:
    runs-on: ${{ inputs.runner == 'local' && fromJSON('["self-hosted","Linux","ARM64","docker"]') || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: CI/CD security gate
        run: node tools/security/check-ci-cd-security.mjs --workflow .github/workflows/deploy.yml
      - name: Verify exact continuous integration provenance
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/ci/verify-ci-provenance.mjs

  build-scan-sign-api:
    needs: [ci-provenance]
    runs-on: ${{ inputs.runner == 'local' && fromJSON('["self-hosted","Linux","ARM64","docker"]') || 'ubuntu-latest' }}
    if: ${{ success() && (inputs.service == 'all' || inputs.service == 'api' || !inputs.service) }}
    timeout-minutes: 60
    environment:
      name: production-ci-cache
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: write
      security-events: write
      attestations: write
    env:
      CI_CACHE_REGISTRY: ${{ vars.SCW_CI_CACHE_REGISTRY_ENDPOINT }}
      REGISTRY: ghcr.io
      IMAGE_NAME: nvbes-org/nvbes-api
      REUSED_SOURCE_IMAGE_DIGEST: ${{ vars.API_REUSE_SOURCE_IMAGE_DIGEST }}
      SOURCE_COMMIT_SHA: ${{ vars.API_REUSE_SOURCE_COMMIT_SHA }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: CI/CD security gate
        run: node tools/security/check-ci-cd-security.mjs --workflow .github/workflows/deploy.yml
      - name: Set deterministic build metadata
        if: env.REUSED_SOURCE_IMAGE_DIGEST == ''
        run: |
          echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"
          echo "LC_ALL=C" >> "$GITHUB_ENV"
          echo "TZ=UTC" >> "$GITHUB_ENV"
      - name: Authenticate to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Authenticate to Scaleway CI cache
        if: env.REUSED_SOURCE_IMAGE_DIGEST == ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.CI_CACHE_REGISTRY }}
          username: nologin
          password: ${{ secrets.SCW_CI_CACHE_SECRET_KEY }}
      - name: Set up Buildx
        if: env.REUSED_SOURCE_IMAGE_DIGEST == ''
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build and push immutable image
        if: env.REUSED_SOURCE_IMAGE_DIGEST == ''
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          build-args: SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: |
            type=registry,ref=${{ env.CI_CACHE_REGISTRY }}/rust-builder:rust-1.98.1-linux-amd64
            type=registry,ref=${{ env.CI_CACHE_REGISTRY }}/api:buildcache
          cache-to: |
            type=registry,ref=${{ env.CI_CACHE_REGISTRY }}/rust-builder:rust-1.98.1-linux-amd64,mode=max,compression=zstd,oci-mediatypes=true,image-manifest=true
            type=registry,ref=${{ env.CI_CACHE_REGISTRY }}/api:buildcache,mode=max,compression=zstd,oci-mediatypes=true,image-manifest=true
      - name: Block vulnerable release images
        if: env.REUSED_SOURCE_IMAGE_DIGEST == ''
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
      - name: Attest container build provenance
        if: env.REUSED_SOURCE_IMAGE_DIGEST == ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign container image
        if: env.REUSED_SOURCE_IMAGE_DIGEST == ''
        run: cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${{ steps.build.outputs.digest }}"
      - name: Verify reusable signed image
        if: env.REUSED_SOURCE_IMAGE_DIGEST != ''
        run: |
          [[ "$REUSED_SOURCE_IMAGE_DIGEST" =~ ^ghcr\.io/nvbes-org/nvbes-api@sha256:[0-9a-f]{64}$ ]]
          [[ "$SOURCE_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/deploy.yml@refs/heads/main"
          cosign verify "$REUSED_SOURCE_IMAGE_DIGEST" \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

  deploy-api:
    needs: [ci-provenance, build-scan-sign-api]
    if: ${{ success() && github.ref == 'refs/heads/main' && (inputs.service == 'all' || inputs.service == 'api' || !inputs.service) }}
    runs-on: ${{ inputs.runner == 'local' && fromJSON('["self-hosted","Linux","ARM64","docker"]') || 'ubuntu-latest' }}
    timeout-minutes: 90
    environment:
      name: production-api
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
    env:
      SCW_DEFAULT_ORGANIZATION_ID: ${{ vars.SCW_ORGANIZATION_ID }}
      SCW_DEFAULT_PROJECT_ID: ${{ vars.SCW_PROJECT_ID }}
      SCW_DEFAULT_REGION: fr-par
      SCW_DEFAULT_ZONE: fr-par-1
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
      TF_VAR_private_network_id: ${{ vars.SCW_PRIVATE_NETWORK_ID }}
      TF_VAR_grafana_otlp_authorization_header: ${{ secrets.GRAFANA_OTLP_AUTHORIZATION_HEADER }}
      TF_VAR_grafana_otlp_endpoint: ${{ vars.GRAFANA_OTLP_ENDPOINT }}
      TF_VAR_scaleway_organization_id: ${{ vars.SCW_ORGANIZATION_ID }}
      TF_VAR_scaleway_project_id: ${{ vars.SCW_PROJECT_ID }}
      TF_VAR_api_sentry_dsn: ${{ secrets.API_SENTRY_DSN }}
      TF_VAR_api_sentry_traces_sample_rate: ${{ vars.API_SENTRY_TRACES_SAMPLE_RATE }}
      TERRAFORM_STATE_BUCKET: ${{ vars.TERRAFORM_STATE_BUCKET }}
      API_TERRAFORM_STATE_KEY: production/api/terraform.tfstate
      API_REGISTRY_ENDPOINT: rg.fr-par.scw.cloud/nvbes-prod-api
      STACK_ROOT: infrastructure/environments/api-production
      REUSED_SOURCE_IMAGE_DIGEST: ${{ vars.API_REUSE_SOURCE_IMAGE_DIGEST }}
      SOURCE_COMMIT_SHA: ${{ vars.API_REUSE_SOURCE_COMMIT_SHA }}
      API_DEPLOY_APPROVED_SHA: ${{ vars.API_DEPLOY_APPROVED_SHA }}
      API_DEPLOY_CONFIRMATION: ${{ vars.API_DEPLOY_CONFIRMATION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: CI/CD security gate
        run: node tools/security/check-ci-cd-security.mjs --workflow .github/workflows/deploy.yml
      - name: Verify protected production candidate
        if: github.ref == 'refs/heads/main'
        run: |
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$API_DEPLOY_CONFIRMATION" == "deploy-api-production" ]]
          [[ "$API_DEPLOY_APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$API_DEPLOY_APPROVED_SHA" == "$GITHUB_SHA" ]]
          [[ -n "$TERRAFORM_STATE_BUCKET" ]]
      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
      - name: Resolve verified deployment digest
        run: |
          if [[ -n "$REUSED_SOURCE_IMAGE_DIGEST" ]]; then
            source_image="$REUSED_SOURCE_IMAGE_DIGEST"
            digest="${source_image##*@}"
          else
            source_image="ghcr.io/nvbes-org/nvbes-api:${GITHUB_SHA}"
            digest="$(docker buildx imagetools inspect "$source_image" --format '{{.Manifest.Digest}}')"
            source_image="ghcr.io/nvbes-org/nvbes-api@${digest}"
          fi
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "SOURCE_API_IMAGE_DIGEST=${source_image}" >> "$GITHUB_ENV"
          echo "TF_VAR_api_image=${API_REGISTRY_ENDPOINT}/nvbes-api@${digest}" >> "$GITHUB_ENV"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verify signed release identity
        run: |
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/deploy.yml@refs/heads/main"
          cosign verify "$SOURCE_API_IMAGE_DIGEST" \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - name: Initialize isolated API state
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.API_TERRAFORM_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.API_TERRAFORM_STATE_SECRET_KEY }}
        run: >-
          terraform -chdir="$STACK_ROOT" init
          -reconfigure
          -backend-config=backend.ci.hcl
          -backend-config="bucket=$TERRAFORM_STATE_BUCKET"
          -backend-config="key=$API_TERRAFORM_STATE_KEY"
      - name: Plan private image registry
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.API_TERRAFORM_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.API_TERRAFORM_STATE_SECRET_KEY }}
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        run: >-
          terraform -chdir="$STACK_ROOT" plan -lock-timeout=5m
          -target=scaleway_registry_namespace.api
          -out=api-registry.tfplan
      - name: Apply reviewed private registry plan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.API_TERRAFORM_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.API_TERRAFORM_STATE_SECRET_KEY }}
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        run: terraform -chdir="$STACK_ROOT" apply -lock-timeout=5m api-registry.tfplan
      - name: Mirror verified image into private Scaleway registry
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.API_TERRAFORM_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.API_TERRAFORM_STATE_SECRET_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        run: |
          endpoint="$(terraform -chdir="$STACK_ROOT" output -raw api_registry_endpoint)"
          [[ "$endpoint" == "$API_REGISTRY_ENDPOINT" ]]
          printf '%s' "$SCW_SECRET_KEY" | docker login "$endpoint" --username nologin --password-stdin
          destination="${endpoint}/nvbes-api:${GITHUB_SHA}"
          docker pull --platform linux/amd64 "$SOURCE_API_IMAGE_DIGEST"
          docker tag "$SOURCE_API_IMAGE_DIGEST" "$destination"
          docker push "$destination"
          digest="$(docker buildx imagetools inspect "$destination" --format '{{.Manifest.Digest}}')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "API_IMAGE_DIGEST=${endpoint}/nvbes-api@${digest}" >> "$GITHUB_ENV"
          echo "TF_VAR_api_image=${endpoint}/nvbes-api@${digest}" >> "$GITHUB_ENV"
      - name: Sign and verify private deployment image
        run: |
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/deploy.yml@refs/heads/main"
          cosign sign --yes "$API_IMAGE_DIGEST"
          cosign verify "$API_IMAGE_DIGEST" \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Plan API runtime
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.API_TERRAFORM_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.API_TERRAFORM_STATE_SECRET_KEY }}
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        run: terraform -chdir="$STACK_ROOT" plan -lock-timeout=5m -out=api-runtime.tfplan
      - name: Apply reviewed API runtime plan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.API_TERRAFORM_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.API_TERRAFORM_STATE_SECRET_KEY }}
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        run: terraform -chdir="$STACK_ROOT" apply -lock-timeout=5m api-runtime.tfplan
      - name: Verify public API health and readiness
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.API_TERRAFORM_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.API_TERRAFORM_STATE_SECRET_KEY }}
        run: |
          endpoint="$(terraform -chdir="$STACK_ROOT" output -raw api_endpoint)"
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 "${endpoint}/health/live"
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 "${endpoint}/health/ready"

  build-scan-sign-worker:
    needs: [ci-provenance]
    runs-on: ${{ inputs.runner == 'local' && fromJSON('["self-hosted","Linux","ARM64","docker"]') || 'ubuntu-latest' }}
    if: ${{ success() && (inputs.service == 'all' || inputs.service == 'worker' || !inputs.service) }}
    timeout-minutes: 60
    environment:
      name: production-ci-cache
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: write
      security-events: write
      attestations: write
    env:
      CI_CACHE_REGISTRY: ${{ vars.SCW_CI_CACHE_REGISTRY_ENDPOINT }}
      REGISTRY: ghcr.io
      IMAGE_NAME: nvbes-org/nvbes-worker
      REUSED_SOURCE_IMAGE_DIGEST: ${{ vars.WORKER_REUSE_SOURCE_IMAGE_DIGEST }}
      SOURCE_COMMIT_SHA: ${{ vars.WORKER_REUSE_SOURCE_COMMIT_SHA }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: CI/CD security gate
        run: node tools/security/check-ci-cd-security.mjs --workflow .github/workflows/deploy.yml
      - name: Set deterministic build metadata
        if: env.REUSED_SOURCE_IMAGE_DIGEST == ''
        run: |
          echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"
          echo "LC_ALL=C" >> "$GITHUB_ENV"
          echo "TZ=UTC" >> "$GITHUB_ENV"
      - name: Authenticate to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Authenticate to Scaleway CI cache
        if: env.REUSED_SOURCE_IMAGE_DIGEST == ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.CI_CACHE_REGISTRY }}
          username: nologin
          password: ${{ secrets.SCW_CI_CACHE_SECRET_KEY }}
      - name: Set up Buildx
        if: env.REUSED_SOURCE_IMAGE_DIGEST == ''
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build and push immutable image
        if: env.REUSED_SOURCE_IMAGE_DIGEST == ''
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/worker/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          build-args: SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: |
            type=registry,ref=${{ env.CI_CACHE_REGISTRY }}/rust-builder:rust-1.98.1-linux-amd64
            type=registry,ref=${{ env.CI_CACHE_REGISTRY }}/worker:buildcache
          cache-to: |
            type=registry,ref=${{ env.CI_CACHE_REGISTRY }}/rust-builder:rust-1.98.1-linux-amd64,mode=max,compression=zstd,oci-mediatypes=true,image-manifest=true
            type=registry,ref=${{ env.CI_CACHE_REGISTRY }}/worker:buildcache,mode=max,compression=zstd,oci-mediatypes=true,image-manifest=true
      - name: Block vulnerable release images
        if: env.REUSED_SOURCE_IMAGE_DIGEST == ''
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
      - name: Attest container build provenance
        if: env.REUSED_SOURCE_IMAGE_DIGEST == ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign container image
        if: env.REUSED_SOURCE_IMAGE_DIGEST == ''
        run: cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${{ steps.build.outputs.digest }}"
      - name: Verify reusable signed image
        if: env.REUSED_SOURCE_IMAGE_DIGEST != ''
        run: |
          [[ "$REUSED_SOURCE_IMAGE_DIGEST" =~ ^ghcr\.io/nvbes-org/nvbes-worker@sha256:[0-9a-f]{64}$ ]]
          [[ "$SOURCE_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/deploy.yml@refs/heads/main"
          cosign verify "$REUSED_SOURCE_IMAGE_DIGEST" \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

  deploy-worker:
    needs: [ci-provenance, build-scan-sign-worker]
    if: ${{ success() && github.ref == 'refs/heads/main' && (inputs.service == 'all' || inputs.service == 'worker' || !inputs.service) }}
    runs-on: ${{ inputs.runner == 'local' && fromJSON('["self-hosted","Linux","ARM64","docker"]') || 'ubuntu-latest' }}
    timeout-minutes: 90
    environment:
      name: production-worker
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
    env:
      SCW_DEFAULT_ORGANIZATION_ID: ${{ vars.SCW_ORGANIZATION_ID }}
      SCW_DEFAULT_PROJECT_ID: ${{ vars.SCW_PROJECT_ID }}
      SCW_DEFAULT_REGION: fr-par
      SCW_DEFAULT_ZONE: fr-par-1
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
      TF_VAR_private_network_id: ${{ vars.SCW_PRIVATE_NETWORK_ID }}
      TF_VAR_grafana_otlp_authorization_header: ${{ secrets.GRAFANA_OTLP_AUTHORIZATION_HEADER }}
      TF_VAR_grafana_otlp_endpoint: ${{ vars.GRAFANA_OTLP_ENDPOINT }}
      TF_VAR_scaleway_organization_id: ${{ vars.SCW_ORGANIZATION_ID }}
      TF_VAR_scaleway_project_id: ${{ vars.SCW_PROJECT_ID }}
      TF_VAR_worker_database_url: ${{ secrets.WORKER_DATABASE_URL }}
      TF_VAR_worker_sentry_dsn: ${{ secrets.WORKER_SENTRY_DSN }}
      TF_VAR_worker_sentry_traces_sample_rate: ${{ vars.WORKER_SENTRY_TRACES_SAMPLE_RATE }}
      TERRAFORM_STATE_BUCKET: ${{ vars.TERRAFORM_STATE_BUCKET }}
      WORKER_TERRAFORM_STATE_KEY: production/worker/terraform.tfstate
      WORKER_REGISTRY_ENDPOINT: rg.fr-par.scw.cloud/nvbes-prod-worker
      STACK_ROOT: infrastructure/environments/worker-production
      REUSED_SOURCE_IMAGE_DIGEST: ${{ vars.WORKER_REUSE_SOURCE_IMAGE_DIGEST }}
      SOURCE_COMMIT_SHA: ${{ vars.WORKER_REUSE_SOURCE_COMMIT_SHA }}
      WORKER_DEPLOY_APPROVED_SHA: ${{ vars.WORKER_DEPLOY_APPROVED_SHA }}
      WORKER_DEPLOY_CONFIRMATION: ${{ vars.WORKER_DEPLOY_CONFIRMATION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: CI/CD security gate
        run: node tools/security/check-ci-cd-security.mjs --workflow .github/workflows/deploy.yml
      - name: Verify protected production candidate
        if: github.ref == 'refs/heads/main'
        run: |
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$WORKER_DEPLOY_CONFIRMATION" == "deploy-worker-production" ]]
          [[ "$WORKER_DEPLOY_APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$WORKER_DEPLOY_APPROVED_SHA" == "$GITHUB_SHA" ]]
          [[ -n "$TERRAFORM_STATE_BUCKET" ]]
      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
      - name: Resolve verified deployment digest
        run: |
          if [[ -n "$REUSED_SOURCE_IMAGE_DIGEST" ]]; then
            source_image="$REUSED_SOURCE_IMAGE_DIGEST"
            digest="${source_image##*@}"
          else
            source_image="ghcr.io/nvbes-org/nvbes-worker:${GITHUB_SHA}"
            digest="$(docker buildx imagetools inspect "$source_image" --format '{{.Manifest.Digest}}')"
            source_image="ghcr.io/nvbes-org/nvbes-worker@${digest}"
          fi
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "SOURCE_WORKER_IMAGE_DIGEST=${source_image}" >> "$GITHUB_ENV"
          echo "TF_VAR_worker_image=${WORKER_REGISTRY_ENDPOINT}/nvbes-worker@${digest}" >> "$GITHUB_ENV"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verify signed release identity
        run: |
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/deploy.yml@refs/heads/main"
          cosign verify "$SOURCE_WORKER_IMAGE_DIGEST" \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - name: Initialize isolated Worker state
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.WORKER_TERRAFORM_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.WORKER_TERRAFORM_STATE_SECRET_KEY }}
        run: >-
          terraform -chdir="$STACK_ROOT" init
          -reconfigure
          -backend-config=backend.ci.hcl
          -backend-config="bucket=$TERRAFORM_STATE_BUCKET"
          -backend-config="key=$WORKER_TERRAFORM_STATE_KEY"
      - name: Plan private image registry
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.WORKER_TERRAFORM_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.WORKER_TERRAFORM_STATE_SECRET_KEY }}
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        run: >-
          terraform -chdir="$STACK_ROOT" plan -lock-timeout=5m
          -target=scaleway_registry_namespace.worker
          -out=worker-registry.tfplan
      - name: Apply reviewed private registry plan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.WORKER_TERRAFORM_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.WORKER_TERRAFORM_STATE_SECRET_KEY }}
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        run: terraform -chdir="$STACK_ROOT" apply -lock-timeout=5m worker-registry.tfplan
      - name: Mirror verified image into private Scaleway registry
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.WORKER_TERRAFORM_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.WORKER_TERRAFORM_STATE_SECRET_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        run: |
          endpoint="$(terraform -chdir="$STACK_ROOT" output -raw worker_registry_endpoint)"
          [[ "$endpoint" == "$WORKER_REGISTRY_ENDPOINT" ]]
          printf '%s' "$SCW_SECRET_KEY" | docker login "$endpoint" --username nologin --password-stdin
          destination="${endpoint}/nvbes-worker:${GITHUB_SHA}"
          docker pull --platform linux/amd64 "$SOURCE_WORKER_IMAGE_DIGEST"
          docker tag "$SOURCE_WORKER_IMAGE_DIGEST" "$destination"
          docker push "$destination"
          digest="$(docker buildx imagetools inspect "$destination" --format '{{.Manifest.Digest}}')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "WORKER_IMAGE_DIGEST=${endpoint}/nvbes-worker@${digest}" >> "$GITHUB_ENV"
          echo "TF_VAR_worker_image=${endpoint}/nvbes-worker@${digest}" >> "$GITHUB_ENV"
      - name: Sign and verify private deployment image
        run: |
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/deploy.yml@refs/heads/main"
          cosign sign --yes "$WORKER_IMAGE_DIGEST"
          cosign verify "$WORKER_IMAGE_DIGEST" \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Plan Worker runtime
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.WORKER_TERRAFORM_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.WORKER_TERRAFORM_STATE_SECRET_KEY }}
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        run: terraform -chdir="$STACK_ROOT" plan -lock-timeout=5m -out=worker-runtime.tfplan
      - name: Apply reviewed Worker runtime plan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.WORKER_TERRAFORM_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.WORKER_TERRAFORM_STATE_SECRET_KEY }}
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        run: terraform -chdir="$STACK_ROOT" apply -lock-timeout=5m worker-runtime.tfplan
      - name: Verify public Worker health and readiness
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.WORKER_TERRAFORM_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.WORKER_TERRAFORM_STATE_SECRET_KEY }}
        run: |
          endpoint="$(terraform -chdir="$STACK_ROOT" output -raw worker_endpoint)"
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 "${endpoint}/health/live"
          curl --fail --silent --show-error --retry 12 --retry-all-errors --retry-delay 5 "${endpoint}/health/ready"
