name: deploy

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Service to deploy"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - account
          - billing
          - email
          - identity
          - trust-risk
      email_observability_only:
        description: "Reconcile only the idle Email queue alert; do not deploy runtimes"
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-production-${{ inputs.service || 'all' }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  ci-provenance:
    if: ${{ !inputs.email_observability_only }}
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: CI/CD security gate
        run: node tools/security/check-ci-cd-security.mjs --workflow .github/workflows/deploy.yml
      - name: Validate observability-only scope
        env:
          EMAIL_OBSERVABILITY_ONLY: ${{ inputs.email_observability_only }}
          REQUESTED_SERVICE: ${{ inputs.service }}
        run: |
          if [[ "$EMAIL_OBSERVABILITY_ONLY" == "true" ]]; then
            [[ "$REQUESTED_SERVICE" == "email" ]]
          fi
      - name: Verify exact continuous integration provenance
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node tools/ci/verify-ci-provenance.mjs

  build-scan-sign-account:
    needs: [ci-provenance]
    runs-on: [self-hosted, macOS, ARM64]
    if: ${{ success() && (inputs.service == 'all' || inputs.service == 'account' || !inputs.service) }}
    timeout-minutes: 60
    environment:
      name: production-ci-cache
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: write
      security-events: write
    env:
      CI_CACHE_REGISTRY: ${{ vars.SCW_CI_CACHE_REGISTRY_ENDPOINT }}
      REGISTRY: ghcr.io
      IMAGE_NAME: nvbes-org/nvbes-account-service
      REUSED_SOURCE_IMAGE_DIGEST: ${{ vars.ACCOUNT_REUSE_SOURCE_IMAGE_DIGEST }}
      SOURCE_COMMIT_SHA: ${{ vars.ACCOUNT_REUSE_SOURCE_COMMIT_SHA }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: CI/CD security gate
        run: node tools/security/check-ci-cd-security.mjs --workflow .github/workflows/deploy.yml
      - name: Set deterministic build metadata
        if: env.REUSED_SOURCE_IMAGE_DIGEST == ''
        run: |
          echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"
          echo "LC_ALL=C" >> "$GITHUB_ENV"
          echo "TZ=UTC" >> "$GITHUB_ENV"
      - name: Authenticate to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Authenticate to Scaleway CI cache
        if: env.REUSED_SOURCE_IMAGE_DIGEST == ''
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.CI_CACHE_REGISTRY }}
          username: nologin
          password: ${{ secrets.SCW_CI_CACHE_SECRET_KEY }}
      - name: Set up Buildx
        if: env.REUSED_SOURCE_IMAGE_DIGEST == ''
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build and push immutable image
        if: env.REUSED_SOURCE_IMAGE_DIGEST == ''
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/account-service/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          build-args: SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: |
            type=registry,ref=${{ env.CI_CACHE_REGISTRY }}/rust-builder:rust-1.91.1-linux-amd64
            type=registry,ref=${{ env.CI_CACHE_REGISTRY }}/account-service:buildcache
          cache-to: |
            type=registry,ref=${{ env.CI_CACHE_REGISTRY }}/rust-builder:rust-1.91.1-linux-amd64,mode=max,compression=zstd,oci-mediatypes=true,image-manifest=true
            type=registry,ref=${{ env.CI_CACHE_REGISTRY }}/account-service:buildcache,mode=max,compression=zstd,oci-mediatypes=true,image-manifest=true
      - name: Block vulnerable release images
        if: env.REUSED_SOURCE_IMAGE_DIGEST == ''
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Sign container image
        if: env.REUSED_SOURCE_IMAGE_DIGEST == ''
        run: cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${{ steps.build.outputs.digest }}"
      - name: Verify reusable signed image
        if: env.REUSED_SOURCE_IMAGE_DIGEST != ''
        run: |
          [[ "$REUSED_SOURCE_IMAGE_DIGEST" =~ ^ghcr\.io/nvbes-org/nvbes-account-service@sha256:[0-9a-f]{64}$ ]]
          [[ "$SOURCE_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/deploy.yml@refs/heads/main"
          cosign verify "$REUSED_SOURCE_IMAGE_DIGEST" \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

  deploy-account:
    needs: [ci-provenance, build-scan-sign-account]
    if: ${{ success() && github.ref == 'refs/heads/main' && (inputs.service == 'all' || inputs.service == 'account' || !inputs.service) }}
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 90
    environment:
      name: production-account
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
    env:
      SCW_DEFAULT_ORGANIZATION_ID: ${{ vars.SCW_ORGANIZATION_ID }}
      SCW_DEFAULT_PROJECT_ID: ${{ vars.SCW_PROJECT_ID }}
      SCW_DEFAULT_REGION: fr-par
      SCW_DEFAULT_ZONE: fr-par-1
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
      TF_VAR_private_network_id: ${{ vars.SCW_PRIVATE_NETWORK_ID }}
      TF_VAR_grafana_otlp_authorization_header: ${{ secrets.GRAFANA_OTLP_AUTHORIZATION_HEADER }}
      TF_VAR_grafana_otlp_endpoint: ${{ vars.GRAFANA_OTLP_ENDPOINT }}
      TF_VAR_scaleway_organization_id: ${{ vars.SCW_ORGANIZATION_ID }}
      TF_VAR_scaleway_project_id: ${{ vars.SCW_PROJECT_ID }}
      TF_VAR_account_metrics_token: ${{ secrets.ACCOUNT_METRICS_TOKEN }}
      TF_VAR_identity_token_key_id: ${{ vars.IDENTITY_TOKEN_KEY_ID }}
      TF_VAR_identity_token_public_key_pem: ${{ secrets.IDENTITY_TOKEN_PUBLIC_KEY_PEM }}
      TF_VAR_account_sentry_dsn: ${{ secrets.ACCOUNT_SENTRY_DSN }}
      TF_VAR_account_sentry_traces_sample_rate: ${{ vars.ACCOUNT_SENTRY_TRACES_SAMPLE_RATE }}
      TERRAFORM_STATE_BUCKET: ${{ vars.TERRAFORM_STATE_BUCKET }}
      ACCOUNT_TERRAFORM_STATE_KEY: production/account/terraform.tfstate
      ACCOUNT_REGISTRY_ENDPOINT: rg.fr-par.scw.cloud/nvbes-prod-account
      STACK_ROOT: infrastructure/environments/account-production
      REUSED_SOURCE_IMAGE_DIGEST: ${{ vars.ACCOUNT_REUSE_SOURCE_IMAGE_DIGEST }}
      SOURCE_COMMIT_SHA: ${{ vars.ACCOUNT_REUSE_SOURCE_COMMIT_SHA }}
      ACCOUNT_DEPLOY_APPROVED_SHA: ${{ vars.ACCOUNT_DEPLOY_APPROVED_SHA }}
      ACCOUNT_DEPLOY_CONFIRMATION: ${{ vars.ACCOUNT_DEPLOY_CONFIRMATION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: CI/CD security gate
        run: node tools/security/check-ci-cd-security.mjs --workflow .github/workflows/deploy.yml
      - name: Verify protected production candidate
        if: github.ref == 'refs/heads/main'
        run: |
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$ACCOUNT_DEPLOY_CONFIRMATION" == "deploy-account-production" ]]
          [[ "$ACCOUNT_DEPLOY_APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ACCOUNT_DEPLOY_APPROVED_SHA" == "$GITHUB_SHA" ]]
          [[ -n "$TERRAFORM_STATE_BUCKET" ]]
      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
      - name: Resolve verified deployment digest
        run: |
          if [[ -n "$REUSED_SOURCE_IMAGE_DIGEST" ]]; then
            source_image="$REUSED_SOURCE_IMAGE_DIGEST"
            digest="${source_image##*@}"
          else
            source_image="ghcr.io/nvbes-org/nvbes-account-service:${GITHUB_SHA}"
            digest="$(docker buildx imagetools inspect "$source_image" --format '{{.Manifest.Digest}}')"
            source_image="ghcr.io/nvbes-org/nvbes-account-service@${digest}"
          fi
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "SOURCE_ACCOUNT_IMAGE_DIGEST=${source_image}" >> "$GITHUB_ENV"
          echo "TF_VAR_account_image=${ACCOUNT_REGISTRY_ENDPOINT}/nvbes-account-service@${digest}" >> "$GITHUB_ENV"
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Verify signed release identity
        run: |
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/deploy.yml@refs/heads/main"
          cosign verify "$SOURCE_ACCOUNT_IMAGE_DIGEST" \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - name: Initialize isolated Account state
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ACCOUNT_TERRAFORM_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ACCOUNT_TERRAFORM_STATE_SECRET_KEY }}
        run: >-
          terraform -chdir="$STACK_ROOT" init
          -reconfigure
          -backend-config=backend.ci.hcl
          -backend-config="bucket=$TERRAFORM_STATE_BUCKET"
          -backend-config="key=$ACCOUNT_TERRAFORM_STATE_KEY"
      - name: Plan private image registry
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ACCOUNT_TERRAFORM_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ACCOUNT_TERRAFORM_STATE_SECRET_KEY }}
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        run: >-
          terraform -chdir="$STACK_ROOT" plan -lock-timeout=5m
          -target=scaleway_registry_namespace.account
          -out=account-registry.tfplan
      - name: Apply reviewed private registry plan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ACCOUNT_TERRAFORM_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ACCOUNT_TERRAFORM_STATE_SECRET_KEY }}
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        run: terraform -chdir="$STACK_ROOT" apply -lock-timeout=5m account-registry.tfplan
      - name: Mirror verified image into private Scaleway registry
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ACCOUNT_TERRAFORM_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ACCOUNT_TERRAFORM_STATE_SECRET_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        run: |
          endpoint="$(terraform -chdir="$STACK_ROOT" output -raw account_registry_endpoint)"
          [[ "$endpoint" == "$ACCOUNT_REGISTRY_ENDPOINT" ]]
          printf '%s' "$SCW_SECRET_KEY" | docker login "$endpoint" --username nologin --password-stdin
          destination="${endpoint}/nvbes-account-service:${GITHUB_SHA}"
          docker pull --platform linux/amd64 "$SOURCE_ACCOUNT_IMAGE_DIGEST"
          docker tag "$SOURCE_ACCOUNT_IMAGE_DIGEST" "$destination"
          docker push "$destination"
          digest="$(docker buildx imagetools inspect "$destination" --format '{{.Manifest.Digest}}')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "ACCOUNT_IMAGE_DIGEST=${endpoint}/nvbes-account-service@${digest}" >> "$GITHUB_ENV"
          echo "TF_VAR_account_image=${endpoint}/nvbes-account-service@${digest}" >> "$GITHUB_ENV"
      - name: Sign and verify private deployment image
        run: |
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/deploy.yml@refs/heads/main"
          cosign sign --yes "$ACCOUNT_IMAGE_DIGEST"
          cosign verify "$ACCOUNT_IMAGE_DIGEST" \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Plan migration foundation
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ACCOUNT_TERRAFORM_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ACCOUNT_TERRAFORM_STATE_SECRET_KEY }}
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        run: >-
          terraform -chdir="$STACK_ROOT" plan -lock-timeout=5m
          -target=scaleway_job_definition.account_database_migration
          -target=scaleway_iam_api_key.account_database_runtime
          -target=scaleway_iam_policy.account_database_runtime
          -out=account-migration.tfplan
      - name: Apply reviewed migration foundation plan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ACCOUNT_TERRAFORM_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ACCOUNT_TERRAFORM_STATE_SECRET_KEY }}
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        run: terraform -chdir="$STACK_ROOT" apply -lock-timeout=5m account-migration.tfplan
      - name: Run database migrations
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ACCOUNT_TERRAFORM_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ACCOUNT_TERRAFORM_STATE_SECRET_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        run: |
          ref="$(terraform -chdir="$STACK_ROOT" output -raw account_database_migration_job_id)"
          job_id="${ref##*/}"
          response="$(curl --fail-with-body --silent --show-error --request POST \
            --header "X-Auth-Token: $SCW_SECRET_KEY" --header 'Content-Type: application/json' \
            --data '{}' "https://api.scaleway.com/serverless-jobs/v1alpha2/regions/fr-par/job-definitions/${job_id}/start")"
          run_id="$(jq -er '.job_runs[0].id' <<<"$response")"
          state=queued
          for _attempt in {1..60}; do
            response="$(curl --fail-with-body --silent --show-error \
              --header "X-Auth-Token: $SCW_SECRET_KEY" \
              "https://api.scaleway.com/serverless-jobs/v1alpha2/regions/fr-par/job-runs/${run_id}")"
            state="$(jq -er '.state' <<<"$response")"
            case "$state" in
              succeeded) break ;;
              failed|canceled|interrupted) exit 1 ;;
            esac
            sleep 10
          done
          [[ "$state" == "succeeded" ]]
      - name: Plan Account runtime
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ACCOUNT_TERRAFORM_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ACCOUNT_TERRAFORM_STATE_SECRET_KEY }}
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        run: terraform -chdir="$STACK_ROOT" plan -lock-timeout=5m -out=account-runtime.tfplan
      - name: Apply reviewed Account runtime plan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ACCOUNT_TERRAFORM_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ACCOUNT_TERRAFORM_STATE_SECRET_KEY }}
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        run: terraform -chdir="$STACK_ROOT" apply -lock-timeout=5m account-runtime.tfplan
      - name: Prove Account public runtime
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ACCOUNT_TERRAFORM_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ACCOUNT_TERRAFORM_STATE_SECRET_KEY }}
          ACCOUNT_METRICS_TOKEN: ${{ secrets.ACCOUNT_METRICS_TOKEN }}
        run: tools/deployment/prove-account-public-runtime.sh
      - name: Prove Account synthetic lifecycle and outbox
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.ACCOUNT_TERRAFORM_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.ACCOUNT_TERRAFORM_STATE_SECRET_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        run: tools/deployment/prove-account-synthetic.sh

  build-scan-sign-billing:
    needs: [ci-provenance]
    runs-on: [self-hosted, macOS, ARM64]
    if: ${{ success() && (inputs.service == 'all' || inputs.service == 'billing' || !inputs.service) }}
    timeout-minutes: 60
    environment:
      name: production-ci-cache
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: write
      security-events: write
    env:
      CI_CACHE_REGISTRY: ${{ vars.SCW_CI_CACHE_REGISTRY_ENDPOINT }}
      REGISTRY: ghcr.io
      IMAGE_NAME: nvbes-org/nvbes-billing-service
      REUSED_SOURCE_IMAGE_DIGEST: ${{ vars.BILLING_REUSE_SOURCE_IMAGE_DIGEST }}
      SOURCE_COMMIT_SHA: ${{ vars.BILLING_REUSE_SOURCE_COMMIT_SHA }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: CI/CD security gate
        run: >-
          node tools/security/check-ci-cd-security.mjs
          --workflow .github/workflows/deploy.yml
      - name: Set deterministic build metadata
        if: env.REUSED_SOURCE_IMAGE_DIGEST == ''
        run: |
          echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"
          echo "LC_ALL=C" >> "$GITHUB_ENV"
          echo "TZ=UTC" >> "$GITHUB_ENV"
      - name: Authenticate to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Authenticate to Scaleway CI cache
        if: env.REUSED_SOURCE_IMAGE_DIGEST == ''
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.CI_CACHE_REGISTRY }}
          username: nologin
          password: ${{ secrets.SCW_CI_CACHE_SECRET_KEY }}
      - name: Set up Buildx
        if: env.REUSED_SOURCE_IMAGE_DIGEST == ''
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build and push immutable image
        if: env.REUSED_SOURCE_IMAGE_DIGEST == ''
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/billing-service/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          build-args: SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: |
            type=registry,ref=${{ env.CI_CACHE_REGISTRY }}/rust-builder:rust-1.91.1-linux-amd64
            type=registry,ref=${{ env.CI_CACHE_REGISTRY }}/billing-service:buildcache
          cache-to: |
            type=registry,ref=${{ env.CI_CACHE_REGISTRY }}/rust-builder:rust-1.91.1-linux-amd64,mode=max,compression=zstd,oci-mediatypes=true,image-manifest=true
            type=registry,ref=${{ env.CI_CACHE_REGISTRY }}/billing-service:buildcache,mode=max,compression=zstd,oci-mediatypes=true,image-manifest=true
      - name: Block vulnerable release images
        if: env.REUSED_SOURCE_IMAGE_DIGEST == ''
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Sign container image
        if: env.REUSED_SOURCE_IMAGE_DIGEST == ''
        run: cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${{ steps.build.outputs.digest }}"
      - name: Verify reusable signed image
        if: env.REUSED_SOURCE_IMAGE_DIGEST != ''
        run: |
          [[ "$REUSED_SOURCE_IMAGE_DIGEST" =~ ^ghcr\.io/nvbes-org/nvbes-billing-service@sha256:[0-9a-f]{64}$ ]]
          [[ "$SOURCE_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/deploy.yml@refs/heads/main"
          cosign verify "$REUSED_SOURCE_IMAGE_DIGEST" \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

  deploy-billing:
    needs: [ci-provenance, build-scan-sign-billing]
    if: ${{ success() && github.ref == 'refs/heads/main' && (inputs.service == 'all' || inputs.service == 'billing' || !inputs.service) }}
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 90
    environment:
      name: production-billing
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
    env:
      SCW_DEFAULT_ORGANIZATION_ID: ${{ vars.SCW_ORGANIZATION_ID }}
      SCW_DEFAULT_PROJECT_ID: ${{ vars.SCW_PROJECT_ID }}
      SCW_DEFAULT_REGION: fr-par
      SCW_DEFAULT_ZONE: fr-par-1
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
      TF_VAR_private_network_id: ${{ vars.SCW_PRIVATE_NETWORK_ID }}
      TF_VAR_grafana_otlp_authorization_header: ${{ secrets.GRAFANA_OTLP_AUTHORIZATION_HEADER }}
      TF_VAR_grafana_otlp_endpoint: ${{ vars.GRAFANA_OTLP_ENDPOINT }}
      TF_VAR_scaleway_organization_id: ${{ vars.SCW_ORGANIZATION_ID }}
      TF_VAR_scaleway_project_id: ${{ vars.SCW_PROJECT_ID }}
      TF_VAR_stripe_secret_key: ${{ secrets.STRIPE_SECRET_KEY }}
      TF_VAR_stripe_webhook_secret: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      TF_VAR_billing_metrics_token: ${{ secrets.BILLING_METRICS_TOKEN }}
      TF_VAR_billing_operator_token: ${{ secrets.BILLING_OPERATOR_TOKEN }}
      TF_VAR_billing_sentry_dsn: ${{ secrets.BILLING_SENTRY_DSN }}
      TERRAFORM_STATE_BUCKET: ${{ vars.TERRAFORM_STATE_BUCKET }}
      BILLING_TERRAFORM_STATE_KEY: production/billing/terraform.tfstate
      BILLING_REGISTRY_ENDPOINT: rg.fr-par.scw.cloud/nvbes-prod-billing
      STACK_ROOT: infrastructure/environments/billing-production
      REUSED_SOURCE_IMAGE_DIGEST: ${{ vars.BILLING_REUSE_SOURCE_IMAGE_DIGEST }}
      SOURCE_COMMIT_SHA: ${{ vars.BILLING_REUSE_SOURCE_COMMIT_SHA }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: CI/CD security gate
        run: >-
          node tools/security/check-ci-cd-security.mjs
          --workflow .github/workflows/deploy.yml
      - name: Verify protected production candidate
        if: github.ref == 'refs/heads/main'
        run: |
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: >-
          printf '%s' "$GHCR_TOKEN" |
          docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Resolve immutable Billing image
        env:
          IMAGE_TAG: ghcr.io/nvbes-org/nvbes-billing-service:${{ github.sha }}
        run: |
          if [[ -n "$REUSED_SOURCE_IMAGE_DIGEST" ]]; then
            source_image="$REUSED_SOURCE_IMAGE_DIGEST"
            digest="${source_image##*@}"
          else
            digest="$(docker buildx imagetools inspect "$IMAGE_TAG" --format '{{.Manifest.Digest}}')"
            source_image="ghcr.io/nvbes-org/nvbes-billing-service@${digest}"
          fi
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "BILLING_IMAGE_DIGEST=${digest}" >> "$GITHUB_ENV"
          echo "BILLING_SOURCE_IMAGE=${source_image}" >> "$GITHUB_ENV"
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/deploy.yml@refs/heads/main"
          cosign verify "$source_image" \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - name: Initialize Billing production Terraform state
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BILLING_TERRAFORM_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BILLING_TERRAFORM_STATE_SECRET_KEY }}
        run: >-
          terraform -chdir="$STACK_ROOT" init
          -reconfigure
          -backend-config=backend.ci.hcl
          -backend-config="bucket=${TERRAFORM_STATE_BUCKET}"
          -backend-config="key=${BILLING_TERRAFORM_STATE_KEY}"
      - name: Plan Billing runtime
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BILLING_TERRAFORM_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BILLING_TERRAFORM_STATE_SECRET_KEY }}
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          TF_VAR_billing_image: ${{ env.BILLING_SOURCE_IMAGE }}
        run: terraform -chdir="$STACK_ROOT" plan -lock-timeout=5m -out=billing-runtime.tfplan
      - name: Apply reviewed Billing runtime plan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.BILLING_TERRAFORM_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BILLING_TERRAFORM_STATE_SECRET_KEY }}
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        run: terraform -chdir="$STACK_ROOT" apply -lock-timeout=5m billing-runtime.tfplan
      - name: Verify Billing live runtime
        env:
          BILLING_METRICS_TOKEN: ${{ secrets.BILLING_METRICS_TOKEN }}
        run: ./tools/deployment/prove-billing-runtime.sh
      - name: Verify Billing Stripe test mode
        env:
          BILLING_OPERATOR_TOKEN: ${{ secrets.BILLING_OPERATOR_TOKEN }}
        run: ./tools/deployment/prove-billing-stripe-test.sh

  build-scan-sign-email:
    needs: [ci-provenance]
    runs-on: [self-hosted, macOS, ARM64]
    if: ${{ success() && !inputs.email_observability_only && (inputs.service == 'all' || inputs.service == 'email' || !inputs.service) }}
    timeout-minutes: 75
    environment:
      name: production-ci-cache
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: write
      security-events: write
    env:
      CI_CACHE_REGISTRY: ${{ vars.SCW_CI_CACHE_REGISTRY_ENDPOINT }}
      REGISTRY: ghcr.io
      IMAGE_NAME: nvbes-org/nvbes-email-worker
      TRIVY_DB_REPOSITORY: ghcr.io/aquasecurity/trivy-db:2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: CI/CD security gate
        run: >-
          node tools/security/check-ci-cd-security.mjs
          --workflow .github/workflows/deploy.yml
      - name: Set deterministic build metadata
        run: |
          echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"
          echo "LC_ALL=C" >> "$GITHUB_ENV"
          echo "TZ=UTC" >> "$GITHUB_ENV"
      - name: Authenticate to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Authenticate to Scaleway CI cache
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.CI_CACHE_REGISTRY }}
          username: nologin
          password: ${{ secrets.SCW_CI_CACHE_SECRET_KEY }}
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build and push immutable image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/email-worker/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          build-args: |
            SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
            CARGO_PACKAGE=nvbes-email-worker
            CARGO_BINARY=nvbes-email-worker
            APPLICATION_PATH=apps/email-worker
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: |
            type=registry,ref=${{ env.CI_CACHE_REGISTRY }}/rust-builder:rust-1.91.1-linux-amd64
            type=registry,ref=${{ env.CI_CACHE_REGISTRY }}/email-worker:buildcache
          cache-to: |
            type=registry,ref=${{ env.CI_CACHE_REGISTRY }}/rust-builder:rust-1.91.1-linux-amd64,mode=max,compression=zstd,oci-mediatypes=true,image-manifest=true
            type=registry,ref=${{ env.CI_CACHE_REGISTRY }}/email-worker:buildcache,mode=max,compression=zstd,oci-mediatypes=true,image-manifest=true
      - name: Block vulnerable release images
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ github.token }}
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
      - name: Generate CycloneDX SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ github.token }}
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: cyclonedx
          output: sbom.json
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Sign container image
        run: |
          cosign sign --yes "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"

  reconcile-email-idle-alert:
    if: ${{ success() && github.ref == 'refs/heads/main' && inputs.service == 'email' && inputs.email_observability_only }}
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 5
    environment:
      name: production-email
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: CI/CD security gate
        run: node tools/security/check-ci-cd-security.mjs --workflow .github/workflows/deploy.yml
      - name: Validate the checked-out revision and Email alert contract
        run: |
          [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          node --test tools/ci/email-deployment-contract.test.mjs
      - name: Reconcile only the closed-window queue alert
        env:
          EMAIL_SYNTHETIC_SMOKE_ENABLED: ${{ vars.EMAIL_SYNTHETIC_SMOKE_ENABLED }}
          GRAFANA_URL: ${{ vars.GRAFANA_URL }}
          GRAFANA_PROMETHEUS_DATASOURCE_UID: ${{ vars.GRAFANA_PROMETHEUS_DATASOURCE_UID }}
          GRAFANA_SERVICE_ACCOUNT_TOKEN: ${{ secrets.GRAFANA_SERVICE_ACCOUNT_TOKEN }}
        run: node tools/ci/reconcile-email-idle-alert.mjs

  deploy-email:
    needs: [ci-provenance, build-scan-sign-email]
    if: ${{ success() && github.ref == 'refs/heads/main' && (inputs.service == 'all' || inputs.service == 'email' || !inputs.service) }}
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 90
    environment:
      name: production-email
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
    env:
      EMAIL_DEPLOY_APPROVED_SHA: ${{ vars.EMAIL_DEPLOY_APPROVED_SHA }}
      EMAIL_DEPLOY_CONFIRMATION: ${{ vars.EMAIL_DEPLOY_CONFIRMATION }}
      EMAIL_SYNTHETIC_SMOKE_ENABLED: ${{ vars.EMAIL_SYNTHETIC_SMOKE_ENABLED }}
      SCW_DEFAULT_PROJECT_ID: ${{ vars.SCW_PROJECT_ID }}
      SCW_DEFAULT_REGION: fr-par
      SCW_DEFAULT_ZONE: fr-par-1
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
      TF_VAR_accept_scaleway_tem_terms: ${{ vars.SCALEWAY_TEM_TERMS_ACCEPTED }}
      TF_VAR_base_domain: ${{ vars.BASE_DOMAIN }}
      TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
      TF_VAR_email_database_runtime_credential_generation: ${{ vars.EMAIL_DATABASE_RUNTIME_CREDENTIAL_GENERATION }}
      TF_VAR_email_internal_validation_enabled: ${{ vars.EMAIL_SYNTHETIC_SMOKE_ENABLED }}
      TF_VAR_email_sentry_traces_sample_rate: ${{ vars.EMAIL_SENTRY_TRACES_SAMPLE_RATE }}
      TF_VAR_grafana_email_contact_point: ${{ vars.GRAFANA_EMAIL_CONTACT_POINT }}
      TF_VAR_grafana_prometheus_datasource_uid: ${{ vars.GRAFANA_PROMETHEUS_DATASOURCE_UID }}
      TF_VAR_grafana_url: ${{ vars.GRAFANA_URL }}
      TF_VAR_private_network_id: ${{ vars.SCW_PRIVATE_NETWORK_ID }}
      TF_VAR_scaleway_project_id: ${{ vars.SCW_PROJECT_ID }}
      TERRAFORM_STATE_BUCKET: ${{ vars.TERRAFORM_STATE_BUCKET }}
      EMAIL_TERRAFORM_STATE_KEY: production/email/terraform.tfstate
      EMAIL_REGISTRY_ENDPOINT: rg.fr-par.scw.cloud/nvbes-prod-email-worker
      STACK_ROOT: infrastructure/environments/email-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: CI/CD security gate
        run: >-
          node tools/security/check-ci-cd-security.mjs
          --workflow .github/workflows/deploy.yml
      - name: Verify protected production candidate
        if: github.ref == 'refs/heads/main'
        env:
          SCALEWAY_TEM_TERMS_ACCEPTED: ${{ vars.SCALEWAY_TEM_TERMS_ACCEPTED }}
        run: |
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$EMAIL_DEPLOY_CONFIRMATION" == "deploy-email-production" ]]
          [[ "$EMAIL_DEPLOY_APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EMAIL_DEPLOY_APPROVED_SHA" == "$GITHUB_SHA" ]]
          [[ "$EMAIL_SYNTHETIC_SMOKE_ENABLED" == "true" ]]
          [[ "$SCALEWAY_TEM_TERMS_ACCEPTED" == "true" ]]
          [[ -n "$TERRAFORM_STATE_BUCKET" ]]
      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: >-
          printf '%s' "$GHCR_TOKEN" |
          docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Resolve immutable email image
        env:
          IMAGE_TAG: ghcr.io/nvbes-org/nvbes-email-worker:${{ github.sha }}
        run: |
          digest="$(docker buildx imagetools inspect "$IMAGE_TAG" --format '{{.Manifest.Digest}}')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          source_image_digest="ghcr.io/nvbes-org/nvbes-email-worker@${digest}"
          destination_image_digest="${EMAIL_REGISTRY_ENDPOINT}/nvbes-email-worker@${digest}"
          echo "SOURCE_EMAIL_IMAGE_DIGEST=$source_image_digest" >> "$GITHUB_ENV"
          echo "TF_VAR_email_worker_image=$destination_image_digest" >> "$GITHUB_ENV"
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Verify signed release identity
        run: |
          certificate_identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/deploy.yml@refs/heads/main"
          cosign verify "$SOURCE_EMAIL_IMAGE_DIGEST" \
            --certificate-identity "$certificate_identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - name: Resolve Scaleway organization context
        env:
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        run: |
          uuid_pattern='^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
          [[ "$SCW_DEFAULT_PROJECT_ID" =~ $uuid_pattern ]]
          organization_id="$(
            curl --fail --silent --show-error --retry 3 \
              --header "X-Auth-Token: $SCW_SECRET_KEY" \
              "https://api.scaleway.com/account/v3/projects/$SCW_DEFAULT_PROJECT_ID" |
              jq --exit-status --raw-output '.organization_id'
          )"
          [[ "$organization_id" =~ $uuid_pattern ]]
          printf 'SCW_DEFAULT_ORGANIZATION_ID=%s\n' "$organization_id" >> "$GITHUB_ENV"
      - name: Initialize isolated email state
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.EMAIL_TERRAFORM_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.EMAIL_TERRAFORM_STATE_SECRET_KEY }}
        run: >-
          terraform -chdir="$STACK_ROOT" init
          -reconfigure
          -backend-config=backend.ci.hcl
          -backend-config="bucket=$TERRAFORM_STATE_BUCKET"
          -backend-config="key=$EMAIL_TERRAFORM_STATE_KEY"
      - name: Capture recoverable deployment image
        env:
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        run: |
          rollback_image="$(
            curl --fail --silent --show-error \
              --get \
              --header "X-Auth-Token: $SCW_SECRET_KEY" \
              --data-urlencode "project_id=${SCW_DEFAULT_PROJECT_ID}" \
              --data-urlencode "name=nvbes-prod-email-ingress" \
              "https://api.scaleway.com/containers/v1/regions/fr-par/containers" |
              jq --exit-status --raw-output \
                '.containers | select(length == 1) | .[0].image'
          )"
          [[ "$rollback_image" =~ ^${EMAIL_REGISTRY_ENDPOINT}/nvbes-email-worker@sha256:[0-9a-f]{64}$ ]]
          echo "EMAIL_ROLLBACK_IMAGE=$rollback_image" >> "$GITHUB_ENV"
      - name: Prepare Terraform-owned SNS subscription
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.EMAIL_TERRAFORM_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.EMAIL_TERRAFORM_STATE_SECRET_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          TF_VAR_email_data_encryption_key: ${{ secrets.EMAIL_DATA_ENCRYPTION_KEY }}
          TF_VAR_email_observability_internal_token: ${{ secrets.EMAIL_OBSERVABILITY_INTERNAL_TOKEN }}
          TF_VAR_email_producer_tokens: ${{ secrets.EMAIL_PRODUCER_TOKENS }}
          TF_VAR_email_recipient_hmac_key: ${{ secrets.EMAIL_RECIPIENT_HMAC_KEY }}
          TF_VAR_email_sentry_dsn: ${{ secrets.EMAIL_SENTRY_DSN }}
          TF_VAR_email_sns_ca_bundle_pem: ${{ secrets.EMAIL_SNS_CA_BUNDLE_PEM }}
          TF_VAR_scaleway_email_secret_key: ${{ secrets.SCALEWAY_EMAIL_SECRET_KEY }}
        run: |
          resource=scaleway_mnq_sns_topic_subscription.email_worker
          if ! terraform -chdir="$STACK_ROOT" state show -no-color "$resource" >/dev/null 2>&1; then
            terraform -chdir="$STACK_ROOT" plan \
              -lock-timeout=5m \
              -target=scaleway_mnq_sns_credentials.email_events_terraform \
              -replace=scaleway_mnq_sns_credentials.email_events_terraform \
              -out=email-sns-management-credential.tfplan
            terraform -chdir="$STACK_ROOT" apply \
              -lock-timeout=5m \
              email-sns-management-credential.tfplan

            state_snapshot_json="$(terraform -chdir="$STACK_ROOT" state pull)"
            export TF_VAR_email_sns_management_access_key_override="$(
              jq --exit-status --raw-output \
                '.resources[] | select(.type == "scaleway_mnq_sns_credentials" and .name == "email_events_terraform") | .instances[0].attributes.access_key | select(length > 0)' \
                <<<"$state_snapshot_json"
            )"
            export TF_VAR_email_sns_management_secret_key_override="$(
              jq --exit-status --raw-output \
                '.resources[] | select(.type == "scaleway_mnq_sns_credentials" and .name == "email_events_terraform") | .instances[0].attributes.secret_key | select(length > 0)' \
                <<<"$state_snapshot_json"
            )"
            printf '::add-mask::%s\n' "$TF_VAR_email_sns_management_access_key_override"
            printf '::add-mask::%s\n' "$TF_VAR_email_sns_management_secret_key_override"

            credential_id="$(
              jq --exit-status --raw-output \
                '.resources[] | select(.type == "scaleway_mnq_sns_credentials" and .name == "email_events_terraform") | .instances[0].attributes.id | split("/")[-1]' \
                <<<"$state_snapshot_json"
            )"
            credential_metadata="$(
              curl --fail-with-body --silent --show-error \
                --header "X-Auth-Token: $SCW_SECRET_KEY" \
                "https://api.scaleway.com/mnq/v1beta1/regions/fr-par/sns-credentials/${credential_id}"
            )"
            jq --exit-status \
              '.permissions.can_manage == true and .permissions.can_publish == true and .permissions.can_receive == true' \
              <<<"$credential_metadata" >/dev/null
            expected_secret_checksum="$(jq --exit-status --raw-output '.secret_checksum' <<<"$credential_metadata")"
            actual_secret_checksum="$(printf '%s' "$TF_VAR_email_sns_management_secret_key_override" | shasum -a 1 | awk '{print $1}')"
            [[ "$actual_secret_checksum" == "$expected_secret_checksum" ]]
            echo 'SNS management credential permissions and secret checksum verified.'
            unset credential_metadata actual_secret_checksum expected_secret_checksum
            unset state_snapshot_json

            export TF_VAR_email_internal_validation_enabled=false
            export TF_VAR_email_worker_image="$EMAIL_ROLLBACK_IMAGE"
            terraform -chdir="$STACK_ROOT" plan \
              -refresh=false \
              -lock-timeout=5m \
              -target=scaleway_mnq_sns_topic.email_events \
              -out=email-sns-topic-credential.tfplan
            terraform -chdir="$STACK_ROOT" apply \
              -lock-timeout=5m \
              email-sns-topic-credential.tfplan
          fi
      - name: Plan private image registry
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.EMAIL_TERRAFORM_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.EMAIL_TERRAFORM_STATE_SECRET_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          TF_VAR_email_data_encryption_key: ${{ secrets.EMAIL_DATA_ENCRYPTION_KEY }}
          TF_VAR_email_observability_internal_token: ${{ secrets.EMAIL_OBSERVABILITY_INTERNAL_TOKEN }}
          TF_VAR_email_producer_tokens: ${{ secrets.EMAIL_PRODUCER_TOKENS }}
          TF_VAR_email_recipient_hmac_key: ${{ secrets.EMAIL_RECIPIENT_HMAC_KEY }}
          TF_VAR_email_sentry_dsn: ${{ secrets.EMAIL_SENTRY_DSN }}
          TF_VAR_email_sns_ca_bundle_pem: ${{ secrets.EMAIL_SNS_CA_BUNDLE_PEM }}
          TF_VAR_scaleway_email_secret_key: ${{ secrets.SCALEWAY_EMAIL_SECRET_KEY }}
        run: >-
          terraform -chdir="$STACK_ROOT" plan
          -lock-timeout=5m
          -target=scaleway_registry_namespace.email_worker
          -out=email-registry.tfplan
      - name: Apply reviewed private registry plan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.EMAIL_TERRAFORM_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.EMAIL_TERRAFORM_STATE_SECRET_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        run: >-
          terraform -chdir="$STACK_ROOT" apply
          -lock-timeout=5m
          email-registry.tfplan
      - name: Mirror verified image into private Scaleway registry
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.EMAIL_TERRAFORM_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.EMAIL_TERRAFORM_STATE_SECRET_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        run: |
          registry_endpoint="$(terraform -chdir="$STACK_ROOT" output -raw email_registry_endpoint)"
          [[ "$registry_endpoint" == "$EMAIL_REGISTRY_ENDPOINT" ]]
          printf '%s' "$SCW_SECRET_KEY" |
            docker login "$EMAIL_REGISTRY_ENDPOINT" --username nologin --password-stdin

          destination_tag="${EMAIL_REGISTRY_ENDPOINT}/nvbes-email-worker:${GITHUB_SHA}"
          docker pull --platform linux/amd64 "$SOURCE_EMAIL_IMAGE_DIGEST"
          docker tag "$SOURCE_EMAIL_IMAGE_DIGEST" "$destination_tag"
          docker push "$destination_tag"

          destination_digest="$(docker buildx imagetools inspect "$destination_tag" --format '{{.Manifest.Digest}}')"
          [[ "$destination_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          image_digest="${EMAIL_REGISTRY_ENDPOINT}/nvbes-email-worker@${destination_digest}"
          echo "EMAIL_IMAGE_DIGEST=$image_digest" >> "$GITHUB_ENV"
          echo "TF_VAR_email_worker_image=$image_digest" >> "$GITHUB_ENV"
      - name: Sign and verify private deployment image
        run: |
          certificate_identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/deploy.yml@refs/heads/main"
          cosign sign --yes "$EMAIL_IMAGE_DIGEST"
          cosign verify "$EMAIL_IMAGE_DIGEST" \
            --certificate-identity "$certificate_identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          echo "EMAIL_DEPLOYMENT_IMAGE_READY=true" >> "$GITHUB_ENV"
      - name: Plan migration foundation
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.EMAIL_TERRAFORM_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.EMAIL_TERRAFORM_STATE_SECRET_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          TF_VAR_email_data_encryption_key: ${{ secrets.EMAIL_DATA_ENCRYPTION_KEY }}
          TF_VAR_email_observability_internal_token: ${{ secrets.EMAIL_OBSERVABILITY_INTERNAL_TOKEN }}
          TF_VAR_email_producer_tokens: ${{ secrets.EMAIL_PRODUCER_TOKENS }}
          TF_VAR_email_recipient_hmac_key: ${{ secrets.EMAIL_RECIPIENT_HMAC_KEY }}
          TF_VAR_email_sentry_dsn: ${{ secrets.EMAIL_SENTRY_DSN }}
          TF_VAR_email_sns_ca_bundle_pem: ${{ secrets.EMAIL_SNS_CA_BUNDLE_PEM }}
          TF_VAR_scaleway_email_secret_key: ${{ secrets.SCALEWAY_EMAIL_SECRET_KEY }}
        run: >-
          terraform -chdir="$STACK_ROOT" plan
          -lock-timeout=5m
          -target=scaleway_job_definition.email_database_migration
          -out=email-migration.tfplan
      - name: Apply reviewed migration foundation plan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.EMAIL_TERRAFORM_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.EMAIL_TERRAFORM_STATE_SECRET_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        run: >-
          terraform -chdir="$STACK_ROOT" apply
          -lock-timeout=5m
          email-migration.tfplan
      - name: Run database migrations
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.EMAIL_TERRAFORM_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.EMAIL_TERRAFORM_STATE_SECRET_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        run: |
          job_definition_ref="$(terraform -chdir="$STACK_ROOT" output -raw email_database_migration_job_id)"
          job_definition_id="${job_definition_ref##*/}"
          start_response="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "X-Auth-Token: $SCW_SECRET_KEY" \
            --header "Content-Type: application/json" \
            --data '{}' \
            "https://api.scaleway.com/serverless-jobs/v1alpha2/regions/fr-par/job-definitions/${job_definition_id}/start")"
          job_run_id="$(jq -er '.job_runs[0].id' <<<"$start_response")"

          migration_state="queued"
          for _attempt in {1..60}; do
            run_response="$(curl --fail-with-body --silent --show-error \
              --header "X-Auth-Token: $SCW_SECRET_KEY" \
              "https://api.scaleway.com/serverless-jobs/v1alpha2/regions/fr-par/job-runs/${job_run_id}")"
            migration_state="$(jq -er '.state' <<<"$run_response")"
            case "$migration_state" in
              succeeded)
                break
                ;;
              failed|canceled|interrupted)
                jq -r '{state, reason, exit_code, error_message}' <<<"$run_response" >&2
                exit 1
                ;;
            esac
            sleep 10
          done
          [[ "$migration_state" == "succeeded" ]]
      - name: Plan email runtime foundation
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.EMAIL_TERRAFORM_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.EMAIL_TERRAFORM_STATE_SECRET_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          TF_VAR_email_data_encryption_key: ${{ secrets.EMAIL_DATA_ENCRYPTION_KEY }}
          TF_VAR_email_observability_internal_token: ${{ secrets.EMAIL_OBSERVABILITY_INTERNAL_TOKEN }}
          TF_VAR_email_producer_tokens: ${{ secrets.EMAIL_PRODUCER_TOKENS }}
          TF_VAR_email_recipient_hmac_key: ${{ secrets.EMAIL_RECIPIENT_HMAC_KEY }}
          TF_VAR_email_sentry_dsn: ${{ secrets.EMAIL_SENTRY_DSN }}
          TF_VAR_email_sns_ca_bundle_pem: ${{ secrets.EMAIL_SNS_CA_BUNDLE_PEM }}
          TF_VAR_scaleway_email_secret_key: ${{ secrets.SCALEWAY_EMAIL_SECRET_KEY }}
        run: >-
          terraform -chdir="$STACK_ROOT" plan
          -lock-timeout=5m
          -target=scaleway_container.email_runtime
          -out=email-runtime-foundation.tfplan
      - name: Validate production runtime and Sentry reporting configuration
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.EMAIL_TERRAFORM_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.EMAIL_TERRAFORM_STATE_SECRET_KEY }}
          NVBES_EMAIL_DATA_ENCRYPTION_KEY: ${{ secrets.EMAIL_DATA_ENCRYPTION_KEY }}
          NVBES_OBSERVABILITY_INTERNAL_TOKEN: ${{ secrets.EMAIL_OBSERVABILITY_INTERNAL_TOKEN }}
          NVBES_EMAIL_PRODUCER_TOKENS: ${{ secrets.EMAIL_PRODUCER_TOKENS }}
          NVBES_EMAIL_RECIPIENT_HMAC_KEY: ${{ secrets.EMAIL_RECIPIENT_HMAC_KEY }}
          NVBES_EMAIL_SNS_CA_BUNDLE_PEM: ${{ secrets.EMAIL_SNS_CA_BUNDLE_PEM }}
          NVBES_SCALEWAY_EMAIL_SECRET_KEY: ${{ secrets.SCALEWAY_EMAIL_SECRET_KEY }}
          SENTRY_DSN: ${{ secrets.EMAIL_SENTRY_DSN }}
          SENTRY_RELEASE: ${{ github.sha }}
          SENTRY_TRACES_SAMPLE_RATE: ${{ vars.EMAIL_SENTRY_TRACES_SAMPLE_RATE }}
        run: |
          export NVBES_EMAIL_DATABASE_URL
          NVBES_EMAIL_DATABASE_URL="$(
            terraform -chdir="$STACK_ROOT" show -json email-runtime-foundation.tfplan |
              jq -er '.planned_values.outputs.email_database_runtime_url.value'
          )"
          runtime_environment=(
            --env NVBES_EMAIL_DATABASE_URL \
            --env NVBES_EMAIL_DATA_ENCRYPTION_KEY \
            --env NVBES_OBSERVABILITY_INTERNAL_TOKEN \
            --env NVBES_EMAIL_PRODUCER_TOKENS \
            --env NVBES_EMAIL_RECIPIENT_HMAC_KEY \
            --env NVBES_EMAIL_SNS_CA_BUNDLE_PEM \
            --env NVBES_SCALEWAY_EMAIL_SECRET_KEY \
            --env SENTRY_DSN \
            --env SENTRY_RELEASE \
            --env SENTRY_TRACES_SAMPLE_RATE \
            --env NVBES_ENVIRONMENT=production \
            --env NVBES_EMAIL_FROM_EMAIL="no-reply@notify.${TF_VAR_base_domain}" \
            --env NVBES_EMAIL_FROM_NAME=nvbes \
            --env NVBES_EMAIL_MESSAGE_ID_DOMAIN="notify.${TF_VAR_base_domain}" \
            --env NVBES_EMAIL_PROVIDER=scaleway \
            --env NVBES_SCALEWAY_EMAIL_PROJECT_ID="$SCW_DEFAULT_PROJECT_ID" \
            --env NVBES_SCALEWAY_EMAIL_REGION=fr-par \
            --env NVBES_EMAIL_QUEUE_ENDPOINT=https://sqs.mnq.fr-par.scaleway.com \
            --env NVBES_EMAIL_QUEUE_URL=https://sqs.mnq.fr-par.scaleway.com/preflight/email-dispatch \
            --env NVBES_EMAIL_QUEUE_REGION=fr-par \
            --env NVBES_EMAIL_QUEUE_ACCESS_KEY=preflight-access-key \
            --env NVBES_EMAIL_QUEUE_SECRET_KEY=preflight-secret-key \
            --env NVBES_EMAIL_SNS_TOPIC_ARN=arn:scw:sns:fr-par:preflight:email-events \
            --env NVBES_EMAIL_RUNTIME_ROLE=ingress \
            --env NVBES_EMAIL_PAYLOAD_RETENTION_DAYS=30 \
            --env NVBES_EMAIL_LEDGER_RETENTION_DAYS=400
          )
          docker run --rm --platform linux/amd64 \
            "${runtime_environment[@]}" \
            "$SOURCE_EMAIL_IMAGE_DIGEST" validate-runtime
          smoke_result="$(
            docker run --rm --platform linux/amd64 \
              "${runtime_environment[@]}" \
              "$SOURCE_EMAIL_IMAGE_DIGEST" error-reporting-smoke
          )"
          jq --exit-status \
            '.status == "sent" and .configured == true and .flushed == true' \
            <<<"$smoke_result" >/dev/null
      - name: Apply reviewed email runtime foundation plan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.EMAIL_TERRAFORM_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.EMAIL_TERRAFORM_STATE_SECRET_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        run: >-
          terraform -chdir="$STACK_ROOT" apply
          -lock-timeout=5m
          email-runtime-foundation.tfplan
      - name: Plan isolated email runtime
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.EMAIL_TERRAFORM_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.EMAIL_TERRAFORM_STATE_SECRET_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          TF_VAR_email_data_encryption_key: ${{ secrets.EMAIL_DATA_ENCRYPTION_KEY }}
          TF_VAR_email_observability_internal_token: ${{ secrets.EMAIL_OBSERVABILITY_INTERNAL_TOKEN }}
          TF_VAR_email_producer_tokens: ${{ secrets.EMAIL_PRODUCER_TOKENS }}
          TF_VAR_email_recipient_hmac_key: ${{ secrets.EMAIL_RECIPIENT_HMAC_KEY }}
          TF_VAR_email_sentry_dsn: ${{ secrets.EMAIL_SENTRY_DSN }}
          TF_VAR_email_sns_ca_bundle_pem: ${{ secrets.EMAIL_SNS_CA_BUNDLE_PEM }}
          TF_VAR_grafana_service_account_token: ${{ secrets.GRAFANA_SERVICE_ACCOUNT_TOKEN }}
          TF_VAR_scaleway_email_secret_key: ${{ secrets.SCALEWAY_EMAIL_SECRET_KEY }}
        run: |
          for attempt in 1 2 3; do
            rm -f "$STACK_ROOT/email-runtime.tfplan"
            if terraform -chdir="$STACK_ROOT" plan \
              -lock-timeout=5m \
              -out=email-runtime.tfplan; then
              exit 0
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "Email runtime plan failed after ${attempt} attempts." >&2
              exit 1
            fi
            retry_delay_seconds=$((attempt * 15))
            echo "Email runtime plan attempt ${attempt} failed; retrying in ${retry_delay_seconds}s." >&2
            sleep "$retry_delay_seconds"
          done
      - name: Apply reviewed email runtime plan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.EMAIL_TERRAFORM_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.EMAIL_TERRAFORM_STATE_SECRET_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_grafana_service_account_token: ${{ secrets.GRAFANA_SERVICE_ACCOUNT_TOKEN }}
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        run: >-
          terraform -chdir="$STACK_ROOT" apply
          -lock-timeout=5m
          email-runtime.tfplan
      - name: Remove duplicate SNS subscriptions for the Email webhook
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.EMAIL_TERRAFORM_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.EMAIL_TERRAFORM_STATE_SECRET_KEY }}
        run: |
          plan_json="$(mktemp)"
          trap 'rm -f "$plan_json"' EXIT
          chmod 600 "$plan_json"
          terraform -chdir="$STACK_ROOT" show -json email-runtime.tfplan > "$plan_json"
          export AWS_ACCESS_KEY_ID="$(
            jq --exit-status --raw-output \
              '.planned_values.outputs.transactional_email_event_management_access_key.value | select(length > 0)' \
              "$plan_json"
          )"
          export AWS_SECRET_ACCESS_KEY="$(
            jq --exit-status --raw-output \
              '.planned_values.outputs.transactional_email_event_management_secret_key.value | select(length > 0)' \
              "$plan_json"
          )"
          [[ -n "$AWS_ACCESS_KEY_ID" ]]
          [[ -n "$AWS_SECRET_ACCESS_KEY" ]]
          export AWS_DEFAULT_REGION=fr-par
          printf '::add-mask::%s\n' "$AWS_ACCESS_KEY_ID"
          printf '::add-mask::%s\n' "$AWS_SECRET_ACCESS_KEY"

          aws_cli_image='public.ecr.aws/aws-cli/aws-cli@sha256:d3f5b7078a71fd7cb488719571c50abd252f4320cdf375601f2d6d40caf97b55'
          topic_arn="$(
            jq --exit-status --raw-output \
              '.planned_values.outputs.transactional_email_event_topic_arn.value' \
              "$plan_json"
          )"
          managed_arn="$(
            jq --exit-status --raw-output \
              '.planned_values.outputs.transactional_email_event_subscription_arn.value' \
              "$plan_json"
          )"
          webhook_endpoint="$(
            jq --exit-status --raw-output \
              '.planned_values.outputs.email_worker_endpoint.value' \
              "$plan_json"
          )/webhooks/scaleway/topics-and-events"
          aws_sns() {
            docker run --rm \
              --env AWS_ACCESS_KEY_ID \
              --env AWS_SECRET_ACCESS_KEY \
              --env AWS_DEFAULT_REGION \
              "$aws_cli_image" \
              --endpoint-url https://sns.mnq.fr-par.scaleway.com \
              sns "$@"
          }

          subscriptions="$(aws_sns list-subscriptions-by-topic --topic-arn "$topic_arn" --output json)"
          while IFS= read -r duplicate_arn; do
            [[ -z "$duplicate_arn" ]] || aws_sns unsubscribe --subscription-arn "$duplicate_arn"
          done < <(
            jq --raw-output \
              --arg endpoint "$webhook_endpoint" \
              --arg managed "$managed_arn" \
              '.Subscriptions[] | select(.Endpoint == $endpoint and .SubscriptionArn != $managed and .SubscriptionArn != "PendingConfirmation") | .SubscriptionArn' \
              <<<"$subscriptions"
          )

          subscriptions="$(aws_sns list-subscriptions-by-topic --topic-arn "$topic_arn" --output json)"
          jq --exit-status \
            --arg endpoint "$webhook_endpoint" \
            --arg managed "$managed_arn" \
            '[.Subscriptions[] | select(.Endpoint == $endpoint and .SubscriptionArn != "PendingConfirmation")] | length == 1 and .[0].SubscriptionArn == $managed' \
            <<<"$subscriptions" >/dev/null
      - name: 'Post-deploy: Verify public email ingress health and readiness'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.EMAIL_TERRAFORM_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.EMAIL_TERRAFORM_STATE_SECRET_KEY }}
        run: |
          endpoint="$(terraform -chdir="$STACK_ROOT" output -raw email_worker_endpoint)"
          echo "Probing liveness on ${endpoint}/health/live..."
          curl --fail --silent --show-error \
            --retry 12 \
            --retry-all-errors \
            --retry-delay 5 \
            "${endpoint}/health/live"
          echo "Probing readiness on ${endpoint}/health/ready..."
          curl --fail --silent --show-error \
            --retry 12 \
            --retry-all-errors \
            --retry-delay 5 \
            "${endpoint}/health/ready"
      - name: 'Post-deploy: Verify protected Prometheus metrics for Grafana Alloy'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.EMAIL_TERRAFORM_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.EMAIL_TERRAFORM_STATE_SECRET_KEY }}
          EMAIL_OBSERVABILITY_INTERNAL_TOKEN: ${{ secrets.EMAIL_OBSERVABILITY_INTERNAL_TOKEN }}
        run: |
          metrics_endpoint="$(terraform -chdir="$STACK_ROOT" output -raw email_worker_metrics_endpoint)"
          anonymous_status="$(
            curl --silent --output /dev/null --write-out '%{http_code}' "$metrics_endpoint"
          )"
          [[ "$anonymous_status" == "401" ]]
          metrics_payload="$(
            curl --fail --silent --show-error \
              --retry 12 \
              --retry-all-errors \
              --retry-delay 5 \
              --header "Authorization: Bearer $EMAIL_OBSERVABILITY_INTERNAL_TOKEN" \
              "$metrics_endpoint"
          )"
          grep -q '^email_queue_depth ' <<<"$metrics_payload"
          grep -q '^email_queue_oldest_age_seconds ' <<<"$metrics_payload"
      - name: 'Post-deploy: Submit one authorized synthetic email'
        if: ${{ vars.EMAIL_SYNTHETIC_SMOKE_ENABLED == 'true' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.EMAIL_TERRAFORM_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.EMAIL_TERRAFORM_STATE_SECRET_KEY }}
          NVBES_EMAIL_GRPC_AUTH_TOKEN: ${{ secrets.EMAIL_SYNTHETIC_PRODUCER_TOKEN }}
          NVBES_EMAIL_SYNTHETIC_RECIPIENT: ${{ secrets.EMAIL_SYNTHETIC_RECIPIENT }}
          NVBES_EMAIL_SYNTHETIC_RUN_ID: deploy-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          export NVBES_EMAIL_DATABASE_URL NVBES_EMAIL_GRPC_ENDPOINT
          NVBES_EMAIL_DATABASE_URL="$(
            terraform -chdir="$STACK_ROOT" output -raw email_database_runtime_url
          )"
          NVBES_EMAIL_GRPC_ENDPOINT="$(
            terraform -chdir="$STACK_ROOT" output -raw email_worker_endpoint
          )"
          smoke_result="$(
            docker run --rm --platform linux/amd64 \
              --env NVBES_EMAIL_GRPC_AUTH_TOKEN \
              --env NVBES_EMAIL_DATABASE_URL \
              --env NVBES_EMAIL_GRPC_ENDPOINT \
              --env NVBES_EMAIL_SYNTHETIC_RECIPIENT \
              --env NVBES_EMAIL_SYNTHETIC_RUN_ID \
              "$SOURCE_EMAIL_IMAGE_DIGEST" synthetic-smoke
          )"
          jq --exit-status \
            '.message_id != "" and .attempts >= 1 and .attempts <= 5 and
             .delivery_state == "delivered" and .processed_provider_events > 0' \
            <<<"$smoke_result" >/dev/null
      - name: 'Post-deploy: Close the bounded Email validation window'
        if: ${{ always() }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.EMAIL_TERRAFORM_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.EMAIL_TERRAFORM_STATE_SECRET_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          TF_VAR_email_data_encryption_key: ${{ secrets.EMAIL_DATA_ENCRYPTION_KEY }}
          TF_VAR_email_observability_internal_token: ${{ secrets.EMAIL_OBSERVABILITY_INTERNAL_TOKEN }}
          TF_VAR_email_producer_tokens: ${{ secrets.EMAIL_PRODUCER_TOKENS }}
          TF_VAR_email_recipient_hmac_key: ${{ secrets.EMAIL_RECIPIENT_HMAC_KEY }}
          TF_VAR_email_sentry_dsn: ${{ secrets.EMAIL_SENTRY_DSN }}
          TF_VAR_email_sns_ca_bundle_pem: ${{ secrets.EMAIL_SNS_CA_BUNDLE_PEM }}
          TF_VAR_scaleway_email_secret_key: ${{ secrets.SCALEWAY_EMAIL_SECRET_KEY }}
        run: |
          export TF_VAR_email_internal_validation_enabled=false
          terraform -chdir="$STACK_ROOT" init \
            -reconfigure \
            -backend-config=backend.ci.hcl \
            -backend-config="bucket=$TERRAFORM_STATE_BUCKET" \
            -backend-config="key=$EMAIL_TERRAFORM_STATE_KEY"
          if [[ "${EMAIL_DEPLOYMENT_IMAGE_READY:-false}" != "true" ]]; then
            [[ "${EMAIL_ROLLBACK_IMAGE:-}" =~ ^${EMAIL_REGISTRY_ENDPOINT}/nvbes-email-worker@sha256:[0-9a-f]{64}$ ]]
            export TF_VAR_email_worker_image="$EMAIL_ROLLBACK_IMAGE"
          fi
          terraform -chdir="$STACK_ROOT" plan \
            -refresh=false \
            -lock-timeout=5m \
            -target=scaleway_container.email_runtime \
            -target=scaleway_container_trigger.email_dispatch \
            -target=scaleway_container_trigger.email_retention \
            -out=email-economic-shutdown.tfplan
          terraform -chdir="$STACK_ROOT" apply \
            -lock-timeout=5m \
            email-economic-shutdown.tfplan

          ingress_id="$(terraform -chdir="$STACK_ROOT" output -raw email_ingress_container_id)"
          dispatch_id="$(terraform -chdir="$STACK_ROOT" output -raw email_dispatch_container_id)"
          ingress_id="${ingress_id#*/}"
          dispatch_id="${dispatch_id#*/}"
          ingress_privacy="$(
            curl --fail --silent --show-error \
              --header "X-Auth-Token: $SCW_SECRET_KEY" \
              "https://api.scaleway.com/containers/v1/regions/fr-par/containers/${ingress_id}" |
              jq --exit-status --raw-output '.privacy'
          )"
          [[ "$ingress_privacy" == "private" ]]
          trigger_count="$(
            curl --fail --silent --show-error \
              --get \
              --header "X-Auth-Token: $SCW_SECRET_KEY" \
              --data-urlencode "container_id=${dispatch_id}" \
              --data-urlencode "order_by=created_at_asc" \
              --data-urlencode "page=1" \
              --data-urlencode "trigger_type=unknown_source_type" \
              "https://api.scaleway.com/containers/v1/regions/fr-par/triggers" |
              jq --exit-status '.total_count'
          )"
          [[ "$trigger_count" == "0" ]]

  build-scan-sign-identity:
    needs: [ci-provenance]
    runs-on: [self-hosted, macOS, ARM64]
    if: ${{ success() && (inputs.service == 'all' || inputs.service == 'identity' || !inputs.service) }}
    timeout-minutes: 60
    environment:
      name: production-ci-cache
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: write
      security-events: write
    env:
      CI_CACHE_REGISTRY: ${{ vars.SCW_CI_CACHE_REGISTRY_ENDPOINT }}
      REGISTRY: ghcr.io
      IMAGE_NAME: nvbes-org/nvbes-identity-service
      REUSED_SOURCE_IMAGE_DIGEST: ${{ vars.IDENTITY_REUSE_SOURCE_IMAGE_DIGEST }}
      SOURCE_COMMIT_SHA: ${{ vars.IDENTITY_REUSE_SOURCE_COMMIT_SHA }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: CI/CD security gate
        run: >-
          node tools/security/check-ci-cd-security.mjs
          --workflow .github/workflows/deploy.yml
      - name: Set deterministic build metadata
        if: env.REUSED_SOURCE_IMAGE_DIGEST == ''
        run: |
          echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"
          echo "LC_ALL=C" >> "$GITHUB_ENV"
          echo "TZ=UTC" >> "$GITHUB_ENV"
      - name: Authenticate to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Authenticate to Scaleway CI cache
        if: env.REUSED_SOURCE_IMAGE_DIGEST == ''
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.CI_CACHE_REGISTRY }}
          username: nologin
          password: ${{ secrets.SCW_CI_CACHE_SECRET_KEY }}
      - name: Set up Buildx
        if: env.REUSED_SOURCE_IMAGE_DIGEST == ''
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build and push immutable image
        if: env.REUSED_SOURCE_IMAGE_DIGEST == ''
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/identity-service/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          build-args: SOURCE_DATE_EPOCH=${{ env.SOURCE_DATE_EPOCH }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: |
            type=registry,ref=${{ env.CI_CACHE_REGISTRY }}/rust-builder:rust-1.91.1-linux-amd64
            type=registry,ref=${{ env.CI_CACHE_REGISTRY }}/identity-service:buildcache
          cache-to: |
            type=registry,ref=${{ env.CI_CACHE_REGISTRY }}/rust-builder:rust-1.91.1-linux-amd64,mode=max,compression=zstd,oci-mediatypes=true,image-manifest=true
            type=registry,ref=${{ env.CI_CACHE_REGISTRY }}/identity-service:buildcache,mode=max,compression=zstd,oci-mediatypes=true,image-manifest=true
      - name: Block vulnerable release images
        if: env.REUSED_SOURCE_IMAGE_DIGEST == ''
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Sign container image
        if: env.REUSED_SOURCE_IMAGE_DIGEST == ''
        run: cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${{ steps.build.outputs.digest }}"
      - name: Verify reusable signed image
        if: env.REUSED_SOURCE_IMAGE_DIGEST != ''
        run: |
          [[ "$REUSED_SOURCE_IMAGE_DIGEST" =~ ^ghcr\.io/nvbes-org/nvbes-identity-service@sha256:[0-9a-f]{64}$ ]]
          [[ "$SOURCE_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/deploy.yml@refs/heads/main"
          cosign verify "$REUSED_SOURCE_IMAGE_DIGEST" \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

  deploy-identity:
    needs: [ci-provenance, build-scan-sign-identity]
    if: ${{ success() && github.ref == 'refs/heads/main' && (inputs.service == 'all' || inputs.service == 'identity' || !inputs.service) }}
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 90
    environment:
      name: production-identity
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
    env:
      SCW_DEFAULT_ORGANIZATION_ID: ${{ vars.SCW_ORGANIZATION_ID }}
      SCW_DEFAULT_PROJECT_ID: ${{ vars.SCW_PROJECT_ID }}
      SCW_DEFAULT_REGION: fr-par
      SCW_DEFAULT_ZONE: fr-par-1
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
      TF_VAR_private_network_id: ${{ vars.SCW_PRIVATE_NETWORK_ID }}
      TF_VAR_grafana_otlp_authorization_header: ${{ secrets.GRAFANA_OTLP_AUTHORIZATION_HEADER }}
      TF_VAR_grafana_otlp_endpoint: ${{ vars.GRAFANA_OTLP_ENDPOINT }}
      TF_VAR_scaleway_organization_id: ${{ vars.SCW_ORGANIZATION_ID }}
      TF_VAR_scaleway_project_id: ${{ vars.SCW_PROJECT_ID }}
      TF_VAR_identity_mfa_encryption_key: ${{ secrets.IDENTITY_MFA_ENCRYPTION_KEY }}
      TF_VAR_identity_mfa_key_version: ${{ vars.IDENTITY_MFA_KEY_VERSION }}
      TF_VAR_identity_metrics_token: ${{ secrets.IDENTITY_METRICS_TOKEN }}
      TF_VAR_identity_synthetic_password: ${{ secrets.IDENTITY_SYNTHETIC_PASSWORD }}
      TF_VAR_identity_synthetic_recovered_password: ${{ secrets.IDENTITY_SYNTHETIC_RECOVERED_PASSWORD }}
      TF_VAR_identity_sentry_dsn: ${{ secrets.IDENTITY_SENTRY_DSN }}
      TF_VAR_identity_sentry_traces_sample_rate: ${{ vars.IDENTITY_SENTRY_TRACES_SAMPLE_RATE }}
      TERRAFORM_STATE_BUCKET: ${{ vars.TERRAFORM_STATE_BUCKET }}
      IDENTITY_TERRAFORM_STATE_KEY: production/identity/terraform.tfstate
      IDENTITY_REGISTRY_ENDPOINT: rg.fr-par.scw.cloud/nvbes-prod-identity
      STACK_ROOT: infrastructure/environments/identity-production
      REUSED_SOURCE_IMAGE_DIGEST: ${{ vars.IDENTITY_REUSE_SOURCE_IMAGE_DIGEST }}
      SOURCE_COMMIT_SHA: ${{ vars.IDENTITY_REUSE_SOURCE_COMMIT_SHA }}
      IDENTITY_DEPLOY_APPROVED_SHA: ${{ vars.IDENTITY_DEPLOY_APPROVED_SHA }}
      IDENTITY_DEPLOY_CONFIRMATION: ${{ vars.IDENTITY_DEPLOY_CONFIRMATION }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: CI/CD security gate
        run: >-
          node tools/security/check-ci-cd-security.mjs
          --workflow .github/workflows/deploy.yml
      - name: Verify protected production candidate
        if: github.ref == 'refs/heads/main'
        run: |
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_SHA" ]]
          [[ "$IDENTITY_DEPLOY_CONFIRMATION" == "deploy-identity-production" ]]
          [[ "$IDENTITY_DEPLOY_APPROVED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$IDENTITY_DEPLOY_APPROVED_SHA" == "$GITHUB_SHA" ]]
          [[ "$SCW_DEFAULT_ORGANIZATION_ID" == "0b726673-849d-4d03-b014-fd39c41942b9" ]]
          [[ "$SCW_DEFAULT_PROJECT_ID" == "e5e54340-62c8-4bd5-af4d-d3d5ea2c8706" ]]
          [[ -n "$TERRAFORM_STATE_BUCKET" ]]
          if [[ -n "$REUSED_SOURCE_IMAGE_DIGEST" || -n "$SOURCE_COMMIT_SHA" ]]; then
            [[ "$REUSED_SOURCE_IMAGE_DIGEST" =~ ^ghcr\.io/nvbes-org/nvbes-identity-service@sha256:[0-9a-f]{64}$ ]]
            [[ "$SOURCE_COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]
            git cat-file -e "${SOURCE_COMMIT_SHA}^{commit}"
            git diff --quiet "$SOURCE_COMMIT_SHA" "$GITHUB_SHA" -- \
              Cargo.toml Cargo.lock \
              apps/identity-service/Cargo.toml \
              apps/identity-service/Dockerfile \
              apps/identity-service/migrations \
              apps/identity-service/src \
              libs/rust
          fi
      - name: Authenticate to GHCR
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: >-
          printf '%s' "$GHCR_TOKEN" |
          docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Resolve immutable Identity image
        env:
          IMAGE_TAG: ghcr.io/nvbes-org/nvbes-identity-service:${{ github.sha }}
        run: |
          if [[ -n "$REUSED_SOURCE_IMAGE_DIGEST" ]]; then
            source_image="$REUSED_SOURCE_IMAGE_DIGEST"
            digest="${source_image##*@}"
          else
            digest="$(docker buildx imagetools inspect "$IMAGE_TAG" --format '{{.Manifest.Digest}}')"
            source_image="ghcr.io/nvbes-org/nvbes-identity-service@${digest}"
          fi
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "SOURCE_IDENTITY_IMAGE_DIGEST=${source_image}" >> "$GITHUB_ENV"
          echo "TF_VAR_identity_image=${IDENTITY_REGISTRY_ENDPOINT}/nvbes-identity-service@${digest}" >> "$GITHUB_ENV"
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Verify signed release identity
        run: |
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/deploy.yml@refs/heads/main"
          cosign verify "$SOURCE_IDENTITY_IMAGE_DIGEST" \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - name: Initialize isolated Identity state
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.IDENTITY_TERRAFORM_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.IDENTITY_TERRAFORM_STATE_SECRET_KEY }}
        run: >-
          terraform -chdir="$STACK_ROOT" init
          -reconfigure
          -backend-config=backend.ci.hcl
          -backend-config="bucket=$TERRAFORM_STATE_BUCKET"
          -backend-config="key=$IDENTITY_TERRAFORM_STATE_KEY"
      - name: Plan private image registry
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.IDENTITY_TERRAFORM_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.IDENTITY_TERRAFORM_STATE_SECRET_KEY }}
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        run: >-
          terraform -chdir="$STACK_ROOT" plan -lock-timeout=5m
          -target=scaleway_registry_namespace.identity
          -out=identity-registry.tfplan
      - name: Apply reviewed private registry plan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.IDENTITY_TERRAFORM_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.IDENTITY_TERRAFORM_STATE_SECRET_KEY }}
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        run: terraform -chdir="$STACK_ROOT" apply -lock-timeout=5m identity-registry.tfplan
      - name: Mirror verified image into private Scaleway registry
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.IDENTITY_TERRAFORM_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.IDENTITY_TERRAFORM_STATE_SECRET_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        run: |
          endpoint="$(terraform -chdir="$STACK_ROOT" output -raw identity_registry_endpoint)"
          [[ "$endpoint" == "$IDENTITY_REGISTRY_ENDPOINT" ]]
          printf '%s' "$SCW_SECRET_KEY" | docker login "$endpoint" --username nologin --password-stdin
          destination="${endpoint}/nvbes-identity-service:${GITHUB_SHA}"
          docker pull --platform linux/amd64 "$SOURCE_IDENTITY_IMAGE_DIGEST"
          docker tag "$SOURCE_IDENTITY_IMAGE_DIGEST" "$destination"
          docker push "$destination"
          digest="$(docker buildx imagetools inspect "$destination" --format '{{.Manifest.Digest}}')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "IDENTITY_IMAGE_DIGEST=${endpoint}/nvbes-identity-service@${digest}" >> "$GITHUB_ENV"
          echo "TF_VAR_identity_image=${endpoint}/nvbes-identity-service@${digest}" >> "$GITHUB_ENV"
      - name: Sign and verify private deployment image
        run: |
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/deploy.yml@refs/heads/main"
          cosign sign --yes "$IDENTITY_IMAGE_DIGEST"
          cosign verify "$IDENTITY_IMAGE_DIGEST" \
            --certificate-identity "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: Plan migration foundation
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.IDENTITY_TERRAFORM_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.IDENTITY_TERRAFORM_STATE_SECRET_KEY }}
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        run: >-
          terraform -chdir="$STACK_ROOT" plan -lock-timeout=5m
          -target=scaleway_job_definition.identity_database_migration
          -target=scaleway_iam_api_key.identity_database_runtime
          -target=scaleway_iam_policy.identity_database_runtime
          -out=identity-migration.tfplan
      - name: Apply reviewed migration foundation plan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.IDENTITY_TERRAFORM_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.IDENTITY_TERRAFORM_STATE_SECRET_KEY }}
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        run: terraform -chdir="$STACK_ROOT" apply -lock-timeout=5m identity-migration.tfplan
      - name: Run database migrations
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.IDENTITY_TERRAFORM_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.IDENTITY_TERRAFORM_STATE_SECRET_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        run: |
          ref="$(terraform -chdir="$STACK_ROOT" output -raw identity_database_migration_job_id)"
          job_id="${ref##*/}"
          response="$(curl --fail-with-body --silent --show-error --request POST \
            --header "X-Auth-Token: $SCW_SECRET_KEY" --header 'Content-Type: application/json' \
            --data '{}' "https://api.scaleway.com/serverless-jobs/v1alpha2/regions/fr-par/job-definitions/${job_id}/start")"
          run_id="$(jq -er '.job_runs[0].id' <<<"$response")"
          state=queued
          for _attempt in {1..60}; do
            response="$(curl --fail-with-body --silent --show-error \
              --header "X-Auth-Token: $SCW_SECRET_KEY" \
              "https://api.scaleway.com/serverless-jobs/v1alpha2/regions/fr-par/job-runs/${run_id}")"
            state="$(jq -er '.state' <<<"$response")"
            case "$state" in
              succeeded) break ;;
              failed|canceled|interrupted) exit 1 ;;
            esac
            sleep 10
          done
          [[ "$state" == "succeeded" ]]
      - name: Plan Identity runtime
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.IDENTITY_TERRAFORM_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.IDENTITY_TERRAFORM_STATE_SECRET_KEY }}
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        run: terraform -chdir="$STACK_ROOT" plan -lock-timeout=5m -out=identity-runtime.tfplan
      - name: Validate production runtime configuration
        env:
          NVBES_IDENTITY_MFA_ENCRYPTION_KEY: ${{ secrets.IDENTITY_MFA_ENCRYPTION_KEY }}
          NVBES_IDENTITY_MFA_KEY_VERSION: ${{ vars.IDENTITY_MFA_KEY_VERSION }}
          NVBES_OTLP_AUTHORIZATION_HEADER: ${{ secrets.GRAFANA_OTLP_AUTHORIZATION_HEADER }}
          NVBES_OTLP_ENDPOINT: ${{ vars.GRAFANA_OTLP_ENDPOINT }}
          NVBES_IDENTITY_METRICS_TOKEN: ${{ secrets.IDENTITY_METRICS_TOKEN }}
          SENTRY_DSN: ${{ secrets.IDENTITY_SENTRY_DSN }}
          SENTRY_RELEASE: ${{ github.sha }}
          SENTRY_TRACES_SAMPLE_RATE: "0.1"
        run: |
          export NVBES_IDENTITY_DATABASE_URL
          NVBES_IDENTITY_DATABASE_URL="$(terraform -chdir="$STACK_ROOT" show -json identity-runtime.tfplan | jq -er '.planned_values.outputs.identity_database_runtime_url.value')"
          docker run --rm --platform linux/amd64 \
            --env NVBES_IDENTITY_DATABASE_URL \
            --env NVBES_IDENTITY_MFA_ENCRYPTION_KEY \
            --env NVBES_IDENTITY_MFA_KEY_VERSION \
            --env NVBES_IDENTITY_METRICS_TOKEN \
            --env NVBES_ENVIRONMENT=production \
            --env NVBES_IDENTITY_BIND_ADDR=0.0.0.0:8080 \
            --env NVBES_OTLP_AUTHORIZATION_HEADER \
            --env NVBES_OTLP_ENDPOINT \
            --env SENTRY_DSN \
            --env SENTRY_RELEASE \
            --env SENTRY_TRACES_SAMPLE_RATE \
            "$SOURCE_IDENTITY_IMAGE_DIGEST" validate-runtime
      - name: Apply reviewed Identity runtime plan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.IDENTITY_TERRAFORM_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.IDENTITY_TERRAFORM_STATE_SECRET_KEY }}
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        run: terraform -chdir="$STACK_ROOT" apply -lock-timeout=5m identity-runtime.tfplan
      - name: Prove Identity Sentry delivery
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.IDENTITY_TERRAFORM_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.IDENTITY_TERRAFORM_STATE_SECRET_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        run: |
          job_ref="$(terraform -chdir="$STACK_ROOT" output -raw identity_error_reporting_smoke_job_id)"
          job_id="${job_ref##*/}"
          payload="$(jq --null-input --arg release "$GITHUB_SHA" \
            --arg sample_rate "$TF_VAR_identity_sentry_traces_sample_rate" \
            '{environment_variables: {
              NVBES_ENVIRONMENT: "production",
              SENTRY_RELEASE: $release,
              SENTRY_TRACES_SAMPLE_RATE: $sample_rate
            }}')"
          response="$(curl --fail-with-body --silent --show-error --request POST \
            --header "X-Auth-Token: $SCW_SECRET_KEY" --header 'Content-Type: application/json' \
            --data "$payload" \
            "https://api.scaleway.com/serverless-jobs/v1alpha2/regions/fr-par/job-definitions/${job_id}/start")"
          run_id="$(jq -er '.job_runs[0].id' <<<"$response")"
          state=queued
          for _attempt in {1..60}; do
            response="$(curl --fail-with-body --silent --show-error \
              --header "X-Auth-Token: $SCW_SECRET_KEY" \
              "https://api.scaleway.com/serverless-jobs/v1alpha2/regions/fr-par/job-runs/${run_id}")"
            state="$(jq -er '.state' <<<"$response")"
            case "$state" in
              succeeded) break ;;
              failed|canceled|interrupted) jq -r '.reason // "unknown"' <<<"$response" >&2; exit 1 ;;
            esac
            sleep 10
          done
          [[ "$state" == "succeeded" ]]
      - name: Prove synthetic authentication and recovery
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.IDENTITY_TERRAFORM_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.IDENTITY_TERRAFORM_STATE_SECRET_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
        run: tools/deployment/prove-identity-synthetic-auth.sh
      - name: Verify public Identity health and readiness
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.IDENTITY_TERRAFORM_STATE_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.IDENTITY_TERRAFORM_STATE_SECRET_KEY }}
          IDENTITY_METRICS_TOKEN: ${{ secrets.IDENTITY_METRICS_TOKEN }}
        run: tools/deployment/prove-identity-public-runtime.sh

  build-scan-sign-trust-risk:
    needs: [ci-provenance]
