name: account production release gate

on:
  workflow_dispatch:

concurrency:
  group: account-production-release
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  release-account:
    runs-on: [self-hosted, macOS, ARM64]
    timeout-minutes: 180
    environment:
      name: production-account
      url: ${{ vars.NVBES_PRODUCTION_WEB_BASE_URL }}
    env:
      ACCOUNT_PRODUCTION_DENIED_ORIGINS: ${{ vars.ACCOUNT_PRODUCTION_DENIED_ORIGINS }}
      ACCOUNT_ACCEPTANCE_TRUSTED_KEY_ID: ${{ vars.ACCOUNT_ACCEPTANCE_TRUSTED_KEY_ID }}
      ACCOUNT_ACCEPTANCE_TRUSTED_PUBLIC_KEY_SHA256: ${{ vars.ACCOUNT_ACCEPTANCE_TRUSTED_PUBLIC_KEY_SHA256 }}
      ACCOUNT_DEPLOYMENT_EXPECTED_COMPONENT_UIDS: ${{ vars.ACCOUNT_DEPLOYMENT_EXPECTED_COMPONENT_UIDS }}
      ACCOUNT_DEPLOYMENT_TRUSTED_KEY_ID: ${{ vars.ACCOUNT_DEPLOYMENT_TRUSTED_KEY_ID }}
      ACCOUNT_DEPLOYMENT_TRUSTED_PUBLIC_KEY_SHA256: ${{ vars.ACCOUNT_DEPLOYMENT_TRUSTED_PUBLIC_KEY_SHA256 }}
      CI: 'true'
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/nvbes_test
      NVBES_ALLOW_DESTRUCTIVE_TEST_DATABASE: account-quality-v1
      NVBES_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/nvbes_test
      NVBES_ENV: test
      NVBES_FAPI_CONFORMANCE_EVIDENCE_SHA256: ${{ vars.NVBES_FAPI_CONFORMANCE_EVIDENCE_SHA256 }}
      NVBES_FAPI_HIGH_ASSURANCE_ENABLED: ${{ vars.NVBES_FAPI_HIGH_ASSURANCE_ENABLED }}
      NVBES_PRODUCTION_ALLOWED_ORIGINS: ${{ vars.NVBES_PRODUCTION_ALLOWED_ORIGINS }}
      NVBES_PRODUCTION_API_BASE_URL: ${{ vars.NVBES_PRODUCTION_API_BASE_URL }}
      NVBES_PRODUCTION_WEB_BASE_URL: ${{ vars.NVBES_PRODUCTION_WEB_BASE_URL }}
      NVBES_RELEASE_REF: ${{ github.ref }}
      NVBES_RELEASE_REF_NAME: ${{ github.ref_name }}
      NVBES_RELEASE_REF_TYPE: ${{ github.ref_type }}
      NVBES_RELEASE_SHA: ${{ github.sha }}
      NVBES_REDIS_URL: redis://127.0.0.1:6379/15
      NVBES_STAGING_ACCOUNT_EMAIL: ${{ vars.NVBES_STAGING_ACCOUNT_EMAIL }}
      NVBES_STAGING_ALLOWED_API_ORIGINS: ${{ vars.NVBES_STAGING_ALLOWED_API_ORIGINS }}
      NVBES_STAGING_ALLOWED_WEB_ORIGINS: ${{ vars.NVBES_STAGING_ALLOWED_WEB_ORIGINS }}
      NVBES_STAGING_API_BASE_URL: ${{ vars.NVBES_STAGING_API_BASE_URL }}
      NVBES_STAGING_WEB_BASE_URL: ${{ vars.NVBES_STAGING_WEB_BASE_URL }}
      NX_DAEMON: false
      RELEASE_APPROVED: production
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: nvbes_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nvbes_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.ref }}
      - name: Configure ephemeral Account release paths
        run: |
          {
            echo "ACCOUNT_ACCEPTANCE_EVIDENCE_FILE=$RUNNER_TEMP/account-release-evidence/acceptance-evidence.json"
            echo "ACCOUNT_ACCEPTANCE_EVIDENCE_SIGNATURE_FILE=$RUNNER_TEMP/account-release-evidence/acceptance-evidence.sig"
            echo "ACCOUNT_ACCEPTANCE_TRUSTED_PUBLIC_KEY_FILE=$RUNNER_TEMP/account-release-trust/acceptance-public-key.pem"
            echo "ACCOUNT_DEPLOYMENT_TRUSTED_PUBLIC_KEY_FILE=$RUNNER_TEMP/account-release-trust/deployment-public-key.pem"
            echo "ACCOUNT_RELEASE_EVIDENCE_ROOT=$RUNNER_TEMP/account-release-evidence"
            echo "ACCOUNT_RELEASE_REPORT_ROOT=$RUNNER_TEMP/account-release-report"
            echo "ACCOUNT_RELEASE_TRUST_ROOT=$RUNNER_TEMP/account-release-trust"
            echo "NVBES_FAPI_CONFORMANCE_EVIDENCE_FILE=$RUNNER_TEMP/account-release-evidence/fapi-conformance.json"
          } >> "$GITHUB_ENV"
      - name: Validate immutable Account RC tag
        env:
          GH_API_URL: ${{ github.api_url }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: node tools/account-quality/verify-account-release-ref.mjs
      - name: CI/CD security gate
        run: node tools/security/check-ci-cd-security.mjs
      - name: Install xmlsec system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxmlsec1-dev libxmlsec1-openssl xmlsec1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.17.0 --activate
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
      - name: Install Account Chromium browser
        run: pnpm --dir apps/account-web exec playwright install --with-deps chromium
      - name: Validate exact release and evidence source
        env:
          ACCOUNT_ACCEPTANCE_EVIDENCE_RUN_ID: ${{ vars.ACCOUNT_ACCEPTANCE_EVIDENCE_RUN_ID }}
          EXPECTED_RELEASE_TAG: ${{ github.ref_name }}
          GH_API_URL: ${{ github.api_url }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$(git rev-parse HEAD)" == "$NVBES_RELEASE_SHA" ]]
          node --input-type=module <<'NODE'
          const {
            ACCOUNT_ACCEPTANCE_EVIDENCE_RUN_ID: runId,
            EXPECTED_RELEASE_TAG: expectedTag,
            GH_API_URL: apiUrl,
            GH_REPOSITORY: repository,
            GH_TOKEN: token,
            NVBES_RELEASE_SHA: release,
          } = process.env;
          if (!/^[1-9][0-9]*$/u.test(runId ?? "")) {
            throw new Error("Protected evidence run ID is missing or invalid.");
          }
          const response = await fetch(
            `${apiUrl}/repos/${repository}/actions/runs/${runId}`,
            {
              headers: {
                Accept: "application/vnd.github+json",
                Authorization: `Bearer ${token}`,
                "X-GitHub-Api-Version": "2022-11-28",
              },
              redirect: "error",
            },
          );
          if (!response.ok) {
            throw new Error(`Evidence workflow lookup failed with HTTP ${response.status}.`);
          }
          const run = await response.json();
          if (
            run.repository?.full_name !== repository ||
            run.path !== ".github/workflows/account-acceptance-ingest.yml" ||
            run.head_branch !== expectedTag ||
            run.head_sha !== release ||
            run.conclusion !== "success" ||
            !["push", "workflow_dispatch"].includes(run.event)
          ) {
            throw new Error("Evidence workflow is not a successful trusted run for this SHA.");
          }
          NODE
      - name: Download exact-SHA acceptance evidence
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          name: account-acceptance-${{ github.sha }}
          path: ${{ runner.temp }}/account-release-evidence
          repository: ${{ github.repository }}
          run-id: ${{ vars.ACCOUNT_ACCEPTANCE_EVIDENCE_RUN_ID }}
      - name: Materialize protected trust roots
        env:
          ACCEPTANCE_TRUSTED_PUBLIC_KEY_PEM: ${{ secrets.ACCOUNT_ACCEPTANCE_TRUSTED_PUBLIC_KEY_PEM }}
          DEPLOYMENT_TRUSTED_PUBLIC_KEY_PEM: ${{ secrets.ACCOUNT_DEPLOYMENT_TRUSTED_PUBLIC_KEY_PEM }}
        run: |
          umask 077
          mkdir -p "$ACCOUNT_RELEASE_TRUST_ROOT" "$ACCOUNT_RELEASE_REPORT_ROOT"
          [[ -n "$ACCEPTANCE_TRUSTED_PUBLIC_KEY_PEM" ]]
          [[ -n "$DEPLOYMENT_TRUSTED_PUBLIC_KEY_PEM" ]]
          printf '%s' "$ACCEPTANCE_TRUSTED_PUBLIC_KEY_PEM" > "$ACCOUNT_ACCEPTANCE_TRUSTED_PUBLIC_KEY_FILE"
          printf '%s' "$DEPLOYMENT_TRUSTED_PUBLIC_KEY_PEM" > "$ACCOUNT_DEPLOYMENT_TRUSTED_PUBLIC_KEY_FILE"
          [[ -f "$ACCOUNT_ACCEPTANCE_EVIDENCE_FILE" && ! -L "$ACCOUNT_ACCEPTANCE_EVIDENCE_FILE" ]]
          [[ -f "$ACCOUNT_ACCEPTANCE_EVIDENCE_SIGNATURE_FILE" && ! -L "$ACCOUNT_ACCEPTANCE_EVIDENCE_SIGNATURE_FILE" ]]
      - name: Run exact production release gate
        id: release_gate
        env:
          NVBES_STAGING_ACCOUNT_PASSWORD: ${{ secrets.NVBES_STAGING_ACCOUNT_PASSWORD }}
        run: |
          scripts/release-gate.sh production 2>&1 | tee "$ACCOUNT_RELEASE_REPORT_ROOT/gate.log"
      - name: Write immutable release report
        if: always()
        env:
          EVIDENCE_RUN_ID: ${{ vars.ACCOUNT_ACCEPTANCE_EVIDENCE_RUN_ID }}
          GATE_OUTCOME: ${{ steps.release_gate.outcome }}
          RELEASE_RUN_ATTEMPT: ${{ github.run_attempt }}
          RELEASE_RUN_ID: ${{ github.run_id }}
        run: |
          mkdir -p "$ACCOUNT_RELEASE_REPORT_ROOT"
          node --input-type=module <<'NODE'
          import { writeFile } from "node:fs/promises";
          import path from "node:path";
          const release = process.env.NVBES_RELEASE_SHA;
          const report = {
            environment: "production-account",
            evidenceArtifact: `account-acceptance-${release}`,
            evidenceRunId: process.env.EVIDENCE_RUN_ID,
            generatedAt: new Date().toISOString(),
            outcome: process.env.GATE_OUTCOME || "not-run",
            release,
            runAttempt: Number(process.env.RELEASE_RUN_ATTEMPT),
            runId: Number(process.env.RELEASE_RUN_ID),
            schemaVersion: 1,
          };
          await writeFile(
            path.join(process.env.ACCOUNT_RELEASE_REPORT_ROOT, "release-report.json"),
            `${JSON.stringify(report, null, 2)}\n`,
            { encoding: "utf8", mode: 0o600 },
          );
          NODE
      - name: Scrub evidence and trust roots
        if: always()
        run: |
          for directory in "$ACCOUNT_RELEASE_EVIDENCE_ROOT" "$ACCOUNT_RELEASE_TRUST_ROOT"; do
            if [[ -d "$directory" ]]; then
              [[ "$directory" == "$RUNNER_TEMP/account-release-evidence" || "$directory" == "$RUNNER_TEMP/account-release-trust" ]]
              find "$directory" -depth -mindepth 1 -delete
              rmdir "$directory"
            fi
          done
      - name: Upload immutable release report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          if-no-files-found: error
          name: account-release-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/account-release-report/
          retention-days: 90
