[graph]
all-features = true
exclude-dev = false

[advisories]
version = 2
yanked = "deny"
ignore = [
  # Local/dev RSA key material generation only; no network PKCS#1 decrypt path.
  "RUSTSEC-2023-0071",
  # Pyroscope symbol parsing (object -> ruzstd); no untrusted zstd input decoded.
  "RUSTSEC-2026-0344",
  # Test fixtures only (nvbes-test-utils -> serde_yaml_ng -> unsafe-libyaml); unmaintained.
  "RUSTSEC-2024-0449",
  # MaxMind GeoLite in-memory zip reading only (read_to_end); no disk extraction via ZipArchive::extract.
  "RUSTSEC-2026-0367",
  "RUSTSEC-2026-0368",
  "RUSTSEC-2026-0369",
]

[licenses]
version = 2
confidence-threshold = 0.8
unused-allowed-license = "allow"
allow = [
  "AGPL-3.0-only",
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
