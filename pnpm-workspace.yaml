packages:
  - apps/*
  - libs/ts/*

catalog:
  react: ^19.2.8
  react-dom: ^19.2.8
  '@tanstack/react-query': ^5.102.8
  '@tanstack/react-query-devtools': ^5.101.4
  '@tanstack/react-router': ^1.170.33
  '@tanstack/react-router-devtools': ^1.167.1
  typescript: ^7.0.2
  vite: ^8.2.2
  vite-plus: ^0.3.1
  '@vitejs/plugin-react': ^6.0.5
  react-router-dom: ^7.15.1
  tsx: ^4.23.13
  '@tailwindcss/vite': ^4.3.3
  tailwindcss: ^4.3.3
  '@sentry/browser': ^10.73.0

allowBuilds:
  '@bufbuild/buf': false
  '@posthog/cli': true
  '@sentry/cli': false
  core-js: true
  esbuild: true
  lefthook: true
  msw: true
  nx: true
  protobufjs: true
  sharp: true
  workerd: true

overrides:
  '@babel/core@<8': 7.29.7
  '@hono/node-server': 2.0.12
  axios: 1.18.1
  brace-expansion: 5.0.9
  dompurify: 3.4.13
  esbuild: 0.28.1
  fast-uri: 3.1.6
  form-data: 4.0.6
  hono: 4.13.5
  js-yaml: 4.3.2
  postcss: 8.5.23
  qs: 6.16.0
  sharp: 0.35.4
  smol-toml: 1.7.1
  tmp: 0.2.7
  undici@7: 7.29.0
  vitest: 4.1.11
  yaml: '>=2.8.3'

peerDependencyRules:
  allowedVersions:
    # vite-plus aliases `vite` to its own compatible core package. pnpm otherwise
    # compares the core's 0.x version with Vitest's upstream Vite range.
    vite: '0.3.1 || ^6.0.0 || ^7.0.0 || ^8.0.0'

minimumReleaseAgeExclude:
  - '@voidzero-dev/vite-plus-core@0.3.1'
  - '@voidzero-dev/vite-plus-darwin-arm64@0.3.1'
  - '@voidzero-dev/vite-plus-darwin-x64@0.3.1'
  - '@voidzero-dev/vite-plus-linux-arm64-gnu@0.3.1'
  - '@voidzero-dev/vite-plus-linux-arm64-musl@0.3.1'
  - '@voidzero-dev/vite-plus-linux-x64-gnu@0.3.1'
  - '@voidzero-dev/vite-plus-linux-x64-musl@0.3.1'
  - '@voidzero-dev/vite-plus-win32-arm64-msvc@0.3.1'
  - '@voidzero-dev/vite-plus-win32-x64-msvc@0.3.1'
  - vite-plus@0.3.1
  - '@hono/node-server@2.0.12'

nodeLinker: hoisted

patchedDependencies:
  '@stryker-mutator/instrumenter@10.0.0': patches/@stryker-mutator__instrumenter@10.0.0.patch
