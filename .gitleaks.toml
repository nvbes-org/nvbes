title = "nvbes gitleaks policy"

[extend]
useDefault = true

[allowlist]
description = "Generated and vendored trees do not contain repository-owned credentials."
paths = [
  '''^libs/ts/http-client/src/http\.request-e2ee\.test\.ts$''',
  '''(^|/)node_modules/''',
  '''(^|/)target/''',
  '''^vendor/''',
  '''^infrastructure/local/observability/app-logs/''',
]
