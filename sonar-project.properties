# ==============================================================================
# SonarCloud Configuration - nvbes
# Strict Quality, Security, Reliability & Maintainability Standards
# ==============================================================================

# Project identification
sonar.projectKey=nvbes-org_nvbes
sonar.organization=nvbes-org
sonar.projectName=nvbes
sonar.projectVersion=0.1.0
sonar.sourceEncoding=UTF-8

# Source and Test directories
sonar.sources=apps,libs,tools,scripts,infrastructure
sonar.tests=apps,libs,tools
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.test.mjs,**/*.test.js,**/*.spec.ts,**/*.tests.rs,apps/**/tests/**,tools/**/*.test.mjs

# ------------------------------------------------------------------------------
# Exclusions
# Strict exclusion of archived products (archive/) per V1 product boundary
# and exclusion of generated, binary, temporary and third-party build outputs
# ------------------------------------------------------------------------------
sonar.exclusions=\
  archive/**,\
  **/node_modules/**,\
  **/target/**,\
  **/.nx/**,\
  **/.temp/**,\
  **/dist/**,\
  **/build/**,\
  **/*.min.js,\
  **/*.bundle.js,\
  **/*.map,\
  **/generated/**,\
  **/*.generated.*,\
  libs/ts/identity-sdk-core/src/generated/**,\
  infrastructure/local/observability/app-logs/**,\
  **/*.cdx.json,\
  **/*.sarif,\
  **/*.profraw,\
  **/*.profdata

sonar.test.exclusions=\
  archive/**

# ------------------------------------------------------------------------------
# Coverage exclusions
# Do not count tests, mocks, fixtures, generated code, tooling or docs towards
# production code coverage metrics
# ------------------------------------------------------------------------------
sonar.coverage.exclusions=\
  archive/**,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.test.mjs,\
  **/*.test.js,\
  **/*.spec.ts,\
  **/*.tests.rs,\
  **/*.test_support.rs,\
  **/tests/**,\
  **/fixtures/**,\
  **/mocks/**,\
  **/test_support/**,\
  **/generated/**,\
  **/*.generated.*,\
  libs/ts/identity-sdk-core/src/generated/**,\
  tools/**,\
  scripts/**,\
  infrastructure/**,\
  docs/**

# ------------------------------------------------------------------------------
# Duplication (CPD) exclusions
# ------------------------------------------------------------------------------
sonar.cpd.exclusions=\
  archive/**,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.test.mjs,\
  **/*.spec.ts,\
  **/*.tests.rs,\
  **/*.test_support.rs,\
  **/generated/**,\
  **/*.generated.*,\
  libs/ts/identity-sdk-core/src/generated/**,\
  contracts/**

# ------------------------------------------------------------------------------
# Multi-Language Code Coverage Reports
# ------------------------------------------------------------------------------
# Rust coverage (LCOV format generated via cargo llvm-cov report --lcov)
sonar.rust.lcov.reportPaths=.temp/rust/lcov.info

# JavaScript / TypeScript coverage (LCOV format)
sonar.javascript.lcov.reportPaths=coverage/lcov.info,libs/ts/*/coverage/lcov.info

# ------------------------------------------------------------------------------
# Lint & Quality Reports (Rust Clippy)
# ------------------------------------------------------------------------------
sonar.rust.clippyReport.reportPaths=.temp/rust/clippy-report.json

# ------------------------------------------------------------------------------
# Vulnerabilities, CVEs & Security Hotspots (SARIF ingestion)
# Imports findings from OSV-Scanner, Trivy and Gitleaks
# ------------------------------------------------------------------------------
sonar.sarifReportPaths=osv-results.sarif,trivy-results.sarif,gitleaks-results.sarif

# ------------------------------------------------------------------------------
# Maximum Strictness: Quality Gate Enforcement
# Synchronously fail the build step if Quality Gate criteria are not satisfied
# ------------------------------------------------------------------------------
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# ------------------------------------------------------------------------------
# Issue Filter Multicriteria
#
# e1/e2 - javascript:S4036
# In CLI developer and CI orchestration tooling (tools/** and scripts/**), system
# binaries ('git', 'cargo', 'pnpm', 'node') rely on PATH resolution to remain portable
# between macOS (/opt/homebrew/bin) and Ubuntu CI (/usr/bin, ~/.cargo/bin).
#
# e3/e4 - jssecurity:S8707 (Path Traversal via faulty LLM-supplied CLI arguments)
# The rule taints every file path derived from command-line arguments or the
# environment, whatever validation is applied. For the local developer and CI
# orchestration tooling the caller-supplied path *is* the interface: CI jobs
# pass absolute evidence paths (e.g. /evidence/comparison.json) and operators
# pass workspace paths, so the path cannot be constrained to a fixed root.
# Those tools already confine every resolved path to their workspace root or to
# the evidence directory and reject traversal segments and control characters.
# None of them runs in the deployed services - they execute only in this
# repository's own CI jobs and operator terminals - so the remote-input threat
# model of the rule does not apply to this path set.
#
# e5 - jssecurity:S8476 (Client-Side Request Forgery via unsanitized user input)
# The fallback dispatcher reuses identifiers read from GitHub API responses
# (job ids, branch, head SHA, workflow path, actor) as path segments of further
# GitHub API calls. Every request is pinned to the single https://api.github.com
# origin with a fixed /repos/<owner>/<repo>/ prefix, rejects traversal segments
# and CRLF, and only ever reuses values inside path segments; the "compromised
# remote server" of the rule's threat model is the very GitHub API this script
# already trusts with its installation token, so reusing its response fields
# grants no additional authority.
# ------------------------------------------------------------------------------
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5
sonar.issue.ignore.multicriteria.e1.ruleKey=javascript:S4036
sonar.issue.ignore.multicriteria.e1.resourceKey=tools/**
sonar.issue.ignore.multicriteria.e2.ruleKey=javascript:S4036
sonar.issue.ignore.multicriteria.e2.resourceKey=scripts/**
sonar.issue.ignore.multicriteria.e3.ruleKey=jssecurity:S8707
sonar.issue.ignore.multicriteria.e3.resourceKey=tools/**
sonar.issue.ignore.multicriteria.e4.ruleKey=jssecurity:S8707
sonar.issue.ignore.multicriteria.e4.resourceKey=scripts/**
sonar.issue.ignore.multicriteria.e5.ruleKey=jssecurity:S8476
sonar.issue.ignore.multicriteria.e5.resourceKey=tools/ci/runner-fallback.mjs

