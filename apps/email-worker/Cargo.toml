[package]
name = "nvbes-email-worker"
edition.workspace = true
license.workspace = true
version.workspace = true

[features]
database-tests = []

[[bin]]
name = "nvbes-email-worker"
path = "src/main.rs"

[dependencies]
aes-gcm.workspace = true
anyhow.workspace = true
aws-sdk-sqs = { version = "=1.90.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
axum.workspace = true
base64.workspace = true
chrono.workspace = true
hex.workspace = true
hmac.workspace = true
lettre.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
nvbes-core = { path = "../../libs/rust/core" }
nvbes-email = { path = "../../libs/rust/email" }
nvbes-email-scaleway = { path = "../../libs/rust/adapters/email-scaleway" }
nvbes-observability = { path = "../../libs/rust/observability", features = ["otlp"] }
openssl = "0.10"
prost = "0.14.4"
prost-types = "0.14"
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
tokio.workspace = true
tonic.workspace = true
tonic-health.workspace = true
tracing.workspace = true
thiserror.workspace = true
uuid.workspace = true

[dev-dependencies]
tower = "0.5"
