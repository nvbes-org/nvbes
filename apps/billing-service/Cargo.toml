[package]
name = "nvbes-billing-service"
edition.workspace = true
license.workspace = true
version.workspace = true

[features]
database-tests = []

[[bin]]
name = "nvbes-billing-service"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
chrono.workspace = true
hex.workspace = true
hmac.workspace = true
jsonwebtoken = { version = "10.3.0", default-features = false, features = ["aws_lc_rs", "use_pem"] }
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
nvbes-billing = { path = "../../libs/rust/billing" }
nvbes-core = { path = "../../libs/rust/core" }
nvbes-email = { path = "../../libs/rust/email" }
nvbes-observability = { path = "../../libs/rust/observability", features = ["otlp"] }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tonic.workspace = true
tonic-health.workspace = true
prost = "0.14.4"
prost-types = "0.14"
tower.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
openssl.workspace = true
tokio-stream = { version = "0.1.18", features = ["net"] }
tower.workspace = true
wiremock = "0.6"

[[test]]
name = "cli-coverage"
path = "src/billing.cli.coverage.tests.rs"
