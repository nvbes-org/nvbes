[package]
name = "nvbes-api"
edition.workspace = true
license.workspace = true
version.workspace = true
publish.workspace = true

[[bin]]
name = "nvbes-api"
path = "src/main.rs"

[lib]
name = "nvbes_api"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
chrono.workspace = true
metrics-exporter-prometheus.workspace = true
nvbes-account-service = { path = "../account-service" }
nvbes-billing-service = { path = "../billing-service" }
nvbes-consent = { path = "../../libs/rust/consent" }
nvbes-core = { path = "../../libs/rust/core" }
nvbes-identity-service = { path = "../identity-service" }
nvbes-observability = { path = "../../libs/rust/observability", features = ["otlp"] }
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tower.workspace = true
tower-http = { workspace = true, features = ["cors", "trace", "compression-full"] }
tracing.workspace = true
utoipa.workspace = true

[dev-dependencies]
tower = "0.5"

[lints]
workspace = true
