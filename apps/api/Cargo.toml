[package]
name = "nvbes-api"
edition.workspace = true
license.workspace = true
version.workspace = true
publish.workspace = true

[features]
database-tests = []

[[bin]]
name = "nvbes-api"
path = "src/main.rs"

[lib]
name = "nvbes_api"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
axum.workspace = true
base64.workspace = true
chrono.workspace = true
hex.workspace = true
ipnet.workspace = true
metrics-exporter-prometheus.workspace = true
nvbes-account-service = { path = "../../libs/rust/account" }
nvbes-core = { path = "../../libs/rust/core" }
nvbes-identity-sdk = { path = "../../libs/rust/identity-sdk-backend" }
nvbes-identity-service = { path = "../../libs/rust/identity" }
nvbes-observability = { path = "../../libs/rust/observability", features = ["otlp"] }
rand.workspace = true
reqwest.workspace = true
rsa = { version = "0.9.10", features = ["pem"] }
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tower = { workspace = true }
tower-http = { workspace = true, features = ["trace", "catch-panic", "compression-full"] }
tracing.workspace = true
utoipa.workspace = true
uuid.workspace = true
webauthn-rs.workspace = true

[dev-dependencies]
tower = "0.5"

[lints]
workspace = true
