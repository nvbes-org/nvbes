[package]
name = "nvbes-identity-service"
edition.workspace = true
license.workspace = true
version.workspace = true

[features]
database-tests = []

[[bin]]
name = "nvbes-identity-service"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
aes-gcm.workspace = true
axum.workspace = true
base64.workspace = true
chrono.workspace = true
jsonwebtoken = { version = "10.3.0", default-features = false, features = ["aws_lc_rs", "use_pem"] }
metrics-exporter-prometheus.workspace = true
nvbes-core = { path = "../../libs/rust/core" }
nvbes-email = { path = "../../libs/rust/email" }
nvbes-observability = { path = "../../libs/rust/observability", features = ["otlp"] }
rand.workspace = true
reqwest.workspace = true
openssl.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
prost-types = "0.14"
tokio-stream = { version = "0.1.18", features = ["net"] }
tonic.workspace = true
tower = "0.5"
