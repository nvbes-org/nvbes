[package]
name = "nvbes-billing-worker"
edition.workspace = true
license.workspace = true
version.workspace = true

[features]
database-tests = []

[[bin]]
name = "nvbes-billing-worker"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
aws-sdk-sqs = { version = "=1.109.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
axum.workspace = true
chrono.workspace = true
hex.workspace = true
hmac.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
nvbes-billing = { path = "../../libs/rust/billing" }
nvbes-core = { path = "../../libs/rust/core" }
nvbes-email = { path = "../../libs/rust/email" }
nvbes-observability = { path = "../../libs/rust/observability", features = ["otlp"] }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tower.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
tower.workspace = true
