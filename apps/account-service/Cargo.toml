[package]
name = "nvbes-account-service"
edition.workspace = true
license.workspace = true
version.workspace = true

[[bin]]
name = "nvbes-account-service"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
argon2.workspace = true
async-trait = "0.1"
axum.workspace = true
axum-server.workspace = true
base64.workspace = true
ipnet.workspace = true
chrono.workspace = true
nvbes-core = { path = "../../libs/rust/core" }
nvbes-dpop = { path = "../../libs/rust/dpop" }
nvbes-redis = { path = "../../libs/rust/redis" }
nvbes-audit = { path = "../../libs/rust/audit" }
nvbes-email = { path = "../../libs/rust/email" }
nvbes-region = { path = "../../libs/rust/region" }
nvbes-tenancy = { path = "../../libs/rust/tenancy" }
nvbes-observability = { path = "../../libs/rust/observability", features = ["otlp", "profiling"] }
nvbes-product-analytics = { path = "../../libs/rust/product-analytics" }
nvbes-product-account = { path = "../../libs/rust/products/account" }
nvbes-analytics-posthog = { path = "../../libs/rust/adapters-cloud/analytics-posthog" }
hex = "0.4"
hmac.workspace = true
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto"] }
libxml = "0.3.8"
metrics.workspace = true
password-hash.workspace = true
rand.workspace = true
rand_core = "0.6"
reqwest.workspace = true
roxmltree.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx = { workspace = true, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }
tokio.workspace = true
tower = "0.5"
tower-http = { workspace = true }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["json"] }
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true }
uuid.workspace = true
oauth2 = "5.0.0"
openssl = { version = "0.10", features = ["vendored"] }
webauthn-rs = { workspace = true }
webauthn-rs-core = "0.5.5"
xmlsec = "0.3.0"
flate2 = "1.1.9"
url = "2.5"
urlencoding.workspace = true
