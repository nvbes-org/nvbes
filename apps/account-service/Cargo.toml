[package]
name = "nvbes-account-service"
edition.workspace = true
license.workspace = true
version.workspace = true

[features]
database-tests = []

[[bin]]
name = "nvbes-account-service"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
chrono.workspace = true
jsonwebtoken = { version = "10.3.0", default-features = false, features = ["aws_lc_rs", "use_pem"] }
metrics-exporter-prometheus.workspace = true
nvbes-identity-sdk = { path = "../../libs/rust/identity-sdk-backend" }
nvbes-core = { path = "../../libs/rust/core" }
nvbes-dpop = { path = "../../libs/rust/dpop", features = ["resource-server"] }
nvbes-observability = { path = "../../libs/rust/observability", features = ["otlp"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle = "2.6.1"
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
rsa = "0.9.10"
tower = "0.5"
