[package]
name = "nvbes-account-service"
edition.workspace = true
license.workspace = true
version.workspace = true

[features]
database-tests = []

[[bin]]
name = "nvbes-account-service"
path = "src/main.rs"

[[test]]
name = "maintenance-cli"
path = "src/account.maintenance.tests.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
chrono.workspace = true
jsonwebtoken = { version = "11.0.0", default-features = false, features = ["aws_lc_rs", "use_pem"] }
metrics-exporter-prometheus.workspace = true
nvbes-observability = { path = "../../libs/rust/observability", features = ["otlp"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
tower = "0.5"
