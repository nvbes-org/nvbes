[package]
name = "nvbes-account-service"
edition.workspace = true
license.workspace = true
version.workspace = true
publish.workspace = true

[features]
database-tests = []

[lib]
name = "nvbes_account_service"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
axum.workspace = true
chrono.workspace = true
jsonwebtoken = { version = "10.3.0", default-features = false, features = ["aws_lc_rs", "use_pem"] }
nvbes-identity-sdk = { path = "../identity-sdk-backend" }
nvbes-core = { path = "../core" }
nvbes-dpop = { path = "../dpop", features = ["resource-server"] }
nvbes-observability = { path = "../observability", features = ["otlp"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle = "2.6.1"
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
async-trait.workspace = true
rsa = "0.9.10"
openssl.workspace = true
tower = "0.5"

[lints]
workspace = true
