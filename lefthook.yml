pre-commit:
  commands:
    check:
      glob: '*.{js,ts,cjs,mjs,jsx,tsx,json,jsonc,css,scss,md,html}'
      exclude:
        - 'archive/**'
      run: pnpm exec vp check --fix {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit "{1}"

pre-push:
  commands:
    doc-validate:
      run: pnpm doc:validate
    check:
      run: pnpm check:web
