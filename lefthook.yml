min_version: 2.1.12
output:
  - execution_out
  - failure

# Rigueur maximale, ultra-rapide et ciblé.
# pre-commit = validation rapide sur diff stagé (hygiène, secrets, format, ratchets).
# pre-push = vérification locale avant push (plage commits, build, lint, micro-tests).
# Les tests d'intégration complets, analyses de sécurité lourdes et coverage tournent en CI.

pre-commit:
  parallel: false
  commands:
    00-ssh-signing:
      run: node tools/ci/check-commit-ssh-signing.mjs --config
      fail_text: 'BLOCKED commit signing KO - commits non signes refuses. Activer commit.gpgsign + signingkey.'
    00-agent-protected:
      run: pnpm check:agent-protected-paths
      fail_text: 'BLOCKED llm-commit-policy KO - trailer AI-Assisted manquant.'
    00-thresholds-monotone:
      run: pnpm check:thresholds-monotone
      fail_text: 'BLOCKED thresholds-monotone KO - seuil abaissé ou crate exclu.'
    00-weak-assertions:
      run: node --test tools/ci/check-weak-assertions.test.mjs && node tools/ci/check-weak-assertions.mjs --staged
      fail_text: 'BLOCKED weak-assertions KO - assert!(is_err/is_ok) ajouté dans le diff.'
    00-unwrap-ratchet:
      run: pnpm check:unwrap-ratchet
      fail_text: 'BLOCKED unwrap-ratchet KO - unwrap/expect ajouté hors tests.'
    00-sqlx-ratchet:
      run: pnpm check:sqlx-ratchet
      fail_text: 'BLOCKED sqlx-ratchet KO - sqlx::query runtime ajouté (utiliser query!).'
    00-upstream-rules:
      run: pnpm check:upstream-rules
      fail_text: 'BLOCKED upstream-rules KO - violation règles SonarQube/CodeQL/CI détectée dans le diff.'
    00-secrets:
      run: node tools/security/scan-secrets.mjs
      fail_text: 'BLOCKED secrets - scan-secrets KO. Corriger avant commit.'
    01-env:
      run: pnpm env:check
      fail_text: 'BLOCKED env-check KO. Variables environnement invalides.'
    02-format:
      run: pnpm format:check
      fail_text: 'BLOCKED format-check KO. Lancer pnpm format puis recommiter.'
    03-vp-staged:
      glob: '*.{js,ts,cjs,mjs,jsx,tsx}'
      exclude:
        - 'archive/**'
      run: pnpm exec vp check {staged_files}
      fail_text: 'BLOCKED vp check sur fichiers stages KO.'
    10-structure:
      run: pnpm check:structure
      fail_text: 'BLOCKED check-structure KO. Arborescence non conforme.'
    11-nx-boundaries:
      run: pnpm check:nx-boundaries
      fail_text: 'BLOCKED check-nx-boundaries KO.'
    12-product-boundaries:
      run: pnpm check:product-boundaries
      fail_text: 'BLOCKED check-product-boundaries KO.'
    15-workflows:
      run: pnpm check:workflows
      fail_text: 'BLOCKED check-workflows KO.'

commit-msg:
  commands:
    commitlint:
      # --strict matches .github/workflows/commitlint.yml (warnings promus en erreurs).
      run: pnpm exec commitlint --strict --edit "{1}"
      fail_text: 'BLOCKED commitlint strict KO. Message non conventionnel.'
    agent-protected:
      run: node tools/ci/check-agent-protected-paths.mjs --edit "{1}"
      fail_text: 'BLOCKED llm-commit-policy KO - trailer AI-Assisted manquant.'

pre-push:
  parallel: false
  commands:
    00-commitlint-range:
      # Filet anti --no-verify sur commit-msg: same range check as CI commitlint.
      run: node tools/ci/commitlint-range.mjs --base origin/main --head HEAD
      fail_text: 'BLOCKED commitlint range KO - message(s) hors conventional (ex. body > 100 chars).'
    01-ssh-signing-range:
      # Filet anti --no-gpg-sign: chaque commit de la plage doit etre signe (SSH ou OpenPGP).
      run: node tools/ci/check-commit-ssh-signing.mjs --base origin/main --head HEAD
      fail_text: 'BLOCKED commit signatures KO - commits non signes refuses.'
    10-check-web:
      run: pnpm check:web
      fail_text: 'BLOCKED check-web KO.'
    11-check-api:
      run: pnpm check:api
      fail_text: 'BLOCKED check-api KO. Lancer cargo check --workspace.'
    12-lint:
      run: pnpm lint
      fail_text: 'BLOCKED lint KO - web ou clippy -D warnings. Zero warning tolere.'
    13-micro-test:
      run: pnpm test:unit
      fail_text: 'BLOCKED test-unit KO - micro-tests isoles Rust.'
