pre-commit:
  commands:
    check:
      glob: '*.{js,ts,cjs,mjs,jsx,tsx,json,jsonc,css,scss,md,html}'
      exclude:
        - 'archive/**'
      run: pnpm exec vp check --fix {staged_files}
      stage_fixed: true

commit-msg:
  commands:
    commitlint:
      # --strict matches .github/workflows/commitlint.yml, which promotes
      # warnings (e.g. footer-leading-blank) to failures.
      run: pnpm exec commitlint --strict --edit "{1}"

pre-push:
  commands:
    doc-validate:
      run: pnpm doc:validate
    check:
      run: pnpm check:web
    affected:
      run: pnpm nx affected -t lint,typecheck,test,build --base=origin/main --head=HEAD --parallel=4
