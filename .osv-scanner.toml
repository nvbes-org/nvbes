# Every exception must identify one advisory, a security owner, an expiry date,
# and why the vulnerable path is not exploitable. Broad package ignores are
# deliberately forbidden.

[[IgnoredVulns]]
id = "RUSTSEC-2023-0071"
ignoreUntil = 2026-10-31
reason = "Owner: Security. Medium Marvin timing advisory has no fixed rsa release; no repository-owned RSA private-key operation uses this crate."

[[IgnoredVulns]]
id = "RUSTSEC-2026-0253"
ignoreUntil = 2026-10-11
reason = "Owner: Storage. aws-sdk-s3 1.137.0 pins lru 0.16.x; AWS cache keys have non-panicking Drop implementations, so the panic-safety path is not exploitable. Upgrade after the Rust 1.94 MSRV rollout."
