[package]
name = "nvbes-cloud-service"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
anyhow.workspace = true
axum.workspace = true
axum-server.workspace = true
base64.workspace = true
chrono.workspace = true
data-encoding.workspace = true
ed25519-dalek = "2.2.0"
hmac.workspace = true
jsonwebtoken = { version = "10.3.0", default-features = false, features = ["aws_lc_rs", "use_pem"] }
nvbes-core = { path = "../../libs/rust/core" }
nvbes-audit = { path = "../../libs/rust/audit" }
nvbes-redis = { path = "../../libs/rust/redis" }
nvbes-scan = { path = "../../libs/rust/scan" }
nvbes-storage = { path = "../../libs/rust/storage" }
nvbes-tenancy = { path = "../../libs/rust/tenancy" }
nvbes-observability = { path = "../../libs/rust/observability", features = ["otlp", "profiling"] }
nvbes-analytics-posthog = { path = "../../libs/rust/adapters/analytics-posthog" }
nvbes-product-analytics = { path = "../../libs/rust/product-analytics" }
nvbes-product-account = { path = "../../libs/rust/products/account" }
nvbes-product-cloud = { path = "../../libs/rust/products/cloud" }
nvbes-identity-sdk = { path = "../../libs/rust/identity-sdk-backend" }
nvbes-region = { path = "../../libs/rust/region" }
metrics.workspace = true
prost = "0.14.4"
prost-types = "0.14"
rand.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
tokio.workspace = true
tonic.workspace = true
tonic-prost = "0.14.6"
tower = "0.5"
tower-http = { workspace = true }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["json"] }
utoipa = { workspace = true }
utoipa-swagger-ui = { workspace = true }
uuid.workspace = true
zip.workspace = true
aws-config = { version = "=1.8.16", default-features = false, features = ["rt-tokio", "credentials-process", "sso", "default-https-client"] }
aws-sdk-s3 = { version = "=1.137.0", default-features = false, features = ["sigv4a", "http-1x", "default-https-client", "rt-tokio"] }

[build-dependencies]
protoc-bin-vendored = "3.2.0"
tonic-prost-build = "0.14.6"

[dev-dependencies]
nvbes-product-identity = { path = "../../libs/rust/products/identity" }
openssl = { version = "0.10", features = ["vendored"] }
proptest.workspace = true
