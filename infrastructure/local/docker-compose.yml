x-postgres: &postgres
  image: postgres:17-alpine
  container_name: nvbes-postgres
  environment:
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    POSTGRES_DB: nvbes
  ports:
    - "5432:5432"
  volumes:
    - nvbes_pgdata:/var/lib/postgresql/data
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U postgres -d nvbes"]
    interval: 5s
    timeout: 3s
    retries: 5

services:
  postgres:
    <<: *postgres
    profiles: [infra, full]

  redis:
    image: redis/redis-stack:7.4.0-v2
    container_name: nvbes-redis
    ports:
      - "6379:6379"
      - "8001:8001"
    volumes:
      - nvbes_redis_data:/data
    environment:
      REDIS_ARGS: "--requirepass ${REDIS_PASSWORD:-redis_dev} --maxmemory 256mb --maxmemory-policy volatile-ttl --appendonly yes --appendfsync everysec --save 60 1"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    profiles: [infra, full]

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: nvbes-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    profiles: [infra, full]

  seaweedfs:
    image: chrislusf/seaweedfs:3.80
    container_name: nvbes-seaweedfs
    command: ["server", "-dir=/data", "-s3", "-s3.config=/etc/seaweedfs/s3.json"]
    ports:
      - "8333:8333"
      - "9333:9333"
    volumes:
      - nvbes_seaweedfs_data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    profiles: [infra, full]

  # ── Profile: observability ────────────────────────────────────────────────
  mimir:
    image: grafana/mimir:latest
    container_name: nvbes-mimir
    profiles: [observability, full]
    command: ["-config.file=/etc/mimir.yaml"]
    volumes:
      - ./observability/mimir.yaml:/etc/mimir.yaml:ro
      - nvbes_mimir_data:/data
    ports:
      - "9009:9009"

  prometheus:
    image: prom/prometheus:latest
    container_name: nvbes-prometheus
    profiles: [observability, full]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - nvbes_prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/console_templates"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mimir:
        condition: service_started

  tempo:
    image: grafana/tempo:latest
    container_name: nvbes-tempo
    profiles: [observability, full]
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml:ro
    ports:
      - "3200:3200"
    depends_on:
      mimir:
        condition: service_started

  loki:
    image: grafana/loki:latest
    container_name: nvbes-loki
    profiles: [observability, full]
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "3100:3100"

  pyroscope:
    image: grafana/pyroscope:latest
    container_name: nvbes-pyroscope
    profiles: [observability, full]
    command: ["server"]
    ports:
      - "4041:4040"

  alloy:
    image: grafana/alloy:latest
    container_name: nvbes-alloy
    profiles: [observability, full]
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --stability.level=public-preview
      - /etc/alloy/config.alloy
    volumes:
      - ./observability/alloy.local.alloy:/etc/alloy/config.alloy:ro
      - ./observability/app-logs:/var/log/nvbes:ro
      - nvbes_alloy_data:/var/lib/alloy
    ports:
      - "12345:12345"
      - "12347:12347"
      - "14317:4317"
      - "14318:4318"
      - "4040:4040"
    depends_on:
      tempo:
        condition: service_started
      loki:
        condition: service_started
      pyroscope:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:12345/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 3

  grafana:
    image: grafana/grafana:latest
    container_name: nvbes-grafana
    profiles: [observability, full]
    volumes:
      - ./observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./observability/grafana-provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./observability/grafana-provisioning/alerting:/etc/grafana/provisioning/alerting:ro
      - ./observability/grafana-dashboards:/var/lib/grafana/dashboards/nvbes:ro
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    ports:
      - "3000:3000"
    depends_on:
      mimir:
        condition: service_started
      prometheus:
        condition: service_started
      tempo:
        condition: service_started
      loki:
        condition: service_started
      pyroscope:
        condition: service_started
      alloy:
        condition: service_started

  k6-identity-smoke:
    image: grafana/k6:latest
    container_name: nvbes-k6-identity-smoke
    profiles: [loadtest]
    command: ["run", "-o", "experimental-prometheus-rw", "/scripts/identity-smoke.js"]
    environment:
      K6_PROMETHEUS_RW_SERVER_URL: http://mimir:9009/api/v1/push
      K6_PROMETHEUS_RW_TREND_STATS: p(50),p(95),p(99),min,max
      ACCOUNT_SERVICE_BASE_URL: ${ACCOUNT_SERVICE_BASE_URL:-http://host.docker.internal:4000}
    volumes:
      - ./observability/k6:/scripts:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      mimir:
        condition: service_started

  alloy-beyla:
    image: grafana/alloy:latest
    container_name: nvbes-alloy-beyla
    profiles: [beyla]
    privileged: true
    pid: host
    network_mode: host
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12346
      - --stability.level=experimental
      - /etc/alloy/config.alloy
    volumes:
      - ./observability/alloy.beyla.alloy:/etc/alloy/config.alloy:ro
      - /sys/kernel/debug:/sys/kernel/debug:ro
      - /sys/fs/bpf:/sys/fs/bpf
      - /proc:/host/proc:ro

volumes:
  nvbes_seaweedfs_data:
  nvbes_alloy_data:
  nvbes_mimir_data:
  nvbes_pgdata:
  nvbes_prometheus_data:
  nvbes_redis_data:
