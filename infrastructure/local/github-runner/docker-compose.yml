      CARGO_BUILD_JOBS: "6"
      CARGO_TERM_COLOR: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - pnpm-store:/home/runner/.local/share/pnpm/store

volumes:
  cargo-registry:
  cargo-git:
  pnpm-store:
