services:
  github-runner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nvbes-github-runner
    restart: unless-stopped
    environment:
      GITHUB_REPOSITORY_URL: https://github.com/nvbes-org/nvbes
      RUNNER_TOKEN: ${RUNNER_TOKEN}
      RUNNER_NAME: nvbes-docker-runner
      RUNNER_LABELS: self-hosted,linux,ARM64,docker,macOS
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
