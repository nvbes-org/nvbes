services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - '127.0.0.1:${NVBES_IDENTITY_E2E_POSTGRES_PORT:-55432}:5432'
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./identity-e2e.init.sql:/docker-entrypoint-initdb.d/identity-e2e.init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d nvbes_identity_test_e2e']
      interval: 2s
      timeout: 3s
      retries: 30
    security_opt:
      - no-new-privileges:true
