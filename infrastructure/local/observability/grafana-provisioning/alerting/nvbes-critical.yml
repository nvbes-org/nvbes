apiVersion: 1

groups:
  - orgId: 1
    name: nvbes-critical
    folder: nvbes
    interval: 1m
    rules:
      - uid: nvbes-api-5xx-high
        title: API 5xx high
        condition: C
        for: 5m
        noDataState: NoData
        execErrState: Error
        annotations:
          description: API 5xx ratio is above 2% for 5 minutes.
          runbook_url: docs/operations/incident-runbooks.md#api-5xx-high
        labels:
          severity: critical
          owner: engineering
          signal: metrics
        data:
          - refId: A
            datasourceUid: Prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              datasource:
                type: prometheus
                uid: Prometheus
              editorMode: code
              expr: sum(rate(http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(http_requests_total[5m])), 1) * 100
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              conditions:
                - evaluator:
                    params: []
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - B
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              conditions:
                - evaluator:
                    params:
                      - 2
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              refId: C
              type: threshold

      - uid: nvbes-worker-failures
        title: Worker failures increasing
        condition: C
        for: 10m
        noDataState: NoData
        execErrState: Error
        annotations:
          description: Worker jobs are failing for 10 minutes.
          runbook_url: docs/operations/incident-runbooks.md#worker-jobs
        labels:
          severity: critical
          owner: engineering
          signal: metrics
        data:
          - refId: A
            datasourceUid: Prometheus
            relativeTimeRange:
              from: 900
              to: 0
            model:
              datasource:
                type: prometheus
                uid: Prometheus
              editorMode: code
              expr: sum(increase(worker_queue_jobs_total{outcome=~"failure|dead_letter"}[10m]))
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 900
              to: 0
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 900
              to: 0
            model:
              conditions:
                - evaluator:
                    params:
                      - 0
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              refId: C
              type: threshold

      - uid: nvbes-postgres-pool-saturation
        title: PostgreSQL pool saturation
        condition: C
        for: 5m
        noDataState: NoData
        execErrState: Error
        annotations:
          description: PostgreSQL connection pool active ratio is above 90%.
          runbook_url: docs/operations/incident-runbooks.md#postgres-saturation
        labels:
          severity: critical
          owner: engineering
          signal: metrics
        data:
          - refId: A
            datasourceUid: Prometheus
            relativeTimeRange:
              from: 600
              to: 0
            model:
              datasource:
                type: prometheus
                uid: Prometheus
              editorMode: code
              expr: max((postgres_pool_size - postgres_pool_idle) / clamp_min(postgres_pool_size, 1) * 100)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 600
              to: 0
            model:
              conditions:
                - evaluator:
                    params:
                      - 90
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              refId: C
              type: threshold
