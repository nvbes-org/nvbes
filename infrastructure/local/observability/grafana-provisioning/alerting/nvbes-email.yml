apiVersion: 1

groups:
  - orgId: 1
    name: nvbes-email
    folder: nvbes
    interval: 1m
    rules:
      - uid: nvbes-email-queue-stale
        title: Email queue is stale
        condition: C
        for: 5m
        noDataState: Alerting
        execErrState: Error
        annotations:
          description: The oldest accepted email has waited more than five minutes.
          runbook_url: docs/operations/email-delivery-runbook.md#deadline-incidents
        labels: { severity: critical, owner: platform, signal: metrics }
        data:
          - refId: A
            datasourceUid: Prometheus
            relativeTimeRange: { from: 900, to: 0 }
            model:
              datasource: { type: prometheus, uid: Prometheus }
              editorMode: code
              expr: max(email_queue_oldest_age_seconds)
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [300], type: gt }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { params: [], type: last }
                  type: query
              datasource: { type: __expr__, uid: __expr__ }
              expression: B
              refId: C
              type: threshold

      - uid: nvbes-email-provider-error-rate
        title: Email provider error rate is elevated
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        annotations:
          description: More than five percent of provider attempts are failing.
          runbook_url: docs/operations/email-delivery-runbook.md#provider-incidents
        labels: { severity: critical, owner: platform, signal: metrics }
        data:
          - refId: A
            datasourceUid: Prometheus
            relativeTimeRange: { from: 1200, to: 0 }
            model:
              datasource: { type: prometheus, uid: Prometheus }
              editorMode: code
              expr: 'sum(rate(email_messages_total{outcome=~"transient_failure|ambiguous_failure|permanent_failure"}[5m])) / clamp_min(sum(rate(email_messages_total{outcome=~"provider_accepted|transient_failure|ambiguous_failure|permanent_failure"}[5m])), 0.001)'
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [0.05], type: gt }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { params: [], type: last }
                  type: query
              datasource: { type: __expr__, uid: __expr__ }
              expression: B
              refId: C
              type: threshold

      - uid: nvbes-email-complaint-rate
        title: Email complaint rate is elevated
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        annotations:
          description: Spam complaints exceed 0.1 percent of recent provider events.
          runbook_url: docs/operations/email-delivery-runbook.md#deliverability-incidents
        labels: { severity: critical, owner: platform, signal: metrics }
        data:
          - refId: A
            datasourceUid: Prometheus
            relativeTimeRange: { from: 1800, to: 0 }
            model:
              datasource: { type: prometheus, uid: Prometheus }
              editorMode: code
              expr: 'sum(rate(email_provider_webhooks_total{event_type="email_spam",outcome="state_applied"}[15m])) / clamp_min(sum(rate(email_provider_webhooks_total[15m])), 0.001)'
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              datasource: { type: __expr__, uid: __expr__ }
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { params: [0.001], type: gt }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { params: [], type: last }
                  type: query
              datasource: { type: __expr__, uid: __expr__ }
              expression: B
              refId: C
              type: threshold
