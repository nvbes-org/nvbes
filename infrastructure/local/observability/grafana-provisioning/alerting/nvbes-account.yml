apiVersion: 1

groups:
  - orgId: 1
    name: nvbes-account
    folder: nvbes
    interval: 1m
    rules:
      - uid: nvbes-account-worker-heartbeat-stale
        title: Account worker heartbeat stale
        condition: C
        for: 5m
        noDataState: Alerting
        execErrState: Error
        annotations:
          description: Account worker has not emitted a heartbeat for more than 7 minutes.
          runbook_url: docs/operations/incident-runbooks.md#worker-jobs
        labels:
          severity: critical
          owner: account
          signal: metrics
        data:
          - refId: A
            datasourceUid: Prometheus
            relativeTimeRange:
              from: 900
              to: 0
            model:
              datasource:
                type: prometheus
                uid: Prometheus
              editorMode: code
              expr: time() - max(worker_heartbeat_timestamp_seconds{job="account-worker"})
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 900
              to: 0
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 900
              to: 0
            model:
              conditions:
                - evaluator:
                    params:
                      - 420
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              refId: C
              type: threshold

      - uid: nvbes-account-worker-queue-stale
        title: Account worker queue is stale
        condition: C
        for: 10m
        noDataState: NoData
        execErrState: Error
        annotations:
          description: An Account job has remained pending or failed for more than 10 minutes.
          runbook_url: docs/operations/incident-runbooks.md#worker-jobs
        labels:
          severity: critical
          owner: account
          signal: metrics
        data:
          - refId: A
            datasourceUid: Prometheus
            relativeTimeRange:
              from: 1200
              to: 0
            model:
              datasource:
                type: prometheus
                uid: Prometheus
              editorMode: code
              expr: max(worker_queue_oldest_age_seconds{job="account-worker",status=~"pending|failed"})
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange:
              from: 1200
              to: 0
            model:
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              reducer: last
              refId: B
              type: reduce
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange:
              from: 1200
              to: 0
            model:
              conditions:
                - evaluator:
                    params:
                      - 600
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: B
              refId: C
              type: threshold
