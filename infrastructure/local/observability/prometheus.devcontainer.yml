global:
  scrape_interval: 5s
  evaluation_interval: 5s

remote_write:
  - url: http://nvbes-devcontainer-mimir:9009/api/v1/push
    send_exemplars: true

scrape_configs:
  - job_name: 'api'
    static_configs:
      - targets: ['workspace:8080']
        labels:
          service: 'api'
          runtime: 'devcontainer'

  - job_name: 'worker'
    static_configs:
      - targets: ['workspace:8081']
        labels:
          service: 'worker'
          runtime: 'devcontainer'

  - job_name: 'grafana-stack'
    static_configs:
      - targets:
          - 'nvbes-devcontainer-prometheus:9090'
          - 'nvbes-devcontainer-tempo:3200'
          - 'nvbes-devcontainer-loki:3100'
          - 'nvbes-devcontainer-pyroscope:4040'
          - 'nvbes-devcontainer-grafana:3000'
