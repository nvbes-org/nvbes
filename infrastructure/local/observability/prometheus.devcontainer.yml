global:
  scrape_interval: 5s
  evaluation_interval: 5s

remote_write:
  - url: http://nvbes-devcontainer-mimir:9009/api/v1/push
    send_exemplars: true

scrape_configs:
  - job_name: 'account-service'
    static_configs:
      - targets: ['workspace:4000']
        labels:
          service: 'account-service'
          runtime: 'devcontainer'

  - job_name: 'cloud-service'
    static_configs:
      - targets: ['workspace:4002']
        labels:
          service: 'cloud-service'
          runtime: 'devcontainer'

  - job_name: 'billing-service'
    static_configs:
      - targets: ['workspace:4020']
        labels:
          service: 'billing-service'
          runtime: 'devcontainer'

  - job_name: 'cloud-worker'
    static_configs:
      - targets: ['workspace:4101']
        labels:
          service: 'cloud-worker'
          runtime: 'devcontainer'

  - job_name: 'account-worker'
    static_configs:
      - targets: ['workspace:4102']
        labels:
          service: 'account-worker'
          runtime: 'devcontainer'

  - job_name: 'billing-worker'
    static_configs:
      - targets: ['workspace:4104']
        labels:
          service: 'billing-worker'
          runtime: 'devcontainer'

  - job_name: 'grafana-stack'
    static_configs:
      - targets:
          - 'nvbes-devcontainer-prometheus:9090'
          - 'nvbes-devcontainer-tempo:3200'
          - 'nvbes-devcontainer-loki:3100'
          - 'nvbes-devcontainer-pyroscope:4040'
          - 'nvbes-devcontainer-grafana:3000'
