services:
  mimir:
    image: grafana/mimir:latest
    container_name: nvbes-mimir
    command: ["-config.file=/etc/mimir.yaml"]
    volumes:
      - ./mimir.yaml:/etc/mimir.yaml:ro
      - nvbes_mimir_data:/data
    ports:
      - "9009:9009"

  prometheus:
    image: prom/prometheus:latest
    container_name: nvbes-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - nvbes_prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/console_templates'
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mimir

  tempo:
    image: grafana/tempo:latest
    container_name: nvbes-tempo
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
    ports:
      - "3200:3200"   # tempo
    depends_on:
      - mimir

  loki:
    image: grafana/loki:latest
    container_name: nvbes-loki
    command: [ "-config.file=/etc/loki/local-config.yaml" ]
    ports:
      - "3100:3100"

  pyroscope:
    image: grafana/pyroscope:latest
    container_name: nvbes-pyroscope
    command: [ "server" ]
    ports:
      - "4041:4040"

  alloy:
    image: grafana/alloy:latest
    container_name: nvbes-alloy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --stability.level=public-preview
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy.local.alloy:/etc/alloy/config.alloy:ro
      - ./app-logs:/var/log/nvbes:ro
      - nvbes_alloy_data:/var/lib/alloy
    ports:
      - "12345:12345"
      - "12347:12347"
      - "14317:4317"
      - "14318:4318"
      - "4040:4040"
    depends_on:
      - tempo
      - loki
      - pyroscope
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:12345/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 3

  grafana:
    image: grafana/grafana:latest
    container_name: nvbes-grafana
    volumes:
      - ./grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./grafana-provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana-provisioning/alerting:/etc/grafana/provisioning/alerting:ro
      - ./grafana-dashboards:/var/lib/grafana/dashboards/nvbes:ro
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    ports:
      - "3000:3000"
    depends_on:
      - mimir
      - prometheus
      - tempo
      - loki
      - pyroscope
      - alloy

  k6-identity-smoke:
    image: grafana/k6:latest
    container_name: nvbes-k6-identity-smoke
    profiles: [loadtest]
    command: ["run", "-o", "experimental-prometheus-rw", "/scripts/identity-smoke.js"]
    environment:
      K6_PROMETHEUS_RW_SERVER_URL: http://mimir:9009/api/v1/push
      K6_PROMETHEUS_RW_TREND_STATS: p(50),p(95),p(99),min,max
      ACCOUNT_SERVICE_BASE_URL: ${ACCOUNT_SERVICE_BASE_URL:-http://host.docker.internal:4000}
    volumes:
      - ./k6:/scripts:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mimir

  alloy-beyla:
    image: grafana/alloy:latest
    container_name: nvbes-alloy-beyla
    profiles: [beyla]
    privileged: true
    pid: host
    network_mode: host
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12346
      - --stability.level=experimental
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy.beyla.alloy:/etc/alloy/config.alloy:ro
      - /sys/kernel/debug:/sys/kernel/debug:ro
      - /sys/fs/bpf:/sys/fs/bpf
      - /proc:/host/proc:ro

volumes:
  nvbes_alloy_data:
  nvbes_mimir_data:
  nvbes_prometheus_data:
