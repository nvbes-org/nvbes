apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true

  - name: Tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: true
    jsonData:
      httpMethod: GET
      serviceMap:
        datasourceUid: 'Prometheus'
      nodeGraph:
        enabled: true
      search:
        hide: false
      lokiSearch:
        datasourceUid: 'Loki'
      tracesToMetrics:
        datasourceUid: 'Prometheus'
        spanAttributes: [ 'service.name', 'http.method', 'http.status_code' ]
        tags: [ 'job', 'instance' ]
        queries:
          - name: 'Sample Query'
            query: 'sum(rate(http_request_duration_seconds_count{$$__tags}[5m]))'
