services:
  grafana-alloy:
    image: ${GRAFANA_ALLOY_IMAGE:?Set a pinned grafana/alloy image or digest}
    container_name: nvbes-grafana-alloy
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --stability.level=public-preview
      - /etc/alloy/config.alloy
    environment:
      GRAFANA_CLOUD_PROMETHEUS_URL: ${GRAFANA_CLOUD_PROMETHEUS_URL:?Set Grafana Cloud Prometheus remote_write URL}
      GRAFANA_CLOUD_PROMETHEUS_USER: ${GRAFANA_CLOUD_PROMETHEUS_USER:?Set Grafana Cloud Prometheus user}
      GRAFANA_CLOUD_OTLP_ENDPOINT: ${GRAFANA_CLOUD_OTLP_ENDPOINT:?Set Grafana Cloud OTLP endpoint}
      GRAFANA_CLOUD_OTLP_USER: ${GRAFANA_CLOUD_OTLP_USER:?Set Grafana Cloud OTLP user}
      GRAFANA_CLOUD_LOKI_URL: ${GRAFANA_CLOUD_LOKI_URL:?Set Grafana Cloud Loki URL}
      GRAFANA_CLOUD_LOKI_USER: ${GRAFANA_CLOUD_LOKI_USER:?Set Grafana Cloud Loki user}
      GRAFANA_CLOUD_PROFILES_URL: ${GRAFANA_CLOUD_PROFILES_URL:?Set Grafana Cloud Profiles URL}
      GRAFANA_CLOUD_PROFILES_USER: ${GRAFANA_CLOUD_PROFILES_USER:?Set Grafana Cloud Profiles user}
      POSTHOG_OTLP_HOST: ${POSTHOG_OTLP_HOST:-https://eu.i.posthog.com}
      POSTHOG_OTLP_LOGS_ENDPOINT: ${POSTHOG_OTLP_LOGS_ENDPOINT:-https://eu.i.posthog.com/i/v1/logs}
      POSTHOG_OTLP_TRACES_ENDPOINT: ${POSTHOG_OTLP_TRACES_ENDPOINT:-https://eu.i.posthog.com/i/v1/traces}
      NVBES_ACCOUNT_SERVICE_METRICS_TARGET: ${NVBES_ACCOUNT_SERVICE_METRICS_TARGET:?Set account service metrics target}
      NVBES_CLOUD_SERVICE_METRICS_TARGET: ${NVBES_CLOUD_SERVICE_METRICS_TARGET:?Set cloud service metrics target}
      NVBES_CLOUD_WORKER_METRICS_TARGET: ${NVBES_CLOUD_WORKER_METRICS_TARGET:?Set cloud worker metrics target}
      NVBES_ACCOUNT_WORKER_METRICS_TARGET: ${NVBES_ACCOUNT_WORKER_METRICS_TARGET:?Set account worker metrics target}
    ports:
      - "127.0.0.1:${NVBES_ALLOY_HTTP_PORT:-12345}:12345"
      - "127.0.0.1:${NVBES_OTLP_GRPC_PORT:-4317}:4317"
      - "127.0.0.1:${NVBES_OTLP_HTTP_PORT:-4318}:4318"
      - "127.0.0.1:${NVBES_PYROSCOPE_PORT:-4040}:4040"
    volumes:
      - ./alloy.config.alloy:/etc/alloy/config.alloy:ro
      - ${NVBES_LOGS_DIR:?Set nvbes logs directory}:/var/log/nvbes:ro
      - ${GRAFANA_CLOUD_PROMETHEUS_TOKEN_FILE:?Set Grafana Cloud Prometheus token file}:/run/secrets/grafana_cloud_prometheus_token:ro
      - ${GRAFANA_CLOUD_OTLP_TOKEN_FILE:?Set Grafana Cloud OTLP token file}:/run/secrets/grafana_cloud_otlp_token:ro
      - ${GRAFANA_CLOUD_LOKI_TOKEN_FILE:?Set Grafana Cloud Loki token file}:/run/secrets/grafana_cloud_loki_token:ro
      - ${GRAFANA_CLOUD_PROFILES_TOKEN_FILE:?Set Grafana Cloud Profiles token file}:/run/secrets/grafana_cloud_profiles_token:ro
      - ${POSTHOG_PROJECT_TOKEN_FILE:?Set PostHog project token file}:/run/secrets/posthog_project_token:ro
      - ${NVBES_OBSERVABILITY_INTERNAL_TOKEN_FILE:?Set nvbes observability token file}:/run/secrets/nvbes_observability_internal_token:ro
      - alloy_data:/var/lib/alloy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:12345/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  alloy_data:
