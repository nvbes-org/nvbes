name: nvbes_devcontainer

services:
  workspace:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    command: sleep infinity
    init: true
    user: vscode
    volumes:
      - ..:/workspaces/nvbes:cached
      - nvbes_cargo_registry:/usr/local/cargo/registry
      - nvbes_cargo_git:/usr/local/cargo/git
      - nvbes_target:/workspaces/nvbes/target
      - nvbes_node_modules:/workspaces/nvbes/node_modules
      - nvbes_pnpm_store:/workspaces/nvbes/pnpm-store
      - nvbes_vscode_server:/home/vscode/.vscode-server
      - nvbes_vscode_server_insiders:/home/vscode/.vscode-server-insiders
      - nvbes_home_cache:/home/vscode/.cache
      - nvbes_home_codex:/home/vscode/.codex
      - nvbes_home_config:/home/vscode/.config
      - nvbes_home_gnupg:/home/vscode/.gnupg
      - nvbes_home_local_share:/home/vscode/.local/share
      - nvbes_home_ssh:/home/vscode/.ssh
    environment:
      CARGO_TARGET_DIR: /workspaces/nvbes/target
      GH_CONFIG_DIR: /home/vscode/.config/gh
      GIT_CONFIG_GLOBAL: /home/vscode/.config/git/config
      PNPM_HOME: /usr/local/node/bin
      NVBES_DEVCONTAINER: "true"
      NVBES_ENV: development
      NVBES_DATABASE_URL: postgres://postgres:postgres@postgres:5432/nvbes
      NVBES_DRIVE_DATABASE_URL: postgres://postgres:postgres@postgres:5432/nvbes_drive
      NVBES_REDIS_URL: redis://:redis_dev@redis:6379
      NVBES_API_BASE_URL: http://localhost:4000
      NVBES_IDENTITY_API_BASE_URL: http://localhost:4000
      NVBES_DRIVE_API_BASE_URL: http://localhost:4002
      VITE_IDENTITY_API_BASE_URL: http://localhost:4000
      VITE_DRIVE_API_BASE_URL: /api
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nvbes_dev

  postgres:
    image: postgres:17-alpine
    container_name: nvbes-devcontainer-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nvbes
    ports:
      - "127.0.0.1:${NVBES_DEVCONTAINER_POSTGRES_PORT:-15432}:5432"
    volumes:
      - nvbes_pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/10-init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nvbes"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - nvbes_dev

  redis:
    image: redis/redis-stack:7.4.0-v2
    container_name: nvbes-devcontainer-redis
    environment:
      REDIS_ARGS: "--requirepass redis_dev --maxmemory 256mb --maxmemory-policy volatile-lru"
    ports:
      - "127.0.0.1:${NVBES_DEVCONTAINER_REDIS_PORT:-16379}:6379"
      - "127.0.0.1:${NVBES_DEVCONTAINER_REDIS_INSIGHT_PORT:-18001}:8001"
    volumes:
      - nvbes_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_dev", "--raw", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - nvbes_dev

  prometheus:
    image: prom/prometheus:latest
    container_name: nvbes-devcontainer-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "127.0.0.1:${NVBES_DEVCONTAINER_PROMETHEUS_PORT:-19090}:9090"
    volumes:
      - ../infrastructure/local/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - nvbes_prometheus_data:/prometheus
    networks:
      - nvbes_dev

  tempo:
    image: grafana/tempo:latest
    container_name: nvbes-devcontainer-tempo
    command: ["-config.file=/etc/tempo.yaml"]
    ports:
      - "127.0.0.1:${NVBES_DEVCONTAINER_TEMPO_PORT:-13200}:3200"
      - "127.0.0.1:${NVBES_DEVCONTAINER_TEMPO_OTLP_GRPC_PORT:-14317}:4317"
      - "127.0.0.1:${NVBES_DEVCONTAINER_TEMPO_OTLP_HTTP_PORT:-14318}:4318"
    volumes:
      - ../infrastructure/local/observability/tempo.yaml:/etc/tempo.yaml:ro
    networks:
      - nvbes_dev

  loki:
    image: grafana/loki:latest
    container_name: nvbes-devcontainer-loki
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "127.0.0.1:${NVBES_DEVCONTAINER_LOKI_PORT:-13100}:3100"
    networks:
      - nvbes_dev

  pyroscope:
    image: grafana/pyroscope:latest
    container_name: nvbes-devcontainer-pyroscope
    command: ["server"]
    ports:
      - "127.0.0.1:${NVBES_DEVCONTAINER_PYROSCOPE_PORT:-14040}:4040"
    networks:
      - nvbes_dev

  grafana:
    image: grafana/grafana:latest
    container_name: nvbes-devcontainer-grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    ports:
      - "127.0.0.1:${NVBES_DEVCONTAINER_GRAFANA_PORT:-13000}:3000"
    volumes:
      - ../infrastructure/local/observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ../infrastructure/local/observability/grafana-provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../infrastructure/local/observability/grafana-provisioning/alerting:/etc/grafana/provisioning/alerting:ro
      - ../infrastructure/local/observability/grafana-dashboards:/var/lib/grafana/dashboards/nvbes:ro
    depends_on:
      - prometheus
      - tempo
      - loki
      - pyroscope
    networks:
      - nvbes_dev

volumes:
  nvbes_cargo_registry:
  nvbes_cargo_git:
  nvbes_home_cache:
  nvbes_home_codex:
  nvbes_home_config:
  nvbes_home_gnupg:
  nvbes_home_local_share:
  nvbes_home_ssh:
  nvbes_node_modules:
  nvbes_pgdata:
  nvbes_pnpm_store:
  nvbes_prometheus_data:
  nvbes_redis_data:
  nvbes_target:
  nvbes_vscode_server:
  nvbes_vscode_server_insiders:

networks:
  nvbes_dev:
    name: nvbes-devcontainer
