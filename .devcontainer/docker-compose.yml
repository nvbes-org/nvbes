name: nvbes_devcontainer

services:
  workspace:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    command: sleep infinity
    init: true
    user: vscode
    volumes:
      - ..:/workspaces/nvbes:cached
      - nvbes_cargo_registry:/usr/local/cargo/registry
      - nvbes_cargo_git:/usr/local/cargo/git
      - nvbes_target:/workspaces/nvbes/target
      - nvbes_node_modules:/workspaces/nvbes/node_modules
      - nvbes_pnpm_store:/workspaces/nvbes/pnpm-store
      - nvbes_vscode_server:/home/vscode/.vscode-server
      - nvbes_home_cache:/home/vscode/.cache
      - nvbes_home_config:/home/vscode/.config
      - nvbes_home_gnupg:/home/vscode/.gnupg
      - nvbes_home_ssh:/home/vscode/.ssh
    environment:
      CARGO_TARGET_DIR: /workspaces/nvbes/target
      GH_CONFIG_DIR: /home/vscode/.config/gh
      GIT_CONFIG_GLOBAL: /home/vscode/.config/git/config
      npm_config_store_dir: /workspaces/nvbes/pnpm-store
      PNPM_HOME: /usr/local/node/bin
      NX_DAEMON: "false"
      NVBES_DEVCONTAINER: "true"
      NVBES_ENV: development
      NVBES_DATABASE_URL: postgres://postgres:postgres@postgres:5432/nvbes
      NVBES_DRIVE_DATABASE_URL: postgres://postgres:postgres@postgres:5432/nvbes_drive
      NVBES_REDIS_URL: redis://:redis_dev@redis:6379
      STORAGE_ENABLED: "true"
      STORAGE_BUCKET: nvbes
      STORAGE_ENDPOINT: http://seaweedfs:8333
      STORAGE_REGION: eu-west-1
      STORAGE_ACCESS_KEY: nvbes
      STORAGE_SECRET_KEY: nvbes-dev-secret
      NVBES_EMAIL_PROVIDER: smtp
      NVBES_SMTP_HOST: mailhog
      NVBES_SMTP_PORT: "1025"
      NVBES_SMTP_STARTTLS: "false"
      NVBES_API_BASE_URL: http://localhost:4000
      NVBES_IDENTITY_API_BASE_URL: http://localhost:4000
      NVBES_DRIVE_API_BASE_URL: http://localhost:4002
      VITE_DRIVE_API_BASE_URL: /api
      NVBES_DRIVE_WORKER_METRICS_BIND_ADDR: 0.0.0.0:4101
      NVBES_IDENTITY_WORKER_METRICS_BIND_ADDR: 0.0.0.0:4102
      NVBES_BILLING_WORKER_METRICS_BIND_ADDR: 0.0.0.0:4104
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_started
      mailhog:
        condition: service_started
    networks:
      - nvbes_dev
    mem_limit: 6g
    mem_reservation: 1g
    pids_limit: 2048
    logging: &limited-logging
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  postgres:
    image: postgres:17-alpine
    container_name: nvbes-devcontainer-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nvbes
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - work_mem=2MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - max_connections=50
    ports:
      - "127.0.0.1:${NVBES_DEVCONTAINER_POSTGRES_PORT:-15432}:5432"
    volumes:
      - nvbes_pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/10-init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nvbes"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - nvbes_dev
    mem_limit: 384m
    mem_reservation: 64m
    pids_limit: 128
    logging: *limited-logging

  redis:
    image: redis:7.4-alpine
    container_name: nvbes-devcontainer-redis
    command:
      - redis-server
      - --requirepass
      - redis_dev
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - volatile-lru
      - --save
      - ""
      - --appendonly
      - "no"
    ports:
      - "127.0.0.1:${NVBES_DEVCONTAINER_REDIS_PORT:-16379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_dev", "--raw", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - nvbes_dev
    mem_limit: 128m
    mem_reservation: 16m
    pids_limit: 64
    logging: *limited-logging

  seaweedfs:
    image: chrislusf/seaweedfs:3.80
    container_name: nvbes-devcontainer-seaweedfs
    command: ["server", "-dir=/data", "-s3", "-s3.config=/etc/seaweedfs/s3.json"]
    ports:
      - "127.0.0.1:${NVBES_DEVCONTAINER_SEAWEEDFS_PORT:-18333}:8333"
      - "127.0.0.1:${NVBES_DEVCONTAINER_SEAWEEDFS_MASTER_PORT:-19333}:9333"
    volumes:
      - nvbes_seaweedfs_data:/data
      - ../infrastructure/local/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    networks:
      - nvbes_dev
    mem_limit: 384m
    mem_reservation: 64m
    pids_limit: 128
    logging: *limited-logging

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: nvbes-devcontainer-mailhog
    ports:
      - "127.0.0.1:${NVBES_DEVCONTAINER_SMTP_PORT:-11025}:1025"
      - "127.0.0.1:${NVBES_DEVCONTAINER_MAILHOG_PORT:-18025}:8025"
    environment:
      MH_MAX_MESSAGES: "1000"
    networks:
      - nvbes_dev
    mem_limit: 64m
    mem_reservation: 8m
    pids_limit: 64
    logging: *limited-logging

volumes:
  nvbes_seaweedfs_data:
  nvbes_cargo_registry:
  nvbes_cargo_git:
  nvbes_home_cache:
  nvbes_home_config:
  nvbes_home_gnupg:
  nvbes_home_ssh:
  nvbes_node_modules:
  nvbes_pgdata:
  nvbes_pnpm_store:
  nvbes_target:
  nvbes_vscode_server:

networks:
  nvbes_dev:
    name: nvbes-devcontainer
